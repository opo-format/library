# Per-class table: one entry per IFC class, refining its archetype.
# Class template sources (proposal 0002 §4). `opo generate` builds the templates from these files,
# the per-class table (classes.yaml) and the IFC data in ifc/. Licence: CC0-1.0.
IfcMember:
  archetype: "linear"
  name: "Member (class template)"
  description: "Member with a profile swept along a path: parametric profile (rectangle, I, circle, hollow sections, channel, angle), justification, roll and end extensions."
  default_type: "MEMBER"
IfcWall:
  archetype: "wall"
  name: "Wall (class template)"
  description: "Layered wall along a path: build-up of materials with hatches, location line, base and top constraints. Hosts doors, windows and openings."
  default_type: "STANDARD"
  layers:
    types-examples:
      kind: "types"
      system:
        name: "Example wall types (illustrative build-ups, not norm values)"
      variants:
        - name: "Concrete 200"
          values:
            layers:
              - material: "reinforced_concrete"
                thickness: 0.2
                function: "structure"
                core: true
            load_bearing: true
        - name: "Masonry 175, plastered both sides"
          values:
            layers:
              - material: "plaster"
                thickness: 0.015
                function: "finish"
              - material: "brick_masonry"
                thickness: 0.175
                function: "structure"
                core: true
              - material: "plaster"
                thickness: 0.015
                function: "finish"
        - name: "Partition, metal stud 75, 2 × 12.5 board each side"
          values:
            layers:
              - material: "plasterboard"
                thickness: 0.0125
                function: "finish"
              - material: "plasterboard"
                thickness: 0.0125
                function: "finish"
              - material: "mineral_wool"
                thickness: 0.075
                function: "insulation"
                core: true
              - material: "plasterboard"
                thickness: 0.0125
                function: "finish"
              - material: "plasterboard"
                thickness: 0.0125
                function: "finish"
          note: "Studs are not modelled; the stud zone is drawn as its insulation."
        - name: "External, concrete 200 + 120 insulation and render"
          values:
            layers:
              - material: "render"
                thickness: 0.01
                function: "finish"
              - material: "rigid_insulation"
                thickness: 0.12
                function: "insulation"
              - material: "reinforced_concrete"
                thickness: 0.2
                function: "structure"
                core: true
              - material: "plaster"
                thickness: 0.015
                function: "finish"
            is_external: true
            load_bearing: true
            location_line: "core_centre"
        - name: "External cavity wall, brick / insulation / block"
          values:
            layers:
              - material: "brick_masonry"
                thickness: 0.1025
                function: "finish"
              - material: "mineral_wool"
                thickness: 0.1
                function: "insulation"
              - material: "concrete_block"
                thickness: 0.1
                function: "structure"
                core: true
              - material: "plaster"
                thickness: 0.013
                function: "finish"
            is_external: true
            load_bearing: true
IfcSlab:
  archetype: "area"
  name: "Slab (class template)"
  description: "Layered slab from a boundary with holes: build-up from the top down with materials and hatches, reference face, offset from the storey."
  default_type: "FLOOR"
  layers:
    types-examples:
      kind: "types"
      system:
        name: "Example slab types (illustrative build-ups, not norm values)"
      variants:
        - name: "Concrete 200"
          values:
            layers:
              - material: "reinforced_concrete"
                thickness: 0.2
                function: "structure"
                core: true
        - name: "Floor, tiles on screed, insulation, concrete 250"
          values:
            layers:
              - material: "ceramic_tile"
                thickness: 0.01
                function: "finish"
              - material: "cement_screed"
                thickness: 0.065
                function: "finish"
              - material: "rigid_insulation"
                thickness: 0.03
                function: "insulation"
              - material: "reinforced_concrete"
                thickness: 0.25
                function: "structure"
                core: true
              - material: "plaster"
                thickness: 0.01
                function: "finish"
        - name: "Timber floor, boards 22 on structure 200"
          values:
            layers:
              - material: "timber"
                thickness: 0.022
                function: "finish"
              - material: "timber"
                thickness: 0.2
                function: "structure"
                core: true
              - material: "plasterboard"
                thickness: 0.0125
                function: "finish"
          note: "Joists are not modelled; the joist zone is one timber layer."
IfcBeam:
  archetype: "linear"
  name: "Beam (class template)"
  description: "Member with a profile swept along a path: parametric profile (rectangle, I, circle, hollow sections, channel, angle), justification, roll and end extensions."
  default_type: "BEAM"
  parameters:
    profile_kind:
      default: "rectangle"
    width:
      default: 0.25
    depth:
      default: 0.5
    wall_thickness:
      default: 0.006
    justification_v:
      default: "top"
    material:
      default: "reinforced_concrete"
  slots:
    path:
      default: [[0.0, 0.0, 0.0], [5.0, 0.0, 0.0]]
  materials:
    - "reinforced_concrete"
    - "timber"
  ifc:
    properties:
      Pset_BeamCommon.LoadBearing: "load_bearing"
  layers:
    profiles-examples:
      kind: "types"
      system:
        name: "Example profiles (values per row: see note)"
      variants:
        - name: "IPE 270"
          values:
            profile_kind: "i_section"
            profile_name: "IPE 270"
            width: 0.135
            depth: 0.27
            web_thickness: 0.0066
            flange_thickness: 0.0102
            material: "steel"
          note: "EN 10365:2017 table values (h 270, b 135, s 6.6, t 10.2 mm); root fillet not modelled. Full EN 10365 / AISC catalogue: to collect."
        - name: "Concrete 250 × 500"
          values:
            profile_kind: "rectangle"
            width: 0.25
            depth: 0.5
            material: "reinforced_concrete"
          note: "Generic size, not a norm."
        - name: "Glulam 140 × 400"
          values:
            profile_kind: "rectangle"
            width: 0.14
            depth: 0.4
            material: "timber"
          note: "Generic size; EN 14080 sizes to collect."
IfcBoiler:
  archetype: "point"
  name: "Boiler (class template)"
  description: "Boiler as a cased body with its pipe and flue connections, wall-hung or floor-standing, with a service clearance zone."
  default_type: "WATER"
  parameters:
    symbol_code:
      default: "BLR"
    pipe_size:
      type: "length"
      default: 0.022
      label: "Water connection outside diameter"
      group: "Connections"
      limits:
        min: 0.008
        max: 0.3
    gas_size:
      type: "length"
      default: 0.015
      label: "Gas connection outside diameter"
      group: "Connections"
      limits:
        min: 0.008
        max: 0.2
    flue_size:
      type: "length"
      default: 0.1
      label: "Flue diameter"
      group: "Connections"
      limits:
        min: 0.04
        max: 0.6
  rules:
    derived:
      connections:
        expr: "[{from: [-width / 2 + 0.07, depth / 2, bottom], to: [-width / 2 + 0.07, depth / 2, bottom - 0.05], d: pipe_size}, {from: [-width / 2 + 0.15, depth / 2, bottom], to: [-width / 2 + 0.15, depth / 2, bottom - 0.05], d: pipe_size}, {from: [width / 2 - 0.15, depth / 2, bottom], to: [width / 2 - 0.15, depth / 2, bottom - 0.05], d: gas_size}, {from: [0, depth / 2, top], to: [0, depth / 2, top + 0.1], d: flue_size}]"
        note: "Flow, return and gas along the underside, flue on top. Typical layout."
    checks:
      ports_fit:
        expr: "width >= 0.3"
        severity: "warning"
        message: "The body is narrower than the default connection layout; set port positions from maker data."
  ports:
    - name: "heating_flow"
      system_type: "HEATING"
      flow_direction: "SOURCE"
      port_type: "PIPE"
      nominal_size: "pipe_size"
      position: "connections[1].to"
      direction: "[0, 0, -1]"
    - name: "heating_return"
      system_type: "HEATING"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "pipe_size"
      position: "connections[2].to"
      direction: "[0, 0, -1]"
    - name: "gas"
      system_type: "GAS"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "gas_size"
      position: "connections[3].to"
      direction: "[0, 0, -1]"
    - name: "flue"
      system_type: "EXHAUST"
      flow_direction: "SOURCE"
      port_type: "DUCT"
      nominal_size: "flue_size"
      position: "connections[4].to"
      direction: "[0, 0, 1]"
IfcPipeFitting:
  archetype: "fitting"
  name: "Pipe fitting (class template)"
  description: "Pipe fitting whose form follows its predefined type: bend, junction (tee), transition (reducer), connector, cap, entry, exit. Sizes follow the connected pipes."
  default_type: "BEND"
IfcOpeningElement:
  archetype: "hosted"
  name: "Opening (class template)"
  description: "Opening or recess in a wall or slab, from a width × height rectangle or an edited outline; cuts its host."
  default_type: "OPENING"
IfcStair:
  archetype: "flight"
  name: "Stair (class template)"
  description: "Straight-run stair between two storeys: riser count from the rise and the maximum riser, going, width, concrete waist or solid, plan symbol with cut line and walking line."
  default_type: "STRAIGHT_RUN_STAIR"
IfcElementAssembly:
  archetype: "assembly"
  name: "Element assembly (class template)"
  description: "Assembly that nests other OPO objects. The template builds a flat truss (Warren or Pratt) from nested IfcMember class templates."
  default_type: "TRUSS"
IfcEnergyConversionDevice:
  archetype: "point"
  name: "Energy conversion device (class template)"
  description: "Generic energy conversion device (supertype) for plant with no specific IFC class: a body on the floor with one inlet and one outlet. Sizes are illustrative defaults, not maker or norm values."
  default_type: "NOTDEFINED"
  parameters:
    mount:
      default: "floor"
    width:
      default: 0.8
    depth:
      default: 0.6
    height:
      default: 1.2
    clearance_front:
      default: 0.6
    clearance_side:
      default: 0.05
    symbol_code:
      default: "EC"
    pipe_size:
      type: "length"
      default: 0.022
      label: "Pipe connection outside diameter"
      group: "Connections"
      limits:
        min: 0.008
        max: 0.6
  rules:
    derived:
      connections:
        expr: "[{from: [-width / 2 + width * 0.25, 0, bottom + height / 2], to: [-width / 2 + width * 0.25, -0.05, bottom + height / 2], d: pipe_size}, {from: [-width / 2 + width * 0.75, 0, bottom + height / 2], to: [-width / 2 + width * 0.75, -0.05, bottom + height / 2], d: pipe_size}]"
        note: "One stub per pipe or duct port."
  ports:
    - name: "inlet"
      system_type: "NOTDEFINED"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "pipe_size"
      position: "connections[1].to"
      direction: "[0, -1, 0]"
    - name: "outlet"
      system_type: "NOTDEFINED"
      flow_direction: "SOURCE"
      port_type: "PIPE"
      nominal_size: "pipe_size"
      position: "connections[2].to"
      direction: "[0, -1, 0]"
IfcAirToAirHeatRecovery:
  archetype: "point"
  name: "Air-to-air heat recovery unit (class template)"
  description: "Heat recovery unit with supply and extract air paths: outdoor and exhaust air on one end, supply and extract on the other. Sizes are illustrative defaults, not maker or norm values."
  default_type: "ROTARYWHEEL"
  parameters:
    mount:
      default: "floor"
    width:
      default: 1.6
    depth:
      default: 0.9
    height:
      default: 1.2
    clearance_front:
      default: 0.8
    clearance_side:
      default: 0.1
    symbol_code:
      default: "HRU"
    connection_material:
      default: "sheet_metal"
    duct_size:
      type: "length"
      default: 0.25
      label: "Duct connection diameter"
      group: "Connections"
      limits:
        min: 0.08
        max: 2.0
  rules:
    derived:
      connections:
        expr: "[{from: [-width / 2, depth * 0.25, bottom + height / 2], to: [-width / 2 - 0.05, depth * 0.25, bottom + height / 2], d: duct_size}, {from: [-width / 2, depth * 0.75, bottom + height / 2], to: [-width / 2 - 0.05, depth * 0.75, bottom + height / 2], d: duct_size}, {from: [width / 2, depth * 0.25, bottom + height / 2], to: [width / 2 + 0.05, depth * 0.25, bottom + height / 2], d: duct_size}, {from: [width / 2, depth * 0.75, bottom + height / 2], to: [width / 2 + 0.05, depth * 0.75, bottom + height / 2], d: duct_size}]"
        note: "One stub per pipe or duct port."
  ports:
    - name: "outdoor_air"
      system_type: "VENTILATION"
      flow_direction: "SINK"
      port_type: "DUCT"
      nominal_size: "duct_size"
      position: "connections[1].to"
      direction: "[-1, 0, 0]"
    - name: "exhaust_air"
      system_type: "EXHAUST"
      flow_direction: "SOURCE"
      port_type: "DUCT"
      nominal_size: "duct_size"
      position: "connections[2].to"
      direction: "[-1, 0, 0]"
    - name: "supply_air"
      system_type: "VENTILATION"
      flow_direction: "SOURCE"
      port_type: "DUCT"
      nominal_size: "duct_size"
      position: "connections[3].to"
      direction: "[1, 0, 0]"
    - name: "extract_air"
      system_type: "EXHAUST"
      flow_direction: "SINK"
      port_type: "DUCT"
      nominal_size: "duct_size"
      position: "connections[4].to"
      direction: "[1, 0, 0]"
IfcBurner:
  archetype: "point"
  name: "Burner (class template)"
  description: "Burner mounted on a boiler or furnace front: a compact body with a fuel connection. Sizes are illustrative defaults, not maker or norm values."
  default_type: "NOTDEFINED"
  parameters:
    mount:
      default: "wall"
    width:
      default: 0.4
    depth:
      default: 0.6
    height:
      default: 0.4
    mount_height:
      default: 0.6
    clearance_front:
      default: 0.6
    clearance_side:
      default: 0.1
    symbol_code:
      default: "BUR"
    gas_size:
      type: "length"
      default: 0.022
      label: "Gas connection outside diameter"
      group: "Connections"
      limits:
        min: 0.008
        max: 0.2
  rules:
    derived:
      connections:
        expr: "[{from: [-width / 2 + width * 0.5, depth / 2, bottom], to: [-width / 2 + width * 0.5, depth / 2, bottom - 0.05], d: gas_size}]"
        note: "One stub per pipe or duct port."
  ports:
    - name: "fuel"
      system_type: "GAS"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "gas_size"
      position: "connections[1].to"
      direction: "[0, 0, -1]"
IfcChiller:
  archetype: "point"
  name: "Chiller (class template)"
  description: "Packaged chiller with chilled water flow and return; water-cooled types add condenser water connections. Sizes are illustrative defaults, not maker or norm values."
  default_type: "AIRCOOLED"
  parameters:
    mount:
      default: "floor"
    width:
      default: 3.0
    depth:
      default: 1.2
    height:
      default: 1.8
    clearance_front:
      default: 1.2
    clearance_side:
      default: 0.8
    symbol_code:
      default: "CH"
    chw_size:
      type: "length"
      default: 0.076
      label: "Chilled water connection outside diameter"
      group: "Connections"
      limits:
        min: 0.015
        max: 0.6
    cw_size:
      type: "length"
      default: 0.089
      label: "Condenser water connection outside diameter"
      group: "Connections"
      limits:
        min: 0.015
        max: 0.6
    cable_size:
      type: "length"
      default: 0.02
      label: "Cable connection size"
      group: "Connections"
      limits:
        min: 0.005
        max: 0.2
  rules:
    derived:
      connections:
        expr: "[{from: [-width / 2, depth * 0.25, bottom + height / 2], to: [-width / 2 - 0.05, depth * 0.25, bottom + height / 2], d: chw_size}, {from: [-width / 2, depth * 0.75, bottom + height / 2], to: [-width / 2 - 0.05, depth * 0.75, bottom + height / 2], d: chw_size}, {from: [width / 2, depth * 0.25, bottom + height / 2], to: [width / 2 + 0.05, depth * 0.25, bottom + height / 2], d: cw_size}, {from: [width / 2, depth * 0.75, bottom + height / 2], to: [width / 2 + 0.05, depth * 0.75, bottom + height / 2], d: cw_size}]"
        note: "One stub per pipe or duct port."
  ports:
    - name: "chilled_water_flow"
      system_type: "CHILLEDWATER"
      flow_direction: "SOURCE"
      port_type: "PIPE"
      nominal_size: "chw_size"
      position: "connections[1].to"
      direction: "[-1, 0, 0]"
    - name: "chilled_water_return"
      system_type: "CHILLEDWATER"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "chw_size"
      position: "connections[2].to"
      direction: "[-1, 0, 0]"
    - name: "condenser_water_flow"
      system_type: "CONDENSERWATER"
      flow_direction: "SOURCE"
      port_type: "PIPE"
      nominal_size: "cw_size"
      position: "connections[3].to"
      direction: "[1, 0, 0]"
    - name: "condenser_water_return"
      system_type: "CONDENSERWATER"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "cw_size"
      position: "connections[4].to"
      direction: "[1, 0, 0]"
    - name: "power"
      system_type: "ELECTRICAL"
      flow_direction: "SINK"
      port_type: "CABLE"
      nominal_size: "cable_size"
      position: "[-width / 2 + width * 0.5, 0, bottom + height / 2]"
      direction: "[0, -1, 0]"
IfcCoil:
  archetype: "point"
  name: "Coil (class template)"
  description: "Heating or cooling coil in an air stream, with its fluid connections on one side. Sizes are illustrative defaults, not maker or norm values."
  default_type: "HYDRONICCOIL"
  parameters:
    mount:
      default: "floor"
    width:
      default: 0.8
    depth:
      default: 0.25
    height:
      default: 0.6
    clearance_front:
      default: 0.4
    clearance_side:
      default: 0.2
    symbol_code:
      default: "CL"
    hw_size:
      type: "length"
      default: 0.028
      label: "Heating water connection outside diameter"
      group: "Connections"
      limits:
        min: 0.012
        max: 0.3
    duct_size:
      type: "length"
      default: 0.25
      label: "Duct connection diameter"
      group: "Connections"
      limits:
        min: 0.08
        max: 2.0
  rules:
    derived:
      connections:
        expr: "[{from: [width / 2, depth * 0.25, bottom + height / 2], to: [width / 2 + 0.05, depth * 0.25, bottom + height / 2], d: hw_size}, {from: [width / 2, depth * 0.75, bottom + height / 2], to: [width / 2 + 0.05, depth * 0.75, bottom + height / 2], d: hw_size}, {from: [-width / 2 + width * 0.5, 0, bottom + height / 2], to: [-width / 2 + width * 0.5, -0.05, bottom + height / 2], d: duct_size}, {from: [-width / 2 + width * 0.5, depth, bottom + height / 2], to: [-width / 2 + width * 0.5, depth + 0.05, bottom + height / 2], d: duct_size}]"
        note: "One stub per pipe or duct port."
  ports:
    - name: "fluid_in"
      system_type: "HEATING"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "hw_size"
      position: "connections[1].to"
      direction: "[1, 0, 0]"
    - name: "fluid_out"
      system_type: "HEATING"
      flow_direction: "SOURCE"
      port_type: "PIPE"
      nominal_size: "hw_size"
      position: "connections[2].to"
      direction: "[1, 0, 0]"
    - name: "air_in"
      system_type: "AIRCONDITIONING"
      flow_direction: "SINK"
      port_type: "DUCT"
      nominal_size: "duct_size"
      position: "connections[3].to"
      direction: "[0, -1, 0]"
    - name: "air_out"
      system_type: "AIRCONDITIONING"
      flow_direction: "SOURCE"
      port_type: "DUCT"
      nominal_size: "duct_size"
      position: "connections[4].to"
      direction: "[0, 1, 0]"
IfcCondenser:
  archetype: "point"
  name: "Condenser (class template)"
  description: "Refrigerant condenser: refrigerant in and liquid out; water-cooled types add condenser water connections. Sizes are illustrative defaults, not maker or norm values."
  default_type: "AIRCOOLED"
  parameters:
    mount:
      default: "floor"
    width:
      default: 1.5
    depth:
      default: 0.8
    height:
      default: 1.2
    clearance_front:
      default: 1.0
    clearance_side:
      default: 0.6
    symbol_code:
      default: "CD"
    refrig_size:
      type: "length"
      default: 0.016
      label: "Refrigerant connection outside diameter"
      group: "Connections"
      limits:
        min: 0.006
        max: 0.1
    cable_size:
      type: "length"
      default: 0.02
      label: "Cable connection size"
      group: "Connections"
      limits:
        min: 0.005
        max: 0.2
  rules:
    derived:
      connections:
        expr: "[{from: [-width / 2, depth * 0.25, bottom + height / 2], to: [-width / 2 - 0.05, depth * 0.25, bottom + height / 2], d: refrig_size}, {from: [-width / 2, depth * 0.75, bottom + height / 2], to: [-width / 2 - 0.05, depth * 0.75, bottom + height / 2], d: refrig_size}]"
        note: "One stub per pipe or duct port."
  ports:
    - name: "refrigerant_in"
      system_type: "REFRIGERATION"
      flow_direction: "SINK"
      port_type: "PIPE"
      nominal_size: "refrig_size"
      position: "connections[1].to"
      direction: "[-1, 0, 0]"
    - name: "refrigerant_out"
      system_type: "REFRIGERATION"
      flow_direction: "SOURCE"
      port_type: "PIPE"
      nominal_size: "refrig_size"
      position: "connections[2].to"
      direction: "[-1, 0, 0]"
    - name: "power"
      system_type: "ELECTRICAL"
      flow_direction: "SINK"
      port_type: "CABLE"
      nominal_size: "cable_size"
      position: "[-width / 2 + width * 0.5, 0, bottom + height / 2]"
      direction: "[0, -1, 0]"
IfcCooledBeam:
  archetype: "point"
  name: "Cooled beam (class template)"
  description: "Chilled beam below the ceiling with chilled water flow and return; active beams also take primary air. Sizes are illustrative defaults, not maker or norm values."
  default_type: "ACTIVE"
  parameters:
    mount:
      default: "ceiling"
    width:
      default: 2.4
    depth:
      default: 0.6
    height:
      default: 0.25
    mount_height:
      default: 2.6
    clearance_front:
      default: 0.0
    clearance_side:
      default: 0.0
    symbol_code:
      default: "CB"
    water_size:
      type: "length"
      default: 0.022
      label: "Water connection outside diameter"
      group: "Connections"
      limits:
        min: 0.008
        max: 0.3
    duct_size:
      type: "length"
      default: 0.25
