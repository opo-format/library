    material:
      default: "reinforced_concrete"
    load_bearing:
      default: true
  recipe:
    plan_section:
      op: "union"
      plane: "xy"
      args:
        items: "[if profile_kind = \"circle\" or profile_kind = \"circ_hollow\" then circle([0, 0], width / 2) else rectangle([-width / 2, -depth / 2], [width / 2, depth / 2])]"
      note: "Plan symbol of a vertical member at its axis: the circle or the bounding rectangle of the profile."
  representations:
    plan.low:
      items:
        - geometry: "plan_section"
          class: "cut"
    plan.medium:
      items:
        - geometry: "plan_section"
          class: "cut"
      note: "Vertical member: drawn as its section at the axis."
  slots:
