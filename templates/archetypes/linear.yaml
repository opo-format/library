# Archetype `linear` (spec/objects/archetypes.md).
# Class template sources (proposal 0002 §4). `opo generate` builds the templates from these files,
# the per-class table (classes.yaml) and the IFC data in ifc/. Licence: CC0-1.0.
archetype: "linear"
description: "Profile along a path: beams, columns, members, segments."
parameters:
  profile_kind:
    type: "choice"
    default: "rect_hollow"
    label: "Profile"
    group: "Profile"
    options:
      - "rectangle"
      - "i_section"
      - "circle"
      - "rect_hollow"
      - "circ_hollow"
      - "channel"
      - "angle"
    option_labels:
      rectangle: "Rectangle"
      i_section: "I / H section"
      circle: "Circle"
      rect_hollow: "Rectangular hollow"
      circ_hollow: "Circular hollow"
      channel: "Channel (U)"
      angle: "Angle (L)"
    description: "Profiles from the shared profile library set these values by variant."
  profile_name:
    type: "text"
    default: ""
    label: "Profile designation"
    group: "Profile"
    description: "E.g. IPE 270; written to IFC ProfileName."
  width:
    type: "length"
    default: 0.1
    label: "Width / diameter"
    group: "Profile"
    limits:
      min: 0.005
      max: 5
  depth:
    type: "length"
    default: 0.1
    label: "Depth"
    group: "Profile"
    visible: "profile_kind != \"circle\" and profile_kind != \"circ_hollow\""
    limits:
      min: 0.005
      max: 5
  web_thickness:
    type: "length"
    default: 0.008
    label: "Web thickness"
    group: "Profile"
    visible: "profile_kind = \"i_section\" or profile_kind = \"channel\""
    limits:
      min: 0.001
      max: 0.2
  flange_thickness:
    type: "length"
    default: 0.012
    label: "Flange thickness"
    group: "Profile"
    visible: "profile_kind = \"i_section\" or profile_kind = \"channel\""
    limits:
      min: 0.001
      max: 0.2
  wall_thickness:
    type: "length"
    default: 0.005
    label: "Wall / leg thickness"
    group: "Profile"
    visible: "profile_kind = \"rect_hollow\" or profile_kind = \"circ_hollow\" or profile_kind = \"angle\""
    limits:
      min: 0.001
      max: 0.2
  justification_h:
    type: "choice"
    default: "centre"
    label: "Horizontal justification"
    group: "Placement"
    options:
      - "left"
      - "centre"
      - "right"
  justification_v:
    type: "choice"
    default: "centre"
    label: "Vertical justification"
    group: "Placement"
    options:
      - "top"
      - "centre"
      - "bottom"
  roll:
    type: "angle"
    default: 0.0
    label: "Rotation about the axis"
    group: "Placement"
    limits:
      min: -180
      max: 180
  start_extension:
    type: "length"
    default: 0.0
    label: "Start extension"
    group: "Placement"
    limits:
      min: -2
      max: 2
  end_extension:
    type: "length"
    default: 0.0
    label: "End extension"
    group: "Placement"
    limits:
      min: -2
      max: 2
  material:
    type: "material"
    default: "steel"
    label: "Material"
    group: "Materials"
    options: "materials"
  load_bearing:
    type: "boolean"
    default: true
    label: "Load bearing"
    group: "Data"
slots:
  path:
    type: "polyline3"
    default: [[0.0, 0.0, 0.0], [3.0, 0.0, 0.0]]
    rules:
      open: true
      min_segment_length: 0.01
    description: "Axis of the member (the justification point of the profile follows it)."
rules:
  derived:
    cu:
      expr: "if justification_h = \"left\" then -width / 2 else if justification_h = \"right\" then width / 2 else 0"
      note: "Profile centre, across."
    profile_height: "if profile_kind = \"circle\" or profile_kind = \"circ_hollow\" then width else depth"
    cv:
      expr: "if justification_v = \"top\" then -profile_height / 2 else if justification_v = \"bottom\" then profile_height / 2 else 0"
      note: "Profile centre, up."
    seg_start: "[path[2][1] - path[1][1], path[2][2] - path[1][2], path[2][3] - path[1][3]]"
    seg_end: "[path[count(path)][1] - path[count(path) - 1][1], path[count(path)][2] - path[count(path) - 1][2], path[count(path)][3] - path[count(path) - 1][3]]"
    len_start: "sqrt(seg_start[1] ** 2 + seg_start[2] ** 2 + seg_start[3] ** 2)"
    len_end: "sqrt(seg_end[1] ** 2 + seg_end[2] ** 2 + seg_end[3] ** 2)"
    p_start: "for k in 1..3 return path[1][k] - seg_start[k] / len_start * start_extension"
    p_end: "for k in 1..3 return path[count(path)][k] + seg_end[k] / len_end * end_extension"
    axis_path:
      expr: "concatenate([p_start], sublist(path, 2, count(path) - 2), [p_end])"
      note: "Axis with the end extensions applied."
    length: "sum(for i in 1..count(axis_path) - 1 return sqrt((axis_path[i + 1][1] - axis_path[i][1]) ** 2 + (axis_path[i + 1][2] - axis_path[i][2]) ** 2 + (axis_path[i + 1][3] - axis_path[i][3]) ** 2))"
    plan_path: "for p in axis_path return [p[1], p[2]]"
    area:
      expr: "if profile_kind = \"rectangle\" then width * depth else if profile_kind = \"i_section\" then 2 * width * flange_thickness + (depth - 2 * flange_thickness) * web_thickness else if profile_kind = \"circle\" then 3.141592653589793 * (width / 2) ** 2 else if profile_kind = \"rect_hollow\" then width * depth - (width - 2 * wall_thickness) * (depth - 2 * wall_thickness) else if profile_kind = \"circ_hollow\" then 3.141592653589793 * ((width / 2) ** 2 - (width / 2 - wall_thickness) ** 2) else if profile_kind = \"channel\" then 2 * width * flange_thickness + (depth - 2 * flange_thickness) * web_thickness else (width + depth - wall_thickness) * wall_thickness"
      note: "Cross-section area (fillets ignored)."
    density:
      expr: "if material = \"steel\" then 7850 else if material = \"reinforced_concrete\" then 2500 else if material = \"concrete\" then 2400 else null"
      note: "From the material (null if the material has no density)."
  checks:
    path_points:
      expr: "count(path) >= 2"
      severity: "error"
      message: "The path needs at least two points."
    walls_fit:
      expr: "not((profile_kind = \"rect_hollow\" or profile_kind = \"circ_hollow\") and 2 * wall_thickness >= min(width, profile_height))"
      severity: "error"
      message: "The wall thickness is too large for the profile."
    flanges_fit:
      expr: "not((profile_kind = \"i_section\" or profile_kind = \"channel\") and (2 * flange_thickness >= depth or web_thickness >= width))"
      severity: "error"
      message: "Flanges or web do not fit in the profile."
  rulesets: {}
recipe:
  profile:
    op: "union"
    plane: "profile"
    args:
      items: "[if profile_kind = \"rectangle\" then rectangle([cu + -width / 2, cv + -depth / 2], [cu + width / 2, cv + depth / 2]) else if profile_kind = \"i_section\" then union([rectangle([cu + -width / 2, cv + depth / 2 - flange_thickness], [cu + width / 2, cv + depth / 2]), rectangle([cu + -width / 2, cv + -depth / 2], [cu + width / 2, cv + -depth / 2 + flange_thickness]), rectangle([cu + -web_thickness / 2, cv + -depth / 2], [cu + web_thickness / 2, cv + depth / 2])]) else if profile_kind = \"circle\" then circle([cu, cv], width / 2) else if profile_kind = \"rect_hollow\" then difference(rectangle([cu + -width / 2, cv + -depth / 2], [cu + width / 2, cv + depth / 2]), rectangle([cu + -width / 2 + wall_thickness, cv + -depth / 2 + wall_thickness], [cu + width / 2 - wall_thickness, cv + depth / 2 - wall_thickness])) else if profile_kind = \"circ_hollow\" then difference(circle([cu, cv], width / 2), circle([cu, cv], width / 2 - wall_thickness)) else if profile_kind = \"channel\" then union([rectangle([cu + -width / 2, cv + depth / 2 - flange_thickness], [cu + width / 2, cv + depth / 2]), rectangle([cu + -width / 2, cv + -depth / 2], [cu + width / 2, cv + -depth / 2 + flange_thickness]), rectangle([cu + -width / 2, cv + -depth / 2], [cu + -width / 2 + web_thickness, cv + depth / 2])]) else union([rectangle([cu + -width / 2, cv + -depth / 2], [cu + -width / 2 + wall_thickness, cv + depth / 2]), rectangle([cu + -width / 2, cv + -depth / 2], [cu + width / 2, cv + -depth / 2 + wall_thickness])])]"
    note: "Profile in its own plane: u across (left of travel), v up."
  body:
    op: "sweep"
    args:
      profile: "profile"
      path: "axis_path"
      roll: "roll"
  axis:
    op: "path3"
    args:
      points: "axis_path"
  plan_band:
    op: "band"
    plane: "xy"
    args:
      path: "plan_path"
      left: "cu + width / 2"
      right: "cu - width / 2"
  plan_axis:
    op: "polyline"
    plane: "xy"
    args:
      points: "plan_path"
representations:
  model.low:
    context: "model"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "material"
  model.medium:
    context: "model"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "material"
  model.high:
    context: "model"
    lod: "high"
    scale:
      max_scale: 50
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "material"
  plan.low:
    context: "plan"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_axis"
        class: "overhead"
  plan.medium:
    context: "plan"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_band"
        class: "overhead"
    note: "Drawn as overhead outline (members above the plan cut). Where the member is cut by the plan (columns), the derived cut applies."
  plan.high:
    context: "plan"
    lod: "high"
    scale:
      max_scale: 50
    source: "derived"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    derive:
      from: "model.high"
      method: "cut_or_project"
  section:
    context: "section"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "SECTION_VIEW"
    derive:
      from: "model.{lod}"
      method: "cut"
  axis:
    context: "axis"
    lod: "all"
    source: "authored"
    ifc:
      context: "Axis"
      targetView: "GRAPH_VIEW"
    items:
      - geometry: "axis"
        class: "annotation"
host:
  is_host: false
  level: "Placed on a storey; path z relative to the storey elevation."
handles:
  - slot: "path"
    kind: "points"
    view:
      - "plan"
      - "model"
materials:
  - "steel"
ifc:
  properties:
    Pset_MemberCommon.LoadBearing: "load_bearing"
  quantities:
    Length: "length"
    CrossSectionArea: "area"
    GrossVolume: "area * length"
    NetVolume: "area * length"
    GrossWeight: "if density = null then null else area * length * density"
  profile_def:
    rectangle:
      entity: "IfcRectangleProfileDef"
      XDim: "width"
      YDim: "depth"
    i_section:
      entity: "IfcIShapeProfileDef"
      OverallWidth: "width"
      OverallDepth: "depth"
      WebThickness: "web_thickness"
      FlangeThickness: "flange_thickness"
    circle:
      entity: "IfcCircleProfileDef"
      Radius: "width / 2"
    rect_hollow:
      entity: "IfcRectangleHollowProfileDef"
      XDim: "width"
      YDim: "depth"
      WallThickness: "wall_thickness"
    circ_hollow:
      entity: "IfcCircleHollowProfileDef"
      Radius: "width / 2"
      WallThickness: "wall_thickness"
    channel:
      entity: "IfcUShapeProfileDef"
      Depth: "depth"
      FlangeWidth: "width"
      WebThickness: "web_thickness"
      FlangeThickness: "flange_thickness"
    angle:
      entity: "IfcLShapeProfileDef"
      Depth: "depth"
      Width: "width"
      Thickness: "wall_thickness"
    select: "profile_kind"
    ProfileName: "profile_name"
    ProfileType: "\"AREA\""
  body: "IfcExtrudedAreaSolid per straight segment along the axis (IfcFixedReferenceSweptAreaSolid for curved axes)"
