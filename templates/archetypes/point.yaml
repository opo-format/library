# Archetype `point` (spec/objects/archetypes.md).
# Class template sources (proposal 0002 §4). `opo generate` builds the templates from these files,
# the per-class table (classes.yaml) and the IFC data in ifc/. Licence: CC0-1.0.
archetype: "point"
description: "Placed equipment or component: a body with a mounting mode, service clearances, a plan code and optional connections. Classes set sizes, connections and ports."
parameters:
  mount:
    type: "choice"
    default: "wall"
    label: "Mounting"
    group: "Placement"
    options:
      - "wall"
      - "floor"
      - "ceiling"
  width:
    type: "length"
    default: 0.45
    label: "Width"
    group: "Size"
    limits:
      min: 0.1
      max: 5
    description: "Illustrative default; replace with maker data."
  depth:
    type: "length"
    default: 0.35
    label: "Depth"
    group: "Size"
    limits:
      min: 0.1
      max: 5
  height:
    type: "length"
    default: 0.75
    label: "Height"
    group: "Size"
    limits:
      min: 0.1
      max: 5
  mount_height:
    type: "length"
    default: 1.2
    label: "Underside above floor"
    group: "Placement"
    visible: "mount != \"floor\""
    limits:
      min: 0
      max: 5
  clearance_front:
    type: "length"
    default: 0.6
    label: "Service clearance, front"
    group: "Clearance"
    limits:
      min: 0
      max: 3
    description: "Project or maker value."
  clearance_side:
    type: "length"
    default: 0.05
    label: "Service clearance, sides"
    group: "Clearance"
    limits:
      min: 0
      max: 1
  symbol_code:
    type: "text"
    default: ""
    label: "Plan symbol code"
    group: "Drawing"
  casing_material:
    type: "material"
    default: "sheet_metal"
    label: "Body"
    group: "Materials"
    options: "materials"
  connection_material:
    type: "material"
    default: "copper"
    label: "Connections"
    group: "Materials"
    options: "materials"
    visible: "count(connections) > 0"
slots: {}
rules:
  derived:
    bottom: "if mount = \"floor\" then 0 else mount_height"
    top: "bottom + height"
    connections:
      expr: "[]"
      note: "Connection stubs drawn at high detail: a list of {from, to, d} (start point, end point, outside diameter). Classes give one per port."
  checks: {}
  rulesets: {}
recipe:
  body:
    op: "box"
    args:
      min: "[-width / 2, 0, bottom]"
      max: "[width / 2, depth, top]"
  stubs:
    op: "for_each"
    when: "count(connections) > 0"
    args:
      items: "connections"
      as: "c"
      do: "cylinder(c.from, c.to, c.d / 2)"
  plan_body:
    op: "rectangle"
    plane: "xy"
    args:
      min: "[-width / 2, 0]"
      max: "[width / 2, depth]"
  plan_clearance:
    op: "rectangle"
    plane: "xy"
    args:
      min: "[-width / 2 - clearance_side, depth]"
      max: "[width / 2 + clearance_side, depth + clearance_front]"
  plan_code:
    op: "text"
    plane: "xy"
    when: "symbol_code != \"\""
    args:
      at: "[0, depth / 2]"
      value: "symbol_code"
      height: "0.0025"
representations:
  model.low:
    context: "model"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "casing_material"
  model.medium:
    context: "model"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "casing_material"
  model.high:
    context: "model"
    lod: "high"
    scale:
      max_scale: 50
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "casing_material"
      - geometry: "stubs"
        material: "connection_material"
        part: "Connections"
  plan.low:
    context: "plan"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_body"
        class: "projected"
      - geometry: "plan_code"
        class: "annotation"
  plan.medium:
    context: "plan"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_body"
        class: "projected"
      - geometry: "plan_clearance"
        class: "annotation"
        role: "clearance"
      - geometry: "plan_code"
        class: "annotation"
  plan.high:
    context: "plan"
    lod: "high"
    scale:
      max_scale: 50
    source: "derived"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    derive:
      from: "model.high"
      method: "project"
    overlay:
      - geometry: "plan_clearance"
        class: "annotation"
        role: "clearance"
  elevation:
    context: "elevation"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "ELEVATION_VIEW"
    derive:
      from: "model.{lod}"
      method: "project"
  section:
    context: "section"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "SECTION_VIEW"
    derive:
      from: "model.{lod}"
      method: "cut"
host:
  is_host: false
  mounting:
    wall: "on_face: back of the body on the wall face"
    floor: "free: on the floor"
    ceiling: "free: below the ceiling, underside at mount_height"
  insertion:
    point: "[0, 0, 0]"
    description: "Centre of the back edge at floor level; y points away from the wall."
  clearance: "plan_clearance (annotation zone, used for clash checks; not exported as geometry)"
handles: []
ports: []
materials:
  - "copper"
  - "sheet_metal"
ifc: {}
