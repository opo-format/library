# Archetype `point` (spec/objects/archetypes.md).
# Class template sources (proposal 0002 §4). `opo generate` builds the templates from these files,
# the per-class table (classes.yaml) and the IFC data in ifc/. Licence: CC0-1.0.
archetype: "point"
description: "Placed equipment or component: insertion point and orientation, optional host and mounting mode."
parameters:
  mount:
    type: "choice"
    default: "wall"
    label: "Mounting"
    group: "Placement"
    options:
      - "wall"
      - "floor"
  width:
    type: "length"
    default: 0.45
    label: "Width"
    group: "Size"
    limits:
      min: 0.1
      max: 5
    description: "Typical wall-hung size; replace with maker data."
  depth:
    type: "length"
    default: 0.35
    label: "Depth"
    group: "Size"
    limits:
      min: 0.1
      max: 5
  height:
    type: "length"
    default: 0.75
    label: "Height"
    group: "Size"
    limits:
      min: 0.1
      max: 5
  mount_height:
    type: "length"
    default: 1.2
    label: "Underside above floor"
    group: "Placement"
    visible: "mount = \"wall\""
    limits:
      min: 0
      max: 5
  clearance_front:
    type: "length"
    default: 0.6
    label: "Service clearance, front"
    group: "Clearance"
    limits:
      min: 0
      max: 3
    description: "Project or maker value."
  clearance_side:
    type: "length"
    default: 0.05
    label: "Service clearance, sides"
    group: "Clearance"
    limits:
      min: 0
      max: 1
  pipe_size:
    type: "length"
    default: 0.022
    label: "Water connection outside diameter"
    group: "Connections"
    limits:
      min: 0.008
      max: 0.3
  gas_size:
    type: "length"
    default: 0.015
    label: "Gas connection outside diameter"
    group: "Connections"
    limits:
      min: 0.008
      max: 0.2
  flue_size:
    type: "length"
    default: 0.1
    label: "Flue diameter"
    group: "Connections"
    limits:
      min: 0.04
      max: 0.6
  symbol_code:
    type: "text"
    default: "BLR"
    label: "Plan symbol code"
    group: "Drawing"
  casing_material:
    type: "material"
    default: "sheet_metal"
    label: "Casing"
    group: "Materials"
    options: "materials"
slots: {}
rules:
  derived:
    bottom: "if mount = \"wall\" then mount_height else 0"
    top: "bottom + height"
    port_x:
      expr: "[-width / 2 + 0.07, -width / 2 + 0.15, width / 2 - 0.15]"
      note: "Pipe connections along the underside (flow, return, gas). Typical layout."
  checks:
    ports_fit:
      expr: "width >= 0.3"
      severity: "warning"
      message: "The body is narrower than the default connection layout; set port positions from maker data."
  rulesets: {}
recipe:
  body:
    op: "box"
    args:
      min: "[-width / 2, 0, bottom]"
      max: "[width / 2, depth, top]"
  stubs:
    op: "union"
    args:
      items: "[cylinder([port_x[1], depth / 2, bottom], [port_x[1], depth / 2, bottom - 0.05], pipe_size / 2), cylinder([port_x[2], depth / 2, bottom], [port_x[2], depth / 2, bottom - 0.05], pipe_size / 2), cylinder([port_x[3], depth / 2, bottom], [port_x[3], depth / 2, bottom - 0.05], gas_size / 2), cylinder([0, depth / 2, top], [0, depth / 2, top + 0.1], flue_size / 2)]"
  plan_body:
    op: "rectangle"
    plane: "xy"
    args:
      min: "[-width / 2, 0]"
      max: "[width / 2, depth]"
  plan_clearance:
    op: "rectangle"
    plane: "xy"
    args:
      min: "[-width / 2 - clearance_side, depth]"
      max: "[width / 2 + clearance_side, depth + clearance_front]"
  plan_code:
    op: "text"
    plane: "xy"
    args:
      at: "[0, depth / 2]"
      value: "symbol_code"
      height: "0.0025"
representations:
  model.low:
    context: "model"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "casing_material"
  model.medium:
    context: "model"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "casing_material"
  model.high:
    context: "model"
    lod: "high"
    scale:
      max_scale: 50
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "casing_material"
      - geometry: "stubs"
        material: "\"copper\""
        part: "Connections"
  plan.low:
    context: "plan"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_body"
        class: "projected"
      - geometry: "plan_code"
        class: "annotation"
  plan.medium:
    context: "plan"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_body"
        class: "projected"
      - geometry: "plan_clearance"
        class: "annotation"
        role: "clearance"
      - geometry: "plan_code"
        class: "annotation"
  plan.high:
    context: "plan"
    lod: "high"
    scale:
      max_scale: 50
    source: "derived"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    derive:
      from: "model.high"
      method: "project"
    overlay:
      - geometry: "plan_clearance"
        class: "annotation"
        role: "clearance"
  elevation:
    context: "elevation"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "ELEVATION_VIEW"
    derive:
      from: "model.{lod}"
      method: "project"
  section:
    context: "section"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "SECTION_VIEW"
    derive:
      from: "model.{lod}"
      method: "cut"
host:
  is_host: false
  mounting:
    wall: "on_face: back of the body on the wall face"
    floor: "free: on the floor"
  insertion:
    point: "[0, 0, 0]"
    description: "Centre of the back edge at floor level; y points away from the wall."
  clearance: "plan_clearance (annotation zone, used for clash checks; not exported as geometry)"
handles: []
ports:
  - name: "heating_flow"
    system_type: "HEATING"
    flow_direction: "SOURCE"
    port_type: "PIPE"
    nominal_size: "pipe_size"
    position: "[port_x[1], depth / 2, bottom - 0.05]"
    direction: "[0, 0, -1]"
  - name: "heating_return"
    system_type: "HEATING"
    flow_direction: "SINK"
    port_type: "PIPE"
    nominal_size: "pipe_size"
    position: "[port_x[2], depth / 2, bottom - 0.05]"
    direction: "[0, 0, -1]"
  - name: "gas"
    system_type: "GAS"
    flow_direction: "SINK"
    port_type: "PIPE"
    nominal_size: "gas_size"
    position: "[port_x[3], depth / 2, bottom - 0.05]"
    direction: "[0, 0, -1]"
  - name: "flue"
    system_type: "EXHAUST"
    flow_direction: "SOURCE"
    port_type: "DUCT"
    nominal_size: "flue_size"
    position: "[0, depth / 2, top + 0.1]"
    direction: "[0, 0, 1]"
materials:
  - "copper"
  - "sheet_metal"
ifc: {}
