id: "stair-l-shaped"
name: "L-shaped stair"
version: "0.1.0"
status: "draft"
priority: "P1"
catalogue_id: "C-02"
description: "Stair with two flights at right angles and a quarter landing, turning left or right: risers from the rise and the maximum riser, going, a concrete waist or solid fill, and nested handrails on the outer and inner sides. Defaults are illustrative design values, not norm values; the shared stairs and handrails rule sets give UK and US limits."
tags:
  - "stair"
  - "l-shaped"
  - "landing"
  - "circulation"
template: "IfcStair"
references:
  - ref: "ifc-4.3-add2-ifcstair"
    role: "IFC parameters"
    used: "Class, predefined type QUARTER_TURN_STAIR, Pset_StairCommon property names."
  - ref: "uk-approved-document-k"
    role: "rules"
    used: "Stair and handrail limits through the shared rule sets."
  - ref: "us-irc"
    role: "rules"
    used: "Stair and handrail limits through the shared rule sets."
  - ref: "us-ibc"
    role: "rules"
    used: "Stair limits through the shared rule sets."
sheet:
  scope: "Two flights at 90° with a quarter landing or winders at the corner; left or right turn."
  ifc: "IfcStair · QUARTER_TURN_STAIR (landing) / QUARTER_WINDING_STAIR (winders) · 2 IfcStairFlight + IfcSlab LANDING"
  based_on: "as C-01."
  inputs: "as C-01."
  parameters: "(beyond C-01) `turn` left | right · `corner` landing | winders · `corner_winders` (count, default 3) · `landing_after` (risers in the first flight) · `walkline_offset`."
  rules: "as C-01 + winder going at walkline ≥ min and at narrow end ≥ min (`stairs.winders`)."
  lod: "Plan: winder lines radiating to the walkline geometry; walkline curved through the corner."
parameters:
  rise_mode:
    type: "choice"
    default: "storey"
    label: "Total rise"
    group: "Rise"
    options:
      - "storey"
      - "value"
    option_labels:
      storey: "Storey height"
      value: "Value"
  rise_value:
    type: "length"
    default: 3.0
    label: "Total rise"
    group: "Rise"
    visible: "rise_mode = \"value\""
    limits:
      min: 0.1
      max: 10
  max_riser:
    type: "length"
    default: 0.18
    label: "Maximum riser"
    group: "Steps"
    limits:
      min: 0.05
      max: 0.3
    description: "Generic default (no EN/ISO stair geometry norm); the stairs rule sets set regional limits."
  going:
    type: "length"
    default: 0.28
    label: "Going"
    group: "Steps"
    limits:
      min: 0.1
      max: 0.6
  width:
    type: "length"
    default: 1.0
    label: "Width"
    group: "Size"
    limits:
      min: 0.4
      max: 10
  turn:
    type: "choice"
    default: "left"
    label: "Turn"
    group: "Plan"
    options:
      - "left"
      - "right"
  landing_after:
    type: "integer"
    default: 9
    label: "Landing (or first winder) after riser"
    group: "Landing"
    limits:
      min: 2
      max: 40
  nosing:
    type: "length"
    default: 0.03
    label: "Nosing"
    group: "Treads"
    limits:
      min: 0.0
      max: 0.06
    description: "Tread overhang over the riser below (drawn in plan)."
  structure:
    type: "choice"
    default: "waist"
    label: "Structure"
    group: "Structure"
    options:
      - "waist"
      - "solid"
    option_labels:
      waist: "Concrete waist slab"
      solid: "Solid (on fill or masonry)"
  waist_thickness:
    type: "length"
    default: 0.15
    label: "Waist and landing thickness"
    group: "Structure"
    visible: "structure = \"waist\""
    limits:
      min: 0.06
      max: 0.5
  material:
    type: "material"
    default: "reinforced_concrete"
    label: "Material"
    group: "Materials"
    options: "materials"
  railing_outer:
    type: "boolean"
    default: true
    label: "Handrail on the outer side"
    group: "Railings"
    description: "A nested railing along both flights and round the landing; the top rail is the handrail."
  railing_outer_fixing:
    type: "choice"
    default: "stair"
    label: "Fixing"
    group: "Railings"
    options:
      - "stair"
      - "wall"
    visible: "railing_outer"
    option_labels:
      stair: "Balustrade standing on the stair"
      wall: "Handrail on wall brackets"
    description: "On the stair: posts set into the steps along the nosing line, balusters, top rail as the handrail. On a wall: the handrail alone, on brackets to a wall along the stair edge."
  railing_inner:
    type: "boolean"
    default: false
    label: "Handrail on the inner side"
    group: "Railings"
  railing_inner_fixing:
    type: "choice"
    default: "stair"
    label: "Fixing"
    group: "Railings"
    options:
      - "stair"
      - "wall"
    visible: "railing_inner"
    option_labels:
      stair: "Balustrade standing on the stair"
      wall: "Handrail on wall brackets"
    description: "On the stair: posts set into the steps along the nosing line, balusters, top rail as the handrail. On a wall: the handrail alone, on brackets to a wall along the stair edge."
  handrail_height:
    type: "length"
    default: 0.9
    label: "Handrail height above the pitch line"
    group: "Railings"
    limits:
      min: 0.6
      max: 1.2
  arrow_label:
    type: "text"
    default: "UP"
    label: "Walking line label"
    group: "Drawing"
  Pset_ConcreteElementGeneral:
    type: "property_set"
    default: {}
    label: "Pset_ConcreteElementGeneral"
    group: "IFC data"
    properties:
      - name: "AssemblyPlace"
        measure: "IfcLabel"
        enum:
          - "FACTORY"
          - "OFFSITE"
          - "SITE"
          - "OTHER"
          - "NOTKNOWN"
          - "UNSET"
      - name: "CastingMethod"
        measure: "IfcLabel"
        enum:
          - "INSITU"
          - "MIXED"
          - "PRECAST"
          - "PRINTED"
          - "OTHER"
          - "NOTKNOWN"
          - "UNSET"
      - name: "StructuralClass"
        measure: "IfcLabel"
      - name: "StrengthClass"
        measure: "IfcLabel"
      - name: "ExposureClass"
        measure: "IfcLabel"
      - name: "ReinforcementVolumeRatio"
        measure: "IfcMassDensityMeasure"
      - name: "ReinforcementAreaRatio"
        measure: "IfcAreaDensityMeasure"
      - name: "DimensionalAccuracyClass"
        measure: "IfcLabel"
      - name: "ConstructionToleranceClass"
        measure: "IfcLabel"
      - name: "ConcreteCover"
        measure: "IfcPositiveLengthMeasure"
      - name: "ConcreteCoverAtMainBars"
        measure: "IfcPositiveLengthMeasure"
      - name: "ConcreteCoverAtLinks"
        measure: "IfcPositiveLengthMeasure"
      - name: "ReinforcementStrengthClass"
        measure: "IfcLabel"
    optional: true
  Pset_PrecastConcreteElementFabrication:
    type: "property_set"
    default: {}
    label: "Pset_PrecastConcreteElementFabrication"
    group: "IFC data"
    properties:
      - name: "TypeDesignation"
        measure: "IfcLabel"
      - name: "ProductionLotId"
        measure: "IfcIdentifier"
      - name: "SerialNumber"
        measure: "IfcIdentifier"
      - name: "PieceMark"
        measure: "IfcLabel"
      - name: "AsBuiltLocationNumber"
        measure: "IfcLabel"
      - name: "ActualProductionDate"
        measure: "IfcDateTime"
      - name: "ActualErectionDate"
        measure: "IfcDateTime"
    optional: true
  Pset_PrecastConcreteElementGeneral:
    type: "property_set"
    default: {}
    label: "Pset_PrecastConcreteElementGeneral"
    group: "IFC data"
    properties:
      - name: "TypeDesignation"
        measure: "IfcLabel"
      - name: "CornerChamfer"
        measure: "IfcPositiveLengthMeasure"
      - name: "ManufacturingToleranceClass"
        measure: "IfcLabel"
      - name: "FormStrippingStrength"
        measure: "IfcPressureMeasure"
      - name: "LiftingStrength"
        measure: "IfcPressureMeasure"
      - name: "ReleaseStrength"
        measure: "IfcPressureMeasure"
      - name: "MinimumAllowableSupportLength"
        measure: "IfcPositiveLengthMeasure"
      - name: "InitialTension"
        measure: "IfcPressureMeasure"
      - name: "TendonRelaxation"
        measure: "IfcPositiveRatioMeasure"
      - name: "TransportationStrength"
        measure: "IfcPressureMeasure"
      - name: "SupportDuringTransportDescription"
        measure: "IfcText"
      - name: "SupportDuringTransportDocReference"
        measure: "IfcExternalReference"
      - name: "HollowCorePlugging"
        measure: "IfcLabel"
      - name: "CamberAtMidspan"
        measure: "IfcRatioMeasure"
      - name: "BatterAtStart"
        measure: "IfcPlaneAngleMeasure"
      - name: "BatterAtEnd"
        measure: "IfcPlaneAngleMeasure"
      - name: "Twisting"
        measure: "IfcPlaneAngleMeasure"
      - name: "Shortening"
        measure: "IfcRatioMeasure"
      - name: "PieceMark"
        measure: "IfcLabel"
      - name: "DesignLocationNumber"
        measure: "IfcLabel"
    optional: true
  Pset_StairCommon:
    type: "property_set"
    default: {}
    label: "Pset_StairCommon"
    group: "IFC data"
    properties:
      - name: "Reference"
        measure: "IfcIdentifier"
      - name: "Status"
        measure: "IfcLabel"
        enum:
          - "DEMOLISH"
          - "EXISTING"
          - "NEW"
          - "TEMPORARY"
          - "OTHER"
          - "NOTKNOWN"
          - "UNSET"
      - name: "NumberOfRiser"
        measure: "IfcCountMeasure"
        value: "risers"
      - name: "NumberOfTreads"
        measure: "IfcCountMeasure"
        value: "treads"
      - name: "RiserHeight"
        measure: "IfcPositiveLengthMeasure"
        value: "riser"
      - name: "TreadLength"
        measure: "IfcPositiveLengthMeasure"
        value: "going"
      - name: "NosingLength"
        measure: "IfcLengthMeasure"
      - name: "WalkingLineOffset"
        measure: "IfcPositiveLengthMeasure"
      - name: "TreadLengthAtOffset"
        measure: "IfcPositiveLengthMeasure"
      - name: "TreadLengthAtInnerSide"
        measure: "IfcPositiveLengthMeasure"
      - name: "WaistThickness"
        measure: "IfcPositiveLengthMeasure"
        value: "if structure = \"waist\" then waist_thickness else null"
      - name: "RequiredHeadroom"
        measure: "IfcPositiveLengthMeasure"
      - name: "HandicapAccessible"
        measure: "IfcBoolean"
      - name: "HasNonSkidSurface"
        measure: "IfcBoolean"
      - name: "IsExternal"
        measure: "IfcBoolean"
      - name: "ThermalTransmittance"
        measure: "IfcThermalTransmittanceMeasure"
      - name: "LoadBearing"
        measure: "IfcBoolean"
      - name: "FireRating"
        measure: "IfcLabel"
      - name: "FireExit"
        measure: "IfcBoolean"
    optional: false
  corner:
    type: "choice"
    default: "landing"
    label: "Corner"
    group: "Landing"
    options:
      - "landing"
      - "winders"
    option_labels:
      landing: "Quarter landing"
      winders: "Winders"
  corner_winders:
    type: "integer"
    default: 3
    label: "Winders in the corner"
    group: "Landing"
    visible: "corner = \"winders\""
    limits:
      min: 2
      max: 5
  walkline_offset:
    type: "length"
    default: 0.5
    label: "Walking line from the inner side"
    group: "Plan"
    limits:
      min: 0.1
      max: 2.0
    description: "Where the walking line is drawn and reported (Pset_StairCommon WalkingLineOffset)."
slots: {}
rules:
  derived:
    total_rise: "if rise_mode = \"storey\" then level.height else rise_value"
    risers: "ceiling(total_rise / max_riser)"
    riser: "total_rise / risers"
    treads: "risers - 1"
    k:
      expr: "min(max(landing_after, 2), risers - 2)"
      note: "Risers of flight 1; flight 2 has the rest."
    wn:
      expr: "if corner = \"winders\" then corner_winders else 1"
      note: "Treads in the corner: the landing counts as one."
    n2: "risers - k - (wn - 1)"
    z_land: "k * riser"
    z2:
      expr: "z_land + (wn - 1) * riser"
      note: "Where flight 2 starts: the top of the landing or of the last winder."
    run1: "(k - 1) * going"
    run2: "(n2 - 1) * going"
    pitch: "atan2(riser, going)"
    step_rule:
      expr: "2 * riser + going"
      note: "Shown for information; checked by a rule set."
    waist_v: "waist_thickness / cos(pitch)"
    hw: "width / 2"
    land_len: "width"
    land_w: "width"
    origin2:
      expr: "[run1 + hw, hw, 0]"
      note: "Where flight 2 starts, in the frame of flight 1 (turning left)."
    turn2: "90"
    under_x0:
      expr: "waist_v * going / riser"
      note: "Where the underside meets the floor: the waist is measured square to the line through the inner corners of the steps."
    under_z0: "0"
    steps1: "for i in 1..2 * (k - 1) return if modulo(i, 2) = 1 then [(i - 1) / 2 * going, (i + 1) / 2 * riser] else [i / 2 * going, i / 2 * riser]"
    steps2: "for i in 1..2 * (n2 - 1) return if modulo(i, 2) = 1 then [(i - 1) / 2 * going, z2 + (i + 1) / 2 * riser] else [i / 2 * going, z2 + i / 2 * riser]"
    ua: "(waist_v - waist_thickness) * going / riser"
    has_landing: "corner = \"landing\""
    x_m:
      expr: "min(under_x0 + (z_land - waist_thickness) * going / riser, run1 + land_len)"
      note: "Where the underside of flight 1 meets the underside of the landing, so the two read as one slab."
    profile1_points: "if structure = \"waist\" then concatenate([[0, 0]], steps1, [[run1, z_land]], if has_landing then [[x_m, z_land], [x_m, z_land - waist_thickness]] else [[run1, z_land - riser - waist_v]], [[under_x0, under_z0]]) else concatenate([[0, 0]], steps1, [[run1, z_land], [run1, 0]])"
    profile2_points: "if structure = \"waist\" then concatenate([[0, z2]], steps2, [[run2, total_rise], [run2, total_rise - riser - waist_v]], if ua >= 0 then [[ua, z2 - waist_thickness], [0, z2 - waist_thickness]] else [[0, z2 + riser - waist_v]]) else concatenate([[0, z2]], steps2, [[run2, total_rise], [run2, 0], [0, 0]])"
    mirror_y:
      expr: "turn = \"right\""
      note: "A right turn is the left turn mirrored across the axis of flight 1."
    j_cut: "floor(view.cut_height / riser)"
    cut_in_1: "j_cut < k"
    x_cut1: "if j_cut < 1 then 0 else min(run1, (j_cut - 0.5) * going)"
    u_cut2: "min(run2, max(0, (j_cut - k - 0.5) * going))"
    rail_y: "hw - 0.05"
    rail_outer:
      expr: "concatenate(for j in 1..k - 1 return [(j - 1) * going, -rail_y, j * riser + handrail_height], [[run1, -rail_y, z_land + handrail_height], [run1 + width - 0.05, -rail_y, (z_land + z2) / 2 + handrail_height], [run1 + width - 0.05, hw, z2 + handrail_height]], for j in 1..n2 - 1 return [run1 + width - 0.05, hw + (j - 1) * going, z2 + j * riser + handrail_height], [[run1 + width - 0.05, hw + run2, total_rise + handrail_height]])"
      note: "Outer handrail: flight 1, round the landing, flight 2."
    rail_inner: "concatenate(for j in 1..k - 1 return [(j - 1) * going, rail_y, j * riser + handrail_height], [[run1, rail_y, z_land + handrail_height]], for j in 1..n2 - 1 return [run1 + 0.05, hw + (j - 1) * going, z2 + j * riser + handrail_height], [[run1 + 0.05, hw + run2, total_rise + handrail_height]])"
    rail_outer_m: "if mirror_y then for p in rail_outer return [p[1], -p[2], p[3]] else rail_outer"
    rail_inner_m: "if mirror_y then for p in rail_inner return [p[1], -p[2], p[3]] else rail_inner"
    winder_polys:
      expr: "if corner = \"winders\" then for j in 1..wn return concatenate([[run1, hw], (if ((j - 1) * 2 * width / wn) <= width then [run1 + ((j - 1) * 2 * width / wn), -hw] else [run1 + width, -hw + ((j - 1) * 2 * width / wn) - width])], if ((j - 1) * 2 * width / wn) < width and (j * 2 * width / wn) > width then [[run1 + width, -hw]] else [], [(if (j * 2 * width / wn) <= width then [run1 + (j * 2 * width / wn), -hw] else [run1 + width, -hw + (j * 2 * width / wn) - width])]) else []"
      note: "Winders fanned from the inner corner, splitting the outer edges evenly (built for a left turn)."
  checks:
    min_risers:
      expr: "risers >= 2"
      severity: "error"
      message: "A stair needs at least two risers."
    riser_range:
      expr: "rules.stairs = null or (riser >= rules.stairs.riser_min and riser <= rules.stairs.riser_max)"
      severity: "warning"
      message: "Riser is outside the active rule set."
    going_range:
      expr: "rules.stairs = null or (going >= rules.stairs.going_min and going <= rules.stairs.going_max)"
      severity: "warning"
      message: "Going is outside the active rule set."
    step_rule_range:
      expr: "rules.stairs = null or rules.stairs.rule_min = null or (step_rule >= rules.stairs.rule_min and step_rule <= rules.stairs.rule_max)"
      severity: "warning"
      message: "2R + G is outside the active rule set."
    width_min:
      expr: "rules.stairs = null or rules.stairs.width_min = null or width >= rules.stairs.width_min"
      severity: "warning"
      message: "Width is below the active rule set."
    landing_fits:
      expr: "landing_after >= 2 and landing_after <= risers - 2"
      severity: "warning"
      message: "The landing must leave at least two risers on each flight; it was moved."
    pitch_range:
      expr: "rules.stairs = null or rules.stairs.pitch_max = null or pitch <= rules.stairs.pitch_max"
      severity: "warning"
      message: "The pitch is steeper than the active rule set allows."
    handrail_range:
      expr: "rules.handrails = null or (handrail_height >= rules.handrails.height_min and handrail_height <= rules.handrails.height_max)"
      severity: "warning"
      message: "The handrail height is outside the active rule set."
  rulesets:
    stairs:
      default: null
      note: "Off by default. Shared variants (library rulesets/stairs); there is no EN/ISO stair geometry norm."
      fields:
        riser_min: "length"
        riser_max: "length"
        going_min: "length"
        going_max: "length"
        rule_min: "length"
        rule_max: "length"
        width_min: "length"
        pitch_max: "number"
    handrails:
      default: null
      note: "Off by default. Shared variants (library rulesets/handrails)."
      fields:
        height_min: "length"
        height_max: "length"
recipe:
  profile1:
    op: "polygon"
    plane: "xz"
    args:
      points: "profile1_points"
  profile2:
    op: "polygon"
    plane: "xz"
    args:
      points: "profile2_points"
  flight1:
    op: "extrude"
    plane: "xz"
    args:
      profile: "profile1"
      from: "-hw"
      to: "hw"
  flight2_local:
    op: "extrude"
    plane: "xz"
    args:
      profile: "profile2"
      from: "-hw"
      to: "hw"
  flight2:
    op: "move"
    args:
      geometry: "rotate(flight2_local, [0, 0, 0], turn2)"
      by: "origin2"
  landing_slab:
    op: "box"
    args:
      min: "[run1, -hw, if structure = \"waist\" then z_land - waist_thickness else 0]"
      max: "[run1 + land_len, land_w - hw, z_land]"
    when: "corner = \"landing\""
  winders:
    op: "for_each"
    plane: "xy"
    when: "corner = \"winders\""
    args:
      items: "for j in 1..wn return j"
      as: "j"
      do: "extrude(polygon(winder_polys[j]), if structure = \"waist\" then max(0, z_land + (j - 2) * riser - waist_thickness) else 0, z_land + (j - 1) * riser)"
  body:
    op: "union"
    args:
      items: "[if mirror_y then mirror(flight1, \"y\") else flight1, if mirror_y then mirror(flight2, \"y\") else flight2, if corner = \"landing\" then if mirror_y then mirror(landing_slab, \"y\") else landing_slab else null, if corner = \"winders\" then if mirror_y then mirror(winders, \"y\") else winders else null]"
  p1_below:
    op: "rectangle"
    plane: "xy"
    args:
      min: "[0, -hw]"
      max: "[if cut_in_1 then x_cut1 else run1, hw]"
  p1_above:
    op: "rectangle"
    plane: "xy"
    when: "cut_in_1"
    args:
      min: "[x_cut1, -hw]"
      max: "[run1, hw]"
  p_landing:
    op: "rectangle"
    plane: "xy"
    args:
      min: "[run1, -hw]"
      max: "[run1 + land_len, land_w - hw]"
    when: "corner = \"landing\""
  p2_local:
    op: "union"
    plane: "xy"
    args:
      items: "[rectangle([0, -hw], [run2, hw])]"
  p1_treads:
    op: "for_each"
    plane: "xy"
    args:
      items: "for j in 1..k - 1 return j"
      as: "j"
      do: "line([j * going, -hw], [j * going, hw])"
  p2_treads_local:
    op: "for_each"
    plane: "xy"
    args:
      items: "for j in 1..n2 - 1 return j"
      as: "j"
      do: "line([j * going, -hw], [j * going, hw])"
  p2_outline:
    op: "move"
    plane: "xy"
    args:
      geometry: "rotate(p2_local, [0, 0], turn2)"
      by: "[origin2[1], origin2[2]]"
  p2_treads:
    op: "move"
    plane: "xy"
    args:
      geometry: "rotate(p2_treads_local, [0, 0], turn2)"
      by: "[origin2[1], origin2[2]]"
  cut_local:
    op: "polyline"
    plane: "xy"
    args:
      points: "[[-0.15, -hw], [-0.05, -0.1 * width], [0.05, 0.1 * width], [0.15, hw]]"
  cut_line_l:
    op: "move"
    plane: "xy"
    args:
      geometry: "if cut_in_1 then move(cut_local, [x_cut1, 0]) else move(rotate(move(cut_local, [u_cut2, 0]), [0, 0], turn2), [origin2[1], origin2[2]])"
      by: "[0, 0]"
  walk_l:
    op: "polyline"
    plane: "xy"
    args:
      points: "[[going / 2, hw - min(walkline_offset, width)], [run1 + min(walkline_offset, width), hw - min(walkline_offset, width)], [run1 + min(walkline_offset, width), hw + run2]]"
  arrow_l:
    op: "polyline"
    plane: "xy"
    args:
      points: "[[run1 + min(walkline_offset, width) - 0.075, hw + run2 - 0.15], [run1 + min(walkline_offset, width), hw + run2], [run1 + min(walkline_offset, width) + 0.075, hw + run2 - 0.15]]"
  label:
    op: "text"
    plane: "xy"
    args:
      at: "[going / 2, -0.12]"
      value: "arrow_label"
      height: "0.0025"
  railing_outer_obj:
    op: "instance"
    when: "railing_outer"
    args:
