  p_winders:
    op: "for_each"
    plane: "xy"
    when: "corner = \"winders\""
    args:
      items: "winder_polys"
      as: "w"
      do: "polyline(append(w, w[1]))"
  plan_below:
    op: "union"
    plane: "xy"
    args:
      items: "[if mirror_y then mirror(p1_below, \"y\") else p1_below, if corner = \"landing\" then if mirror_y then mirror(p_landing, \"y\") else p_landing else null]"
  plan_above:
    op: "union"
    plane: "xy"
    args:
      items: "[if cut_in_1 then if mirror_y then mirror(p1_above, \"y\") else p1_above else null, if mirror_y then mirror(p2_outline, \"y\") else p2_outline]"
  plan_treads:
    op: "union"
    plane: "xy"
    args:
      items: "[if mirror_y then mirror(union([p1_treads, p2_treads]), \"y\") else union([p1_treads, p2_treads]), if corner = \"winders\" then if mirror_y then mirror(p_winders, \"y\") else p_winders else null]"
  cut_line:
    op: "union"
    plane: "xy"
    args:
      items: "[if mirror_y then mirror(cut_line_l, \"y\") else cut_line_l]"
  walk_line:
    op: "union"
    plane: "xy"
    args:
      items: "[if mirror_y then mirror(walk_l, \"y\") else walk_l]"
  arrow:
    op: "union"
    plane: "xy"
    args:
      items: "[if mirror_y then mirror(arrow_l, \"y\") else arrow_l]"
representations:
  model.low:
    context: "model"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "material"
  model.medium:
    context: "model"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "material"
      - geometry: "railing_outer_obj"
        part: "Railing"
      - geometry: "railing_inner_obj"
        part: "Railing"
  model.high:
    context: "model"
    lod: "high"
    scale:
      max_scale: 50
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body"
        material: "material"
      - geometry: "railing_outer_obj"
        part: "Railing"
      - geometry: "railing_inner_obj"
        part: "Railing"
  plan.low:
    context: "plan"
    lod: "low"
    scale:
      min_scale: 200
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    source: "derived"
    derive:
      from: "model.low"
      method: "cut"
    overlay:
      - geometry: "plan_above"
        class: "overhead"
      - geometry: "walk_line"
        class: "annotation"
        role: "walking_line"
      - geometry: "arrow"
        class: "annotation"
        role: "walking_line"
      - geometry: "label"
        class: "annotation"
  plan.medium:
    context: "plan"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    source: "derived"
    derive:
      from: "model.medium"
      method: "cut_or_project"
    overlay:
      - geometry: "plan_above"
        class: "overhead"
      - geometry: "walk_line"
        class: "annotation"
        role: "walking_line"
      - geometry: "arrow"
        class: "annotation"
        role: "walking_line"
      - geometry: "label"
        class: "annotation"
  plan.high:
    context: "plan"
    lod: "high"
    scale:
      max_scale: 50
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    source: "derived"
    derive:
      from: "model.high"
      method: "cut_or_project"
    overlay:
      - geometry: "plan_above"
        class: "overhead"
      - geometry: "walk_line"
        class: "annotation"
        role: "walking_line"
      - geometry: "arrow"
        class: "annotation"
        role: "walking_line"
      - geometry: "label"
        class: "annotation"
  section:
    context: "section"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "SECTION_VIEW"
    derive:
      from: "model.{lod}"
      method: "cut"
  elevation:
    context: "elevation"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "ELEVATION_VIEW"
    derive:
      from: "model.{lod}"
      method: "project"
host:
  is_host: false
  level: "Base on a storey, top at the next storey (or a set rise)."
  slab_opening:
    note: "The application cuts the upper slab over flight 2 and the landing plus headroom."
  nested:
    objects:
      - "opo-format.org/library/objects/railing-guard"
    note: "Railings are nested railing-guard objects along the nosing line (on the stair) or along the stair edge (on wall brackets)."
handles:
  - parameter: "width"
    view:
      - "plan"
    at: "[run1 / 2, hw, 0]"
    axis: "y"
materials:
  - "reinforced_concrete"
ifc:
  class: "IfcStair"
  predefinedType: "if corner = \"winders\" then \"QUARTER_WINDING_STAIR\" else \"QUARTER_TURN_STAIR\""
  property_sets: "all parameters of type property_set, with the values set by `value` formulas"
  properties:
    Pset_StairCommon.NumberOfRiser: "risers"
    Pset_StairCommon.NumberOfTreads: "treads"
    Pset_StairCommon.RiserHeight: "riser"
    Pset_StairCommon.TreadLength: "going"
    Pset_StairCommon.NosingLength: "nosing"
    Pset_StairCommon.WaistThickness: "if structure = \"waist\" then waist_thickness else null"
    Pset_StairCommon.WalkingLineOffset: "walkline_offset"
  quantities: {}
  parameter_pset: "OPO_Parameters"
  decomposition: "IfcStair aggregating two IfcStairFlight and the landing as IfcSlab LANDING; nested railings as IfcRailing."
