id: "stair-straight"
name: "Straight stair"
version: "0.1.0"
status: "draft"
priority: "P1"
catalogue_id: "C-01"
description: "Straight stair between two levels with an optional landing part-way: risers from the rise and the maximum riser, going, nosing, a concrete waist, solid fill, or timber or steel stringers with treads and open or closed risers, and nested handrails along the flight. Defaults are illustrative design values, not norm values; the shared stairs and handrails rule sets give UK and US limits."
tags:
  - "stair"
  - "straight"
  - "landing"
  - "circulation"
template: "IfcStair"
references:
  - ref: "ifc-4.3-add2-ifcstair"
    role: "IFC parameters"
    used: "Class, predefined types STRAIGHT_RUN_STAIR and TWO_STRAIGHT_RUN_STAIR, Pset_StairCommon property names."
  - ref: "uk-approved-document-k"
    role: "rules"
    used: "Stair and handrail limits through the shared rule sets."
  - ref: "us-irc"
    role: "rules"
    used: "Stair and handrail limits through the shared rule sets."
  - ref: "us-ibc"
    role: "rules"
    used: "Stair limits through the shared rule sets."
sheet:
  based_on: "Bonsai stair generator (reference: types CONCRETE / WOOD-STEEL / GENERIC, tread and riser parameters) · IFC `Pset_StairFlightCommon` · AD K, IRC/IBC (via `stairs`; no EN/ISO stair norm exists)."
  ifc: "IfcStair · STRAIGHT_RUN_STAIR · 1 IfcStairFlight"
  inputs: "Bottom and top level (or `total_rise`) · host slab for the opening · optional `start_point` + direction (placement)."
  lod: "3D: low solid wedge per flight · medium treads, risers, stringers/waist, landing, simple railing · high + nosing profile, railing details. Plan: low outline + walkline + arrow · medium treads, cut line, overhead dashed, walkline, UP/DN · high + nosings, handrails. Section: cut from 3D (all LODs)."
  not_in_scope:
    - "structural design of stringers"
  parameters: "`total_rise` · `max_riser` (from rule set; default 0.18 m / 7½\") · `target_step` (2R+G; default 0.63 m / 25\") · `going` (derived, overridable) · `width` (default 1.0 m / 36\") · `nosing` (default 0.03 m / 1\") · `riser_type` closed | open · `structure` timber_stringers | steel_stringers | concrete · `tread_thickness`, `stringer_width` / `waist_thickness` · `landing_after` (riser number or none) + `landing_depth` · `railing_left/right` (none | guard | handrail; nested C-07 / C-08) · `first_riser_offset`, `last_tread_flush` (bool)."
  rules: "Riser within rule set min/max · going within min/max · step rule · pitch ≤ max · width ≥ min · headroom ≥ min (checked against the slab opening edge: opening length derived so headroom is met) · uniform risers (computed) · landing depth ≥ min (from rule set) · guard required where fall height > threshold."
  scope: "One straight flight between two levels; optional landings part-way (makes TWO_STRAIGHT_RUN_STAIR). Treads, risers, stringers or concrete waist, nosing, nested railing(s) and handrail(s)."
  sizes: "None (rise-driven). Presets per market: EU generic 175/280 mm, 1.0 m wide (not a norm); UK private 200/250 mm, 0.9 m; US residential 7½\"/10½\", 36\"."
parameters:
  rise_mode:
    type: "choice"
    default: "storey"
    label: "Total rise"
    group: "Rise"
    options:
      - "storey"
      - "value"
    option_labels:
      storey: "Storey height"
      value: "Value"
  rise_value:
    type: "length"
    default: 3.0
    label: "Total rise"
    group: "Rise"
    visible: "rise_mode = \"value\""
    limits:
      min: 0.1
      max: 10
  max_riser:
    type: "length"
    default: 0.18
    label: "Maximum riser"
    group: "Steps"
    limits:
      min: 0.05
      max: 0.3
    description: "Generic default (no EN/ISO stair geometry norm); the stairs rule sets set regional limits."
  going:
    type: "length"
    default: 0.28
    label: "Going (when set)"
    group: "Steps"
    limits:
      min: 0.1
      max: 0.6
    visible: "going_mode = \"fixed\""
  width:
    type: "length"
    default: 1.0
    label: "Width"
    group: "Size"
    limits:
      min: 0.4
      max: 10
  going_mode:
    type: "choice"
    default: "step_rule"
    label: "Going"
    group: "Geometry"
    options:
      - "step_rule"
      - "fixed"
    option_labels:
      step_rule: "From the step rule (2R + G = target)"
      fixed: "Set the going"
  target_step:
    type: "length"
    default: 0.63
    label: "Target step (2R + G)"
    group: "Geometry"
    visible: "going_mode = \"step_rule\""
    limits:
      min: 0.55
      max: 0.7
    description: "The classic step formula value; not a norm value. The stairs rule sets check the result."
  last_tread_flush:
    type: "boolean"
    default: true
    label: "Upper floor is the last tread"
    group: "Geometry"
    description: "Off: the stair has its own top tread, level with the upper floor, one going longer."
  first_riser_offset:
    type: "length"
    default: 0.0
    label: "First riser offset"
    group: "Placement"
    limits:
      min: -2.0
      max: 2.0
    description: "Distance from the placement point to the first riser, along the run."
  nosing:
    type: "length"
    default: 0.03
    label: "Nosing"
    group: "Treads"
    limits:
      min: 0.0
      max: 0.06
    description: "Tread overhang over the riser below."
  structure:
    type: "choice"
    default: "waist"
    label: "Structure"
    group: "Structure"
    options:
      - "waist"
      - "solid"
      - "timber_stringers"
      - "steel_stringers"
    option_labels:
      waist: "Concrete waist slab"
      solid: "Solid (on fill or masonry)"
      timber_stringers: "Timber stringers"
      steel_stringers: "Steel stringers"
  waist_thickness:
    type: "length"
    default: 0.15
    label: "Waist and landing thickness"
    group: "Structure"
    visible: "structure = \"waist\""
    limits:
      min: 0.06
      max: 0.5
  tread_thickness:
    type: "length"
    default: 0.04
    label: "Tread thickness"
    group: "Treads"
    visible: "structure = \"timber_stringers\" or structure = \"steel_stringers\""
    limits:
      min: 0.02
      max: 0.1
  riser_type:
    type: "choice"
    default: "closed"
    label: "Risers"
    group: "Treads"
    options:
      - "closed"
      - "open"
    visible: "structure = \"timber_stringers\" or structure = \"steel_stringers\""
  riser_thickness:
    type: "length"
    default: 0.02
    label: "Riser board thickness"
    group: "Treads"
    visible: "riser_type = \"closed\" and (structure = \"timber_stringers\" or structure = \"steel_stringers\")"
    limits:
      min: 0.01
      max: 0.05
  stringer_width:
    type: "length"
    default: 0.05
    label: "Stringer width"
    group: "Structure"
    visible: "structure = \"timber_stringers\" or structure = \"steel_stringers\""
    limits:
      min: 0.01
      max: 0.2
  stringer_depth:
    type: "length"
    default: 0.25
    label: "Stringer depth"
    group: "Structure"
    visible: "structure = \"timber_stringers\" or structure = \"steel_stringers\""
    limits:
      min: 0.1
      max: 0.5
  landing:
    type: "boolean"
    default: false
    label: "Landing part-way"
    group: "Landing"
    description: "Makes a TWO_STRAIGHT_RUN_STAIR."
  landing_after:
    type: "integer"
    default: 8
    label: "Landing after riser"
    group: "Landing"
    visible: "landing"
    limits:
      min: 2
      max: 40
  landing_depth:
    type: "length"
    default: 1.0
    label: "Landing depth"
    group: "Landing"
    visible: "landing"
    limits:
      min: 0.5
      max: 5.0
  material:
    type: "material"
    default: "reinforced_concrete"
    label: "Concrete or fill"
    group: "Materials"
    options: "materials"
  tread_material:
    type: "material"
    default: "timber"
    label: "Treads and risers"
    group: "Materials"
    options: "materials"
    visible: "structure = \"timber_stringers\" or structure = \"steel_stringers\""
  stringer_material:
    type: "material"
    default: "timber"
    label: "Timber stringers"
    group: "Materials"
    options: "materials"
    visible: "structure = \"timber_stringers\""
    description: "Steel stringers are steel."
  railing_left:
    type: "boolean"
    default: true
    label: "Handrail on the left"
    group: "Railings"
    description: "A nested railing along the flight; the top rail is the handrail."
  railing_left_fixing:
    type: "choice"
    default: "stair"
    label: "Fixing"
    group: "Railings"
    options:
      - "stair"
      - "wall"
    visible: "railing_left"
    option_labels:
      stair: "Balustrade standing on the stair"
      wall: "Handrail on wall brackets"
    description: "On the stair: posts set into the steps along the nosing line, balusters, top rail as the handrail. On a wall: the handrail alone, on brackets to a wall along the stair edge."
  railing_right:
    type: "boolean"
    default: false
    label: "Handrail on the right"
    group: "Railings"
    description: "A nested railing along the flight; the top rail is the handrail."
  railing_right_fixing:
    type: "choice"
    default: "stair"
    label: "Fixing"
    group: "Railings"
    options:
      - "stair"
      - "wall"
    visible: "railing_right"
    option_labels:
      stair: "Balustrade standing on the stair"
      wall: "Handrail on wall brackets"
    description: "On the stair: posts set into the steps along the nosing line, balusters, top rail as the handrail. On a wall: the handrail alone, on brackets to a wall along the stair edge."
  handrail_height:
    type: "length"
    default: 0.9
    label: "Handrail height above the pitch line"
    group: "Railings"
    limits:
      min: 0.6
      max: 1.2
    description: "Measured vertically above the nosings; the handrails rule sets check it."
  arrow_label:
    type: "text"
    default: "UP"
    label: "Walking line label"
    group: "Drawing"
  Pset_ConcreteElementGeneral:
    type: "property_set"
    default: {}
    label: "Pset_ConcreteElementGeneral"
    group: "IFC data"
