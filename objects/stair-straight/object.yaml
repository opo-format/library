slots: {}
rules:
  derived:
    total_rise: "if rise_mode = \"storey\" then level.height else rise_value"
    risers: "ceiling(total_rise / max_riser)"
    riser: "total_rise / risers"
    treads:
      expr: "if last_tread_flush then risers - 1 else risers"
      note: "With a flush top, the upper floor is the last tread; otherwise the stair has its own top tread at floor level."
    tread_going:
      expr: "if going_mode = \"step_rule\" then target_step - 2 * riser else going"
      note: "Going of every tread."
    k:
      expr: "if landing then min(max(landing_after, 2), risers - 2) else risers"
      note: "Risers below the landing (all risers without one)."
    tread_x:
      expr: "for j in 1..treads return (if landing and j > k then (k - 1) * tread_going + landing_depth + (j - k - 1) * tread_going else (j - 1) * tread_going)"
      note: "Front (nosing line) of each tread; the landing takes the place of tread k."
    tread_d: "for j in 1..treads return (if landing and j = k then landing_depth else tread_going)"
    run: "tread_x[treads] + tread_d[treads]"
    pitch: "atan2(riser, tread_going)"
    step_rule:
      expr: "2 * riser + tread_going"
      note: "Shown for information (2R + G); checked only by a rule set."
    waist_v:
      expr: "waist_thickness / cos(pitch)"
      note: "Waist thickness measured vertically."
    z_land: "k * riser"
    land_end: "if landing then tread_x[k] + landing_depth else 0"
    under_x0:
      expr: "waist_v * tread_going / riser"
      note: "Where the underside meets the floor: the waist is measured square to the line through the inner corners of the steps."
    under_z0: "0"
    xa: "max(tread_x[min(k, treads)], land_end + (waist_v - waist_thickness) * tread_going / riser)"
    xb: "min(land_end, (z_land - waist_thickness + waist_v) * tread_going / riser)"
    steps:
      expr: "for i in 1..2 * treads return if modulo(i, 2) = 1 then [tread_x[(i + 1) / 2], (i + 1) / 2 * riser] else [tread_x[i / 2] + tread_d[i / 2], i / 2 * riser]"
      note: "Front and back of each tread and of the landing."
    underside: "if landing then [[run, treads * riser - waist_v], [xa, z_land - waist_thickness], [xb, z_land - waist_thickness], [under_x0, under_z0]] else [[run, treads * riser - waist_v], [under_x0, under_z0]]"
    profile_points: "if structure = \"waist\" then concatenate([[0, 0]], steps, [[run, total_rise]], underside) else concatenate([[0, 0]], steps, [[run, total_rise], [run, 0]])"
    has_stringers: "structure = \"timber_stringers\" or structure = \"steel_stringers\""
    j_cut: "floor(view.cut_height / riser)"
    x_cut:
      expr: "if j_cut < 1 then 0 else if j_cut >= treads then run else tread_x[j_cut] + tread_d[j_cut] / 2"
      note: "Where the plan cut height meets the stair."
    hw: "width / 2"
    rail_path_left:
      expr: "concatenate(for j in 1..min(k, treads) return [tread_x[j], hw - 0.05, j * riser + handrail_height], if landing then [[land_end, hw - 0.05, z_land + handrail_height]] else [], if landing then for j in k + 1..treads return [tread_x[j], hw - 0.05, j * riser + handrail_height] else [], [[run, hw - 0.05, total_rise + handrail_height]])"
      note: "Handrail over the nosings, level along the landing."
    rail_path_right: "for p in rail_path_left return [p[1], -p[2], p[3]]"
  checks:
    min_risers:
      expr: "risers >= 2"
      severity: "error"
      message: "A stair needs at least two risers."
    riser_range:
      expr: "rules.stairs = null or (riser >= rules.stairs.riser_min and riser <= rules.stairs.riser_max)"
      severity: "warning"
      message: "Riser is outside the active rule set."
    going_range:
      expr: "rules.stairs = null or (tread_going >= rules.stairs.going_min and tread_going <= rules.stairs.going_max)"
      severity: "warning"
      message: "Going is outside the active rule set."
    step_rule_range:
      expr: "rules.stairs = null or rules.stairs.rule_min = null or (step_rule >= rules.stairs.rule_min and step_rule <= rules.stairs.rule_max)"
      severity: "warning"
      message: "2R + G is outside the active rule set."
    width_min:
      expr: "rules.stairs = null or rules.stairs.width_min = null or width >= rules.stairs.width_min"
      severity: "warning"
      message: "Width is below the active rule set."
    landing_fits:
      expr: "not(landing) or (landing_after >= 2 and landing_after <= risers - 2)"
      severity: "warning"
      message: "The landing must leave at least two risers on each flight; it was moved."
    pitch_range:
      expr: "rules.stairs = null or rules.stairs.pitch_max = null or pitch <= rules.stairs.pitch_max"
      severity: "warning"
      message: "The pitch is steeper than the active rule set allows."
    nosing_fits:
      expr: "nosing < tread_going / 2"
      severity: "error"
      message: "The nosing is too deep for the tread_going."
    handrail_range:
      expr: "rules.handrails = null or (handrail_height >= rules.handrails.height_min and handrail_height <= rules.handrails.height_max)"
      severity: "warning"
      message: "The handrail height is outside the active rule set."
  rulesets:
    stairs:
      default: null
      note: "Off by default. Shared variants (library rulesets/stairs) give UK and US limits; there is no EN/ISO stair geometry norm."
      fields:
        riser_min: "length"
        riser_max: "length"
        going_min: "length"
        going_max: "length"
        rule_min: "length"
        rule_max: "length"
        width_min: "length"
        pitch_max: "number"
    handrails:
      default: null
      note: "Off by default. Shared variants (library rulesets/handrails)."
      fields:
        height_min: "length"
        height_max: "length"
recipe:
  profile:
    op: "polygon"
    plane: "xz"
    when: "not(has_stringers)"
    args:
      points: "profile_points"
  body:
    op: "extrude"
    plane: "xz"
    when: "not(has_stringers)"
    args:
      profile: "profile"
      from: "-hw"
      to: "hw"
  outline_below:
    op: "rectangle"
    plane: "xy"
    args:
      min: "[0, -hw]"
      max: "[x_cut, hw]"
  outline_above:
    op: "rectangle"
    plane: "xy"
    when: "x_cut < run"
    args:
      min: "[x_cut, -hw]"
      max: "[run, hw]"
  treads_below:
    op: "for_each"
    plane: "xy"
    args:
      items: "for j in 1..treads return j"
      as: "j"
      index: "i"
      do: "if tread_x[j] + tread_d[j] <= x_cut then line([tread_x[j] + tread_d[j], -hw], [tread_x[j] + tread_d[j], hw]) else null"
  treads_above:
    op: "for_each"
    plane: "xy"
    args:
      items: "for j in 1..treads return j"
      as: "j"
      index: "i"
      do: "if tread_x[j] + tread_d[j] > x_cut then line([tread_x[j] + tread_d[j], -hw], [tread_x[j] + tread_d[j], hw]) else null"
  cut_line:
    op: "polyline"
    plane: "xy"
    when: "x_cut < run"
    args:
      points: "[[x_cut - 0.15, -hw], [x_cut - 0.05, -0.1 * width], [x_cut + 0.05, 0.1 * width], [x_cut + 0.15, hw]]"
  walk_line:
    op: "polyline"
    plane: "xy"
    args:
      points: "[[tread_going / 2, 0], [run, 0]]"
  arrow:
    op: "polyline"
    plane: "xy"
    args:
      points: "[[run - 0.15, -0.075], [run, 0], [run - 0.15, 0.075]]"
  label:
    op: "text"
    plane: "xy"
    args:
      at: "[tread_going / 2, -0.12]"
      value: "arrow_label"
      height: "0.0025"
  tread_boards:
    op: "for_each"
    when: "has_stringers"
    args:
      items: "for j in 1..treads return j"
      as: "j"
      do: "box([tread_x[j] - nosing, -hw + stringer_width, j * riser - tread_thickness], [tread_x[j] + tread_d[j], hw - stringer_width, j * riser])"
  risers_boards:
    op: "for_each"
    when: "has_stringers and riser_type = \"closed\""
    args:
      items: "for j in 1..risers return j"
      as: "j"
      do: "box([(if j = 1 then 0 else tread_x[j - 1] + tread_d[j - 1]) - riser_thickness, -hw + stringer_width, (j - 1) * riser], [(if j = 1 then 0 else tread_x[j - 1] + tread_d[j - 1]), hw - stringer_width, j * riser - tread_thickness])"
  stringer_profile_1:
    op: "polygon"
    plane: "xz"
    when: "has_stringers"
    args:
      points: "if landing then [[0, 0], [tread_x[k], z_land - stringer_depth / 2], [tread_x[k], z_land + stringer_depth / 2], [0, riser]] else [[0, 0], [run, total_rise - stringer_depth], [run, total_rise], [0, riser]]"
  stringer_profile_2:
    op: "polygon"
    plane: "xz"
    when: "has_stringers and landing"
    args:
      points: "[[land_end, z_land - stringer_depth / 2], [run, total_rise - stringer_depth], [run, total_rise], [land_end, z_land + stringer_depth / 2]]"
  stringers:
    op: "union"
    when: "has_stringers"
    args:
      items: "[extrude(stringer_profile_1, -hw, -hw + stringer_width), extrude(stringer_profile_1, hw - stringer_width, hw), if landing then extrude(stringer_profile_2, -hw, -hw + stringer_width) else null, if landing then extrude(stringer_profile_2, hw - stringer_width, hw) else null]"
    note: "Side stringers along the pitch, one pair per flight; the landing frame is not modelled."
  landing_slab:
    op: "box"
    when: "has_stringers and landing"
    args:
      min: "[tread_x[k], -hw, z_land - tread_thickness - stringer_depth / 2]"
      max: "[land_end, hw, z_land]"
    note: "Landing as one block under the landing tread."
  nosings:
    op: "for_each"
    plane: "xy"
    args:
      items: "for j in 1..treads return j"
      as: "j"
      do: "if nosing > 0 then line([tread_x[j] - nosing, -hw], [tread_x[j] - nosing, hw]) else null"
  railing_left_obj:
    op: "instance"
    when: "railing_left"
    args:
      object: "\"opo-format.org/library/objects/railing-guard\""
      values: "if railing_left_fixing = \"wall\" then {predefined_type: \"HANDRAIL\", height: handrail_height, mount: \"wall\", outside: \"left\", wall_distance: 0.05, top_is_handrail: true} else {predefined_type: \"BALUSTRADE\", height: handrail_height, mount: \"embedded\", embed_depth: 0.1, top_is_handrail: true}"
      inputs: "{path: for p in rail_path_left return [p[1], p[2], p[3] - handrail_height], ground: for e in concatenate(flatten(for k in 1..count(rail_path_left) - 1 return [{p: [rail_path_left[k][1], rail_path_left[k][2], rail_path_left[k][3] - handrail_height]}, {p: [rail_path_left[k + 1][1], rail_path_left[k + 1][2], rail_path_left[k][3] - handrail_height]}]), [{p: [rail_path_left[count(rail_path_left)][1], rail_path_left[count(rail_path_left)][2], rail_path_left[count(rail_path_left)][3] - handrail_height]}]) return e.p}"
    note: "The guard follows the nosing line and stands on the steps: the stair passes its treads as the ground, so every post and baluster reaches the tread under it."
  railing_right_obj:
    op: "instance"
    when: "railing_right"
    args:
      object: "\"opo-format.org/library/objects/railing-guard\""
      values: "if railing_right_fixing = \"wall\" then {predefined_type: \"HANDRAIL\", height: handrail_height, mount: \"wall\", outside: \"right\", wall_distance: 0.05, top_is_handrail: true} else {predefined_type: \"BALUSTRADE\", height: handrail_height, mount: \"embedded\", embed_depth: 0.1, top_is_handrail: true}"
      inputs: "{path: for p in rail_path_right return [p[1], p[2], p[3] - handrail_height], ground: for e in concatenate(flatten(for k in 1..count(rail_path_right) - 1 return [{p: [rail_path_right[k][1], rail_path_right[k][2], rail_path_right[k][3] - handrail_height]}, {p: [rail_path_right[k + 1][1], rail_path_right[k + 1][2], rail_path_right[k][3] - handrail_height]}]), [{p: [rail_path_right[count(rail_path_right)][1], rail_path_right[count(rail_path_right)][2], rail_path_right[count(rail_path_right)][3] - handrail_height]}]) return e.p}"
    note: "The guard follows the nosing line and stands on the steps: the stair passes its treads as the ground, so every post and baluster reaches the tread under it."
  plan_rails:
    op: "union"
    plane: "xy"
    args:
      items: "[if railing_left then line([0, hw - 0.05], [run, hw - 0.05]) else null, if railing_right then line([0, -hw + 0.05], [run, -hw + 0.05]) else null]"
  arrow_placed:
    op: "move"
    plane: "xy"
    when: "arrow != null"
    args:
      geometry: "arrow"
      by: "[first_riser_offset, 0]"
  body_placed:
    op: "move"
    when: "body != null"
    args:
      geometry: "body"
      by: "[first_riser_offset, 0, 0]"
  cut_line_placed:
    op: "move"
    plane: "xy"
    when: "cut_line != null"
    args:
      geometry: "cut_line"
      by: "[first_riser_offset, 0]"
  label_placed:
    op: "move"
    plane: "xy"
    when: "label != null"
    args:
      geometry: "label"
      by: "[first_riser_offset, 0]"
  landing_slab_placed:
    op: "move"
    when: "landing_slab != null"
    args:
      geometry: "landing_slab"
      by: "[first_riser_offset, 0, 0]"
  nosings_placed:
    op: "move"
    plane: "xy"
    when: "nosings != null"
    args:
      geometry: "nosings"
      by: "[first_riser_offset, 0]"
  outline_above_placed:
    op: "move"
    plane: "xy"
    when: "outline_above != null"
    args:
      geometry: "outline_above"
      by: "[first_riser_offset, 0]"
  outline_below_placed:
    op: "move"
    plane: "xy"
    when: "outline_below != null"
    args:
      geometry: "outline_below"
      by: "[first_riser_offset, 0]"
  plan_rails_placed:
    op: "move"
    plane: "xy"
    when: "plan_rails != null"
    args:
      geometry: "plan_rails"
      by: "[first_riser_offset, 0]"
  railing_left_obj_placed:
    op: "move"
    when: "railing_left_obj != null"
    args:
      geometry: "railing_left_obj"
      by: "[first_riser_offset, 0, 0]"
  railing_right_obj_placed:
    op: "move"
    when: "railing_right_obj != null"
    args:
      geometry: "railing_right_obj"
      by: "[first_riser_offset, 0, 0]"
  risers_boards_placed:
    op: "move"
    when: "risers_boards != null"
    args:
      geometry: "risers_boards"
      by: "[first_riser_offset, 0, 0]"
  stringers_placed:
    op: "move"
    when: "stringers != null"
    args:
      geometry: "stringers"
      by: "[first_riser_offset, 0, 0]"
  tread_boards_placed:
    op: "move"
    when: "tread_boards != null"
    args:
      geometry: "tread_boards"
      by: "[first_riser_offset, 0, 0]"
  treads_above_placed:
    op: "move"
    plane: "xy"
    when: "treads_above != null"
    args:
      geometry: "treads_above"
      by: "[first_riser_offset, 0]"
  treads_below_placed:
    op: "move"
    plane: "xy"
    when: "treads_below != null"
    args:
      geometry: "treads_below"
      by: "[first_riser_offset, 0]"
  walk_line_placed:
    op: "move"
    plane: "xy"
    when: "walk_line != null"
    args:
      geometry: "walk_line"
      by: "[first_riser_offset, 0]"
representations:
  model.low:
    context: "model"
    lod: "low"
    scale:
      min_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body_placed"
        material: "material"
      - geometry: "stringers_placed"
        material: "if structure = \"steel_stringers\" then \"steel\" else stringer_material"
      - geometry: "tread_boards_placed"
        material: "tread_material"
  model.medium:
    context: "model"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body_placed"
        material: "material"
      - geometry: "tread_boards_placed"
        material: "tread_material"
        part: "Treads"
      - geometry: "risers_boards_placed"
        material: "tread_material"
        part: "Risers"
      - geometry: "stringers_placed"
        material: "if structure = \"steel_stringers\" then \"steel\" else stringer_material"
        part: "Stringers"
      - geometry: "landing_slab_placed"
        material: "tread_material"
        part: "Landing"
      - geometry: "railing_left_obj_placed"
        part: "Railing"
      - geometry: "railing_right_obj_placed"
        part: "Railing"
  model.high:
    context: "model"
    lod: "high"
    scale:
      max_scale: 50
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "body_placed"
        material: "material"
      - geometry: "tread_boards_placed"
        material: "tread_material"
        part: "Treads"
      - geometry: "risers_boards_placed"
        material: "tread_material"
        part: "Risers"
      - geometry: "stringers_placed"
        material: "if structure = \"steel_stringers\" then \"steel\" else stringer_material"
        part: "Stringers"
      - geometry: "landing_slab_placed"
        material: "tread_material"
        part: "Landing"
      - geometry: "railing_left_obj_placed"
        part: "Railing"
      - geometry: "railing_right_obj_placed"
        part: "Railing"
  plan.low:
    context: "plan"
    lod: "low"
    scale:
      min_scale: 200
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    source: "derived"
    derive:
      from: "model.low"
      method: "cut_or_project"
    overlay:
      - geometry: "outline_above_placed"
        class: "overhead"
      - geometry: "walk_line_placed"
        class: "annotation"
        role: "walking_line"
      - geometry: "arrow_placed"
        class: "annotation"
        role: "walking_line"
      - geometry: "label_placed"
        class: "annotation"
  plan.medium:
    context: "plan"
    lod: "medium"
    scale:
      min_scale: 50
      max_scale: 200
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    note: "Treads below the cut drawn, above it dashed; break line at the cut; walking line with arrow and label."
    source: "derived"
    derive:
      from: "model.medium"
      method: "cut_or_project"
    overlay:
      - geometry: "outline_above_placed"
        class: "overhead"
      - geometry: "treads_above_placed"
        class: "overhead"
      - geometry: "walk_line_placed"
        class: "annotation"
        role: "walking_line"
      - geometry: "arrow_placed"
        class: "annotation"
        role: "walking_line"
      - geometry: "label_placed"
        class: "annotation"
  plan.high:
    context: "plan"
    lod: "high"
    scale:
      max_scale: 50
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    source: "derived"
    derive:
      from: "model.high"
      method: "cut_or_project"
    overlay:
      - geometry: "outline_above_placed"
        class: "overhead"
      - geometry: "treads_above_placed"
        class: "overhead"
      - geometry: "walk_line_placed"
        class: "annotation"
        role: "walking_line"
      - geometry: "arrow_placed"
        class: "annotation"
        role: "walking_line"
      - geometry: "label_placed"
        class: "annotation"
  section:
    context: "section"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "SECTION_VIEW"
    derive:
      from: "model.{lod}"
      method: "cut"
  elevation:
    context: "elevation"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "ELEVATION_VIEW"
    derive:
      from: "model.{lod}"
      method: "project"
host:
  is_host: false
  level: "Base on a storey, top at the next storey (or a set rise)."
  slab_opening:
    note: "The application cuts the upper slab over the run plus headroom; the stairs rule set headroom value is the target."
  nested:
    objects:
      - "opo-format.org/library/objects/railing-guard"
    note: "Railings are nested railing-guard objects along the nosing line (on the stair) or along the stair edge (on wall brackets)."
handles:
  - parameter: "width"
    view:
      - "plan"
    at: "[first_riser_offset + run / 2, hw, 0]"
    axis: "y"
materials:
  - "reinforced_concrete"
  - "timber"
  - "steel"
ifc:
  class: "IfcStair"
  predefinedType: "if landing then \"TWO_STRAIGHT_RUN_STAIR\" else \"STRAIGHT_RUN_STAIR\""
  property_sets: "all parameters of type property_set, with the values set by `value` formulas"
  properties:
    Pset_StairCommon.NumberOfRiser: "risers"
    Pset_StairCommon.NumberOfTreads: "treads"
    Pset_StairCommon.RiserHeight: "riser"
    Pset_StairCommon.TreadLength: "tread_going"
    Pset_StairCommon.NosingLength: "nosing"
    Pset_StairCommon.WaistThickness: "if structure = \"waist\" then waist_thickness else null"
  quantities: {}
  parameter_pset: "OPO_Parameters"
  decomposition: "IfcStair aggregating one IfcStairFlight per flight (two with a landing) and the landing as IfcSlab LANDING; nested railings as IfcRailing."
