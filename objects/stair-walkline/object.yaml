id: "stair-walkline"
name: "Stair on a walkline"
version: "0.1.0"
status: "draft"
priority: "P1"
catalogue_id: "C-04"
description: "Stair along a drawn walkline with any number of straight segments; each corner is a landing or a set of winders. Treads are shared out between flights by length, so every flight has an even going. Winders are not balanced in this version. Defaults are illustrative; the stairs rule sets add regional limits."
tags:
  - "stair"
  - "walkline"
  - "winders"
  - "landing"
  - "circulation"
template: "IfcStair"
references:
  - ref: "uk-approved-document-k"
    role: "rules"
    used: "Stair and handrail limits through the shared rule sets."
  - ref: "us-irc"
    role: "rules"
    used: "Stair and handrail limits through the shared rule sets."
  - ref: "us-ibc"
    role: "rules"
    used: "Stair limits through the shared rule sets."
  - ref: "ifc-4.3-add2-ifcstair"
    role: "IFC parameters"
    used: "Class, the winding and turn stair predefined types, Pset_StairCommon property names."
sheet:
  scope: "Stair defined by a drawn walkline (straight segments) whose corners are landings or winders. Winders are split evenly along the outer edge (no balancing yet; balanced winders wait for a script step proposal, maintainer decision 25 Nov 2026). Free-form stairs, any number of turns."
  ifc: "IfcStair · CURVED_RUN_STAIR or matching …_WINDING_STAIR type (derived from the walkline)"
  based_on: "— · spec §4.14 script step · `stairs` rule set (winder rules)."
  inputs: "Slot `walkline` (flat curve; per-segment flags flight | landing; per-corner flags landing | winders) · width either side of the walkline (`inner_width`, `outer_width`) · levels."
  parameters: "Rise, maximum riser, width left and right of the walkline, corners (landings | winders), winders per corner, nosing, waist, material, handrails left and right. Each of the first four corners can be set on its own. Planned: `balancing`, `min_inner_going`."
  rules: "All C-01 rules at the walkline; winder going at narrow end ≥ min; even tread depth along the walkline."
  lod: "Plan: treads below the cut, treads above dashed, walkline and arrow. 3D: solid blocks per step (all LODs). Nested handrails. Planned: waist slab, timber treads."
parameters:
  rise_mode:
    type: "choice"
    default: "storey"
    label: "Total rise"
    group: "Rise"
    options:
      - "storey"
      - "value"
    option_labels:
      storey: "Storey height"
      value: "Value"
  rise_value:
    type: "length"
    default: 3.0
    label: "Total rise"
    group: "Rise"
    visible: "rise_mode = \"value\""
    limits:
      min: 0.1
      max: 10
  max_riser:
    type: "length"
    default: 0.18
    label: "Maximum riser"
    group: "Steps"
    limits:
      min: 0.05
      max: 0.3
    description: "Generic default (no EN/ISO stair geometry norm); the stairs rule sets set regional limits."
  left_width:
    type: "length"
    default: 0.45
    label: "Width left of the walkline"
    group: "Plan"
    limits:
      min: 0.2
      max: 2.0
    description: "Measured square to the walkline, looking up the stair."
  right_width:
    type: "length"
    default: 0.45
    label: "Width right of the walkline"
    group: "Plan"
    limits:
      min: 0.2
      max: 2.0
  corners:
    type: "choice"
    default: "winders"
    label: "Corners"
    group: "Corners"
    options:
      - "landings"
      - "winders"
    option_labels:
      landings: "Landing at every corner"
      winders: "Winders at every corner"
    description: "Applies to every corner unless a corner below is set on its own."
  corner_1:
    type: "choice"
    default: "same"
    label: "Corner 1"
    group: "Corners"
    options:
      - "same"
      - "landing"
      - "winders"
    option_labels:
      same: "As set for all corners"
      landing: "Landing"
      winders: "Winders"
    description: "Corners count from the bottom of the walkline; corners after the fourth follow the setting for all corners."
  corner_2:
    type: "choice"
    default: "same"
    label: "Corner 2"
    group: "Corners"
    options:
      - "same"
      - "landing"
      - "winders"
    option_labels:
      same: "As set for all corners"
      landing: "Landing"
      winders: "Winders"
    description: "Corners count from the bottom of the walkline; corners after the fourth follow the setting for all corners."
  corner_3:
    type: "choice"
    default: "same"
    label: "Corner 3"
    group: "Corners"
    options:
      - "same"
      - "landing"
      - "winders"
    option_labels:
      same: "As set for all corners"
      landing: "Landing"
      winders: "Winders"
    description: "Corners count from the bottom of the walkline; corners after the fourth follow the setting for all corners."
  corner_4:
    type: "choice"
    default: "same"
    label: "Corner 4"
    group: "Corners"
    options:
      - "same"
      - "landing"
      - "winders"
    option_labels:
      same: "As set for all corners"
      landing: "Landing"
      winders: "Winders"
    description: "Corners count from the bottom of the walkline; corners after the fourth follow the setting for all corners."
  winders:
    type: "integer"
    default: 3
    label: "Winders per corner"
    group: "Corners"
    limits:
      min: 2
      max: 6
  nosing:
    type: "length"
    default: 0.03
    label: "Nosing"
    group: "Treads"
    limits:
      min: 0.0
      max: 0.06
    description: "Tread overhang over the riser below."
  railing_right:
    type: "boolean"
    default: true
    label: "Handrail on the right"
    group: "Railings"
    description: "A nested railing over the tread fronts, mitred at the corners; the top rail is the handrail."
  railing_right_fixing:
    type: "choice"
    default: "stair"
    label: "Fixing"
    group: "Railings"
    options:
      - "stair"
      - "wall"
    visible: "railing_right"
    option_labels:
      stair: "Balustrade standing on the stair"
      wall: "Handrail on wall brackets"
    description: "On the stair: posts set into the steps along the nosing line, balusters, top rail as the handrail. On a wall: the handrail alone, on brackets to a wall along the stair edge."
  railing_left:
    type: "boolean"
    default: false
    label: "Handrail on the left"
    group: "Railings"
    description: "A nested railing over the tread fronts, mitred at the corners; the top rail is the handrail."
  railing_left_fixing:
    type: "choice"
    default: "stair"
    label: "Fixing"
    group: "Railings"
    options:
      - "stair"
      - "wall"
    visible: "railing_left"
    option_labels:
      stair: "Balustrade standing on the stair"
      wall: "Handrail on wall brackets"
    description: "On the stair: posts set into the steps along the nosing line, balusters, top rail as the handrail. On a wall: the handrail alone, on brackets to a wall along the stair edge."
  handrail_height:
    type: "length"
    default: 0.9
    label: "Handrail height above the pitch line"
    group: "Railings"
    limits:
      min: 0.6
      max: 1.2
    description: "Measured vertically above the nosings; the handrails rule sets check it."
  waist_thickness:
    type: "length"
    default: 0.15
    label: "Thickness under each step"
    group: "Structure"
    limits:
      min: 0.04
      max: 0.5
    description: "Slab thickness under the flights and winders, square to the pitch; landings are this much deeper than one riser."
  material:
    type: "material"
    default: "reinforced_concrete"
    label: "Concrete or fill"
    group: "Materials"
    options: "materials"
  arrow_label:
    type: "text"
    default: "UP"
    label: "Walking line label"
    group: "Drawing"
  Pset_ConcreteElementGeneral:
    type: "property_set"
    default: {}
    label: "Pset_ConcreteElementGeneral"
    group: "IFC data"
    properties:
      - name: "AssemblyPlace"
        measure: "IfcLabel"
        enum:
          - "FACTORY"
          - "OFFSITE"
          - "SITE"
          - "OTHER"
          - "NOTKNOWN"
          - "UNSET"
      - name: "CastingMethod"
        measure: "IfcLabel"
        enum:
          - "INSITU"
          - "MIXED"
          - "PRECAST"
          - "PRINTED"
          - "OTHER"
          - "NOTKNOWN"
          - "UNSET"
      - name: "StructuralClass"
        measure: "IfcLabel"
      - name: "StrengthClass"
        measure: "IfcLabel"
      - name: "ExposureClass"
        measure: "IfcLabel"
      - name: "ReinforcementVolumeRatio"
        measure: "IfcMassDensityMeasure"
      - name: "ReinforcementAreaRatio"
        measure: "IfcAreaDensityMeasure"
      - name: "DimensionalAccuracyClass"
        measure: "IfcLabel"
      - name: "ConstructionToleranceClass"
        measure: "IfcLabel"
      - name: "ConcreteCover"
        measure: "IfcPositiveLengthMeasure"
      - name: "ConcreteCoverAtMainBars"
        measure: "IfcPositiveLengthMeasure"
      - name: "ConcreteCoverAtLinks"
        measure: "IfcPositiveLengthMeasure"
      - name: "ReinforcementStrengthClass"
        measure: "IfcLabel"
    optional: true
  Pset_PrecastConcreteElementFabrication:
    type: "property_set"
    default: {}
    label: "Pset_PrecastConcreteElementFabrication"
    group: "IFC data"
    properties:
      - name: "TypeDesignation"
        measure: "IfcLabel"
      - name: "ProductionLotId"
        measure: "IfcIdentifier"
      - name: "SerialNumber"
        measure: "IfcIdentifier"
      - name: "PieceMark"
        measure: "IfcLabel"
      - name: "AsBuiltLocationNumber"
        measure: "IfcLabel"
      - name: "ActualProductionDate"
        measure: "IfcDateTime"
      - name: "ActualErectionDate"
        measure: "IfcDateTime"
    optional: true
  Pset_PrecastConcreteElementGeneral:
    type: "property_set"
    default: {}
