host:
  is_host: false
  level: "Base on a storey, top at the next storey (or a set rise)."
  slab_opening:
    note: "The application cuts the upper slab over the run plus headroom; the stairs rule set headroom value is the target."
  nested:
    objects:
      - "opo-format.org/library/objects/railing-guard"
    note: "Railings are nested railing-guard objects along the nosing line (on the stair) or along the stair edge (on wall brackets)."
handles:
  - parameter: "left_width"
    view:
      - "plan"
    at: "[walkline[1][1] + (left_width * sn[1][1]), walkline[1][2] + (left_width * sn[1][2])]"
    axis: "y"
materials:
  - "reinforced_concrete"
  - "timber"
  - "steel"
ifc:
  class: "IfcStair"
  predefinedType: "if nc = 0 then \"STRAIGHT_RUN_STAIR\" else if count(index_of(ckind, \"landing\")) = 0 then (if nc = 1 then \"QUARTER_WINDING_STAIR\" else if nc = 2 then \"TWO_QUARTER_WINDING_STAIR\" else if nc = 3 then \"THREE_QUARTER_WINDING_STAIR\" else \"CURVED_RUN_STAIR\") else if count(index_of(ckind, \"winders\")) = 0 then (if nc = 1 then \"QUARTER_TURN_STAIR\" else if nc = 2 then \"TWO_QUARTER_TURN_STAIR\" else if nc = 3 then \"THREE_QUARTER_TURN_STAIR\" else \"CURVED_RUN_STAIR\") else \"USERDEFINED\""
  property_sets: "all parameters of type property_set, with the values set by `value` formulas"
  properties:
    Pset_StairCommon.NumberOfRiser: "risers"
