slots:
  walkline:
    type: "polyline"
    plane: "xy"
    default: [[0.0, 0.0], [2.4, 0.0], [2.4, 1.8], [1.2, 1.8]]
    description: "The walkline, drawn up the stair from the first riser to the top. Straight segments; each corner becomes a landing or winders."
rules:
  derived:
    total_rise: "if rise_mode = \"storey\" then level.height else rise_value"
    risers: "ceiling(total_rise / max_riser)"
    riser: "total_rise / risers"
    treads: "risers - 1"
    nseg: "count(walkline) - 1"
    nc: "nseg - 1"
    sl:
      expr: "for i in 1..nseg return sqrt((walkline[i + 1][1] - walkline[i][1]) * (walkline[i + 1][1] - walkline[i][1]) + (walkline[i + 1][2] - walkline[i][2]) * (walkline[i + 1][2] - walkline[i][2]))"
      note: "Segment lengths."
    sd:
      expr: "for i in 1..nseg return [(walkline[i + 1][1] - walkline[i][1]) / sl[i], (walkline[i + 1][2] - walkline[i][2]) / sl[i]]"
      note: "Segment directions (unit)."
    sn:
      expr: "for d in sd return [-d[2], d[1]]"
      note: "Left normals."
    cidx: "if nc > 0 then for c in 1..nc return c else []"
    ccos: "for c in cidx return sd[c][1] * sd[c + 1][1] + sd[c][2] * sd[c + 1][2]"
    cleft:
      expr: "for c in cidx return sd[c][1] * sd[c + 1][2] - sd[c][2] * sd[c + 1][1] > 0"
      note: "The stair turns left at this corner (the inner side is the left)."
    ce:
      expr: "for c in cidx return max(left_width, right_width) * sqrt(max(0, (1 - ccos[c]) / (1 + ccos[c])))"
      note: "How far each flight stops short of the corner point."
    cbis: "for c in cidx return [(sn[c][1] + sn[c + 1][1]) / (1 + ccos[c]), (sn[c][2] + sn[c + 1][2]) / (1 + ccos[c])]"
    c_left: "for c in cidx return [(walkline[c + 1][1]) + (left_width * cbis[c][1]), (walkline[c + 1][2]) + (left_width * cbis[c][2])]"
    c_right: "for c in cidx return [(walkline[c + 1][1]) + (-right_width * cbis[c][1]), (walkline[c + 1][2]) + (-right_width * cbis[c][2])]"
    c_end_left: "for c in cidx return [(walkline[c + 1][1]) + (-ce[c] * sd[c][1]) + (left_width * sn[c][1]), (walkline[c + 1][2]) + (-ce[c] * sd[c][2]) + (left_width * sn[c][2])]"
    c_end_right: "for c in cidx return [(walkline[c + 1][1]) + (-ce[c] * sd[c][1]) + (-right_width * sn[c][1]), (walkline[c + 1][2]) + (-ce[c] * sd[c][2]) + (-right_width * sn[c][2])]"
    c_start_left: "for c in cidx return [(walkline[c + 1][1]) + (ce[c] * (sd[c + 1][1])) + (left_width * (sn[c + 1][1])), (walkline[c + 1][2]) + (ce[c] * (sd[c + 1][2])) + (left_width * (sn[c + 1][2]))]"
    c_start_right: "for c in cidx return [(walkline[c + 1][1]) + (ce[c] * (sd[c + 1][1])) + (-right_width * (sn[c + 1][1])), (walkline[c + 1][2]) + (ce[c] * (sd[c + 1][2])) + (-right_width * (sn[c + 1][2]))]"
    c_inner: "for c in cidx return if cleft[c] then c_left[c] else c_right[c]"
    c_outer: "for c in cidx return if cleft[c] then c_right[c] else c_left[c]"
    c_end_inner: "for c in cidx return if cleft[c] then c_end_left[c] else c_end_right[c]"
    c_end_outer: "for c in cidx return if cleft[c] then c_end_right[c] else c_end_left[c]"
    c_start_inner: "for c in cidx return if cleft[c] then c_start_left[c] else c_start_right[c]"
    c_start_outer: "for c in cidx return if cleft[c] then c_start_right[c] else c_start_left[c]"
    cl1: "for c in cidx return sqrt((c_outer[c][1] - c_end_outer[c][1]) * (c_outer[c][1] - c_end_outer[c][1]) + (c_outer[c][2] - c_end_outer[c][2]) * (c_outer[c][2] - c_end_outer[c][2]))"
    cl2: "for c in cidx return sqrt((c_start_outer[c][1] - c_outer[c][1]) * (c_start_outer[c][1] - c_outer[c][1]) + (c_start_outer[c][2] - c_outer[c][2]) * (c_start_outer[c][2] - c_outer[c][2]))"
    fe0: "for i in 1..nseg return if i = 1 then 0 else ce[i - 1]"
    fe1: "for i in 1..nseg return if i = nseg then 0 else ce[i]"
    fl:
      expr: "for i in 1..nseg return sl[i] - fe0[i] - fe1[i]"
      note: "Flight lengths along the walkline, between the corners."
    ckind:
      expr: "for c in cidx return if c <= 4 and [corner_1, corner_2, corner_3, corner_4][c] != \"same\" then [corner_1, corner_2, corner_3, corner_4][c] else (if corners = \"landings\" then \"landing\" else \"winders\")"
      note: "Landing or winders at each corner."
    cu:
      expr: "for c in cidx return if ckind[c] = \"landing\" then 1 else winders"
      note: "Treads used by each corner (a landing counts as one)."
    nflight_treads: "treads - sum(cu)"
    fcum: "for i in 1..nseg return sum(for j in 1..i return max(fl[j], 0))"
    nf:
      expr: "for i in 1..nseg return round(nflight_treads * fcum[i] / fcum[nseg]) - (if i = 1 then 0 else round(nflight_treads * fcum[i - 1] / fcum[nseg]))"
      note: "Treads per flight, shared out by flight length."
    fg:
      expr: "for i in 1..nseg return if nf[i] > 0 then fl[i] / nf[i] else 0"
      note: "Going of each flight at the walkline."
    going:
      expr: "sum(fl) / max(1, sum(nf))"
      note: "Mean flight going at the walkline (reported to IFC)."
    pitch: "atan2(riser, going)"
    step_rule:
      expr: "2 * riser + going"
      note: "Shown for information; checked by a rule set."
    fbase: "for i in 1..nseg return sum(for j in 1..i return if j < i then nf[j] + cu[j] else 0)"
    cbase: "for c in cidx return sum(for j in 1..c return nf[j] + (if j < c then cu[j] else 0))"
    flight_treads:
      expr: "flatten(for i in 1..nseg return if nf[i] < 1 then [] else for t in 1..nf[i] return {n: fbase[i] + t, pts: [{x: (walkline[i][1] + (fe0[i] * sd[i][1])) + ((t - 1) * fg[i] * sd[i][1]) + (left_width * sn[i][1]), y: (walkline[i][2] + (fe0[i] * sd[i][2])) + ((t - 1) * fg[i] * sd[i][2]) + (left_width * sn[i][2])}, {x: (walkline[i][1] + (fe0[i] * sd[i][1])) + ((t - 1) * fg[i] * sd[i][1]) + (-right_width * sn[i][1]), y: (walkline[i][2] + (fe0[i] * sd[i][2])) + ((t - 1) * fg[i] * sd[i][2]) + (-right_width * sn[i][2])}, {x: (walkline[i][1] + (fe0[i] * sd[i][1])) + (t * fg[i] * sd[i][1]) + (-right_width * sn[i][1]), y: (walkline[i][2] + (fe0[i] * sd[i][2])) + (t * fg[i] * sd[i][2]) + (-right_width * sn[i][2])}, {x: (walkline[i][1] + (fe0[i] * sd[i][1])) + (t * fg[i] * sd[i][1]) + (left_width * sn[i][1]), y: (walkline[i][2] + (fe0[i] * sd[i][2])) + (t * fg[i] * sd[i][2]) + (left_width * sn[i][2])}]})"
      note: "Plan outline and number of every flight tread."
    corner_treads:
      expr: "flatten(for c in cidx return if ckind[c] = \"landing\" then [{n: cbase[c] + 1, pts: [{x: c_end_left[c][1], y: c_end_left[c][2]}, {x: c_end_right[c][1], y: c_end_right[c][2]}, {x: c_right[c][1], y: c_right[c][2]}, {x: c_start_right[c][1], y: c_start_right[c][2]}, {x: c_start_left[c][1], y: c_start_left[c][2]}, {x: c_left[c][1], y: c_left[c][2]}]}] else for j in 1..winders return {n: cbase[c] + j, pts: flatten([if j = 1 then [{x: c_end_inner[c][1], y: c_end_inner[c][2]}] else [], [{x: (if ((j - 1) * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][1] + (c_outer[c][1] - c_end_outer[c][1]) * ((j - 1) * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][1] + (c_start_outer[c][1] - c_outer[c][1]) * (((j - 1) * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9)), y: (if ((j - 1) * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][2] + (c_outer[c][2] - c_end_outer[c][2]) * ((j - 1) * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][2] + (c_start_outer[c][2] - c_outer[c][2]) * (((j - 1) * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9))}], if ((j - 1) * (cl1[c] + cl2[c]) / winders) < cl1[c] and (j * (cl1[c] + cl2[c]) / winders) > cl1[c] then [{x: c_outer[c][1], y: c_outer[c][2]}] else [], [{x: (if (j * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][1] + (c_outer[c][1] - c_end_outer[c][1]) * (j * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][1] + (c_start_outer[c][1] - c_outer[c][1]) * ((j * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9)), y: (if (j * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][2] + (c_outer[c][2] - c_end_outer[c][2]) * (j * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][2] + (c_start_outer[c][2] - c_outer[c][2]) * ((j * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9))}], if j = winders then [{x: c_start_inner[c][1], y: c_start_inner[c][2]}] else [], [{x: c_inner[c][1], y: c_inner[c][2]}]])})"
      note: "Landings (one hexagon) or winders, split evenly along the outer edge and fanned from the inner corner."
    all_treads:
      expr: "for s in concatenate(flight_treads, corner_treads) return {n: s.n, pts: for k in 1..count(s.pts) return if abs(s.pts[k].x - s.pts[modulo(k - 2 + count(s.pts), count(s.pts)) + 1].x) + abs(s.pts[k].y - s.pts[modulo(k - 2 + count(s.pts), count(s.pts)) + 1].y) > 1e-6 then [s.pts[k].x, s.pts[k].y] else null}"
      note: "Every tread as a list of points; repeated points come out as null and are dropped below."
    tread_list:
      expr: "for s in all_treads return {n: s.n, pts: flatten(for p in s.pts return if p = null then [] else [{x: p[1], y: p[2]}])}"
      note: "Null points removed."
    treads_xy: "for s in tread_list return {n: s.n, z: s.n * riser, poly: for p in s.pts return [p.x, p.y]}"
    waist_v:
      expr: "waist_thickness / cos(atan2(riser, going))"
      note: "Waist measured vertically, from the mean pitch."
    corner_ns: "for s in corner_treads return s.n"
    flight_slabs:
      expr: "for i in 1..nseg return if nf[i] < 1 then null else {pts: concatenate([{x: 0, z: fbase[i] * riser}], flatten(for t in 1..nf[i] return [{x: (t - 1) * fg[i], z: (fbase[i] + t) * riser}, {x: t * fg[i], z: (fbase[i] + t) * riser}]), [{x: fl[i], z: (fbase[i] + nf[i]) * riser - waist_v}], if i = 1 then [{x: waist_v * fg[i] / riser, z: 0}] else [{x: 0, z: fbase[i] * riser - waist_v}]), a: [walkline[i][1] + sd[i][1] * fe0[i] + sn[i][1] * left_width, walkline[i][2] + sd[i][2] * fe0[i] + sn[i][2] * left_width, 0], b: [walkline[i][1] + sd[i][1] * fe0[i] - sn[i][1] * right_width, walkline[i][2] + sd[i][2] * fe0[i] - sn[i][2] * right_width, 0]}"
      note: "Each straight flight as one sloping slab: the steps on top, the underside parallel to the pitch, waist_thickness below the inner corners."
    winder_ns:
      expr: "flatten(for c in cidx return if ckind[c] = \"winders\" then for j in 1..winders return cbase[c] + j else [])"
      note: "Numbers of the winder treads."
    winder_slabs:
      expr: "for c in cidx return if ckind[c] != \"winders\" then null else for j in 0..winders return [[(if j = 0 then c_end_inner[c][1] else if j = winders then c_start_inner[c][1] else c_inner[c][1]), (if j = 0 then c_end_inner[c][2] else if j = winders then c_start_inner[c][2] else c_inner[c][2]), (cbase[c] + j) * riser], [(if (j * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][1] + (c_outer[c][1] - c_end_outer[c][1]) * (j * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][1] + (c_start_outer[c][1] - c_outer[c][1]) * ((j * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9)), (if (j * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][2] + (c_outer[c][2] - c_end_outer[c][2]) * (j * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][2] + (c_start_outer[c][2] - c_outer[c][2]) * ((j * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9)), (cbase[c] + j) * riser], [(if (j * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][1] + (c_outer[c][1] - c_end_outer[c][1]) * (j * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][1] + (c_start_outer[c][1] - c_outer[c][1]) * ((j * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9)), (if (j * (cl1[c] + cl2[c]) / winders) <= cl1[c] then c_end_outer[c][2] + (c_outer[c][2] - c_end_outer[c][2]) * (j * (cl1[c] + cl2[c]) / winders) / max(cl1[c], 1e-9) else c_outer[c][2] + (c_start_outer[c][2] - c_outer[c][2]) * ((j * (cl1[c] + cl2[c]) / winders) - cl1[c]) / max(cl2[c], 1e-9)), (cbase[c] + j) * riser - waist_v], [(if j = 0 then c_end_inner[c][1] else if j = winders then c_start_inner[c][1] else c_inner[c][1]), (if j = 0 then c_end_inner[c][2] else if j = winders then c_start_inner[c][2] else c_inner[c][2]), (cbase[c] + j) * riser - waist_v]]"
      note: "Cross-sections of the slab under each run of winders, one on every winder line (from the inner corner to the outer edge), rising one riser per winder; the first and last match the ends of the flights."
    j_cut: "floor(view.cut_height / riser)"
    rail_path_right:
      expr: "concatenate(for q in flatten(for i in 1..nseg return concatenate(if nf[i] < 1 then [] else for t in 1..nf[i] return {p: [walkline[i][1] + sd[i][1] * (fe0[i] + (t - 1) * fg[i]) + sn[i][1] * (-(right_width - 0.05)), walkline[i][2] + sd[i][2] * (fe0[i] + (t - 1) * fg[i]) + sn[i][2] * (-(right_width - 0.05)), (fbase[i] + t) * riser + handrail_height]}, if i < nseg then [{p: [walkline[i + 1][1] + cbis[i][1] * (-(right_width - 0.05)), walkline[i + 1][2] + cbis[i][2] * (-(right_width - 0.05)), (cbase[i] + (cu[i] + 1) / 2) * riser + handrail_height]}] else [])) return q.p, [[walkline[nseg + 1][1] + sn[nseg][1] * (-(right_width - 0.05)), walkline[nseg + 1][2] + sn[nseg][2] * (-(right_width - 0.05)), total_rise + handrail_height]])"
      note: "Right handrail over the tread fronts, at the middle corner tread height across each corner."
    rail_path_left: "concatenate(for q in flatten(for i in 1..nseg return concatenate(if nf[i] < 1 then [] else for t in 1..nf[i] return {p: [walkline[i][1] + sd[i][1] * (fe0[i] + (t - 1) * fg[i]) + sn[i][1] * (left_width - 0.05), walkline[i][2] + sd[i][2] * (fe0[i] + (t - 1) * fg[i]) + sn[i][2] * (left_width - 0.05), (fbase[i] + t) * riser + handrail_height]}, if i < nseg then [{p: [walkline[i + 1][1] + cbis[i][1] * (left_width - 0.05), walkline[i + 1][2] + cbis[i][2] * (left_width - 0.05), (cbase[i] + (cu[i] + 1) / 2) * riser + handrail_height]}] else [])) return q.p, [[walkline[nseg + 1][1] + sn[nseg][1] * (left_width - 0.05), walkline[nseg + 1][2] + sn[nseg][2] * (left_width - 0.05), total_rise + handrail_height]])"
    start_pt: "walkline[1]"
    end_pt: "walkline[count(walkline)]"
    end_dir: "sd[nseg]"
    first_line: "[[walkline[1][1] + (left_width * sn[1][1]), walkline[1][2] + (left_width * sn[1][2])], [walkline[1][1] + (-right_width * sn[1][1]), walkline[1][2] + (-right_width * sn[1][2])]]"
    top_line: "[[end_pt[1] + (left_width * sn[nseg][1]), end_pt[2] + (left_width * sn[nseg][2])], [end_pt[1] + (-right_width * sn[nseg][1]), end_pt[2] + (-right_width * sn[nseg][2])]]"
    walk_points: "concatenate([walkline[1]], for i in 2..count(walkline) return walkline[i])"
  checks:
    min_risers:
      expr: "risers >= 2"
      severity: "error"
      message: "A stair needs at least two risers."
    walkline_points:
      expr: "count(walkline) >= 2"
      severity: "error"
      message: "The walkline needs at least two points."
    corner_angles:
      expr: "nc = 0 or min(ccos) > -0.5"
      severity: "error"
      message: "A walkline corner turns by more than 120°: split a U-turn into two corners."
    flights_fit:
      expr: "min(fl) > 0"
      severity: "error"
      message: "A walkline segment is too short for the corners at its ends."
    flight_treads:
      expr: "min(nf) >= 1"
      severity: "error"
      message: "A flight gets no tread: the walkline is too long for the number of risers, or the corners use too many treads."
    riser_range:
      expr: "rules.stairs = null or (riser >= rules.stairs.riser_min and riser <= rules.stairs.riser_max)"
      severity: "warning"
      message: "Riser is outside the active rule set."
    going_range:
      expr: "rules.stairs = null or (min(for g in fg return g) >= rules.stairs.going_min and max(for g in fg return g) <= rules.stairs.going_max)"
      severity: "warning"
      message: "A flight going is outside the active rule set."
    step_rule_range:
      expr: "rules.stairs = null or rules.stairs.rule_min = null or (step_rule >= rules.stairs.rule_min and step_rule <= rules.stairs.rule_max)"
      severity: "warning"
      message: "2R + G is outside the active rule set."
    width_min:
      expr: "rules.stairs = null or rules.stairs.width_min = null or left_width + right_width >= rules.stairs.width_min"
      severity: "warning"
      message: "Width is below the active rule set."
    pitch_range:
      expr: "rules.stairs = null or rules.stairs.pitch_max = null or pitch <= rules.stairs.pitch_max"
      severity: "warning"
      message: "The pitch is steeper than the active rule set allows."
    handrail_range:
      expr: "rules.handrails = null or (handrail_height >= rules.handrails.height_min and handrail_height <= rules.handrails.height_max)"
      severity: "warning"
      message: "The handrail height is outside the active rule set."
  rulesets:
    stairs:
      default: null
      note: "Off by default. Shared variants (library rulesets/stairs) give UK and US limits; there is no EN/ISO stair geometry norm."
      fields:
        riser_min: "length"
        riser_max: "length"
        going_min: "length"
        going_max: "length"
        rule_min: "length"
        rule_max: "length"
        width_min: "length"
        pitch_max: "number"
    handrails:
      default: null
      note: "Off by default. Shared variants (library rulesets/handrails)."
      fields:
        height_min: "length"
        height_max: "length"
recipe:
  steps:
    op: "for_each"
    plane: "xy"
    args:
      items: "treads_xy"
      as: "s"
      do: "if count(index_of(winder_ns, s.n)) > 0 then extrude(polygon(s.poly), s.z - riser, s.z) else if count(index_of(corner_ns, s.n)) > 0 then extrude(polygon(s.poly), max(0, s.z - riser - waist_v), s.z) else null"
    note: "Winders as one-riser steps on the winder slab; landings as blocks down to the waist line."
  winder_soffits:
    op: "for_each"
    args:
      items: "winder_slabs"
      as: "w"
      do: "if w = null then null else loft(w)"
    note: "A smooth slab under each run of winders, continuing the flight slabs on either side (proposal 0003)."
  flights:
    op: "for_each"
    plane: "profile"
    args:
      items: "flight_slabs"
      as: "f"
      do: "if f = null then null else sweep(polygon(for p in f.pts return [p.x, p.z]), [f.a, f.b])"
    note: "Each flight swept across its width from the left edge to the right edge."
  treads_below:
    op: "for_each"
    plane: "xy"
    args:
      items: "treads_xy"
      as: "s"
      do: "if s.n <= j_cut then polygon(s.poly) else null"
  treads_above:
    op: "for_each"
    plane: "xy"
    args:
      items: "treads_xy"
      as: "s"
      do: "if s.n > j_cut then polygon(s.poly) else null"
  start_line:
    op: "line"
    plane: "xy"
    args:
      start: "first_line[1]"
      end: "first_line[2]"
  walk_line:
    op: "polyline"
    plane: "xy"
    args:
      points: "walkline"
  arrow:
    op: "polyline"
    plane: "xy"
    args:
      points: "[[end_pt[1] + (-0.15 * end_dir[1]) + (0.075 * sn[nseg][1]), end_pt[2] + (-0.15 * end_dir[2]) + (0.075 * sn[nseg][2])], [end_pt[1], end_pt[2]], [end_pt[1] + (-0.15 * end_dir[1]) + (-0.075 * sn[nseg][1]), end_pt[2] + (-0.15 * end_dir[2]) + (-0.075 * sn[nseg][2])]]"
  railing_right_obj:
    op: "instance"
    when: "railing_right"
    args:
      object: "\"opo-format.org/library/objects/railing-guard\""
      values: "if railing_right_fixing = \"wall\" then {predefined_type: \"HANDRAIL\", height: handrail_height, mount: \"wall\", outside: \"right\", wall_distance: 0.05, top_is_handrail: true} else {predefined_type: \"BALUSTRADE\", height: handrail_height, mount: \"embedded\", embed_depth: min(riser + 0.05, waist_thickness - 0.01), top_is_handrail: true}"
      inputs: "{path: for p in rail_path_right return [p[1], p[2], p[3] - handrail_height]}"
    note: "The guard follows the nosing line; its posts go down into the steps (up to one riser plus 0.05 m, no deeper than the slab) so they stand on every tread."
  railing_left_obj:
    op: "instance"
    when: "railing_left"
    args:
      object: "\"opo-format.org/library/objects/railing-guard\""
      values: "if railing_left_fixing = \"wall\" then {predefined_type: \"HANDRAIL\", height: handrail_height, mount: \"wall\", outside: \"left\", wall_distance: 0.05, top_is_handrail: true} else {predefined_type: \"BALUSTRADE\", height: handrail_height, mount: \"embedded\", embed_depth: min(riser + 0.05, waist_thickness - 0.01), top_is_handrail: true}"
      inputs: "{path: for p in rail_path_left return [p[1], p[2], p[3] - handrail_height]}"
    note: "The guard follows the nosing line; its posts go down into the steps (up to one riser plus 0.05 m, no deeper than the slab) so they stand on every tread."
  plan_rails:
    op: "union"
    plane: "xy"
    args:
      items: "[if railing_right then polyline(for p in rail_path_right return [p[1], p[2]]) else null, if railing_left then polyline(for p in rail_path_left return [p[1], p[2]]) else null]"
  label:
    op: "text"
    plane: "xy"
    args:
      at: "[walkline[1][1] + (0.15 * sd[1][1]) + (-0.12 * sn[1][1]), walkline[1][2] + (0.15 * sd[1][2]) + (-0.12 * sn[1][2])]"
      value: "arrow_label"
      height: "0.0025"
