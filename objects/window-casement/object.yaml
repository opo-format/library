id: "window-casement"
name: "Casement / tilt-turn window"
status: "planned"
priority: "P1"
catalogue_id: "O-08"
ifc:
  class: "IfcWindow"
  predefinedType: "WINDOW"
sheet:
  scope: "The reference rectangular window: 1–3 vertical panels, optional transom with top light, each panel fixed, side-hung (casement) or tilt-turn; frame, sash, glazing unit, glazing bars, sill, handles. Inward (EU) or outward (UK/US casement) opening."
  not_in_scope:
    - "shaped outlines (O-13)"
    - "shutters and blinds (later accessory objects)"
  ifc: "IfcWindow · WINDOW · PartitioningType SINGLE_PANEL / DOUBLE_PANEL_VERTICAL / TRIPLE_PANEL_VERTICAL / … (with transom: …_HORIZONTAL variants) · panel OperationType SIDEHUNGLEFTHAND/RIGHTHAND, TILTANDTURNLEFTHAND/RIGHTHAND, FIXEDCASEMENT"
  based_on: "FreeCAD window presets Fixed / Open 1-pane / Open 2-pane (LGPL, reference: frame + panel wires, opening modes \"Arc 90\", \"Triangle\" symbols) · IFC window psets · sizes per market."
  inputs: "Host wall."
  parameters: "`nominal_reference` opening | frame_outside | rough_opening · `width`, `height`, `sill_height` · `panels` 1–3 + `panel_operations` list (fixed | side_left | side_right | tilt_turn_left | tilt_turn_right) · `transom` (bool + height) · `opening_direction` in | out · frame: `lining_thickness` (frame width, default 0.07 m), `lining_depth` (frame depth, default 0.08 m) · sash: `sash_width` (default 0.06 m), `sash_depth` · `glazing_thickness` (default 0.024 m double, 0.044 m triple) · `glazing_bars` none | grid (rows × cols) · `reveal_offset` (frame position in wall depth) · sills: interior board (projection, thickness), exterior sill (projection, drip) · `handle_height` (on sash, default centre)."
  rules: "Side-hung sash width limit from hardware data (warning; value to confirm) · net clear opening for `escape_windows` (US) · sill below guard height → guard check · total U-value not modelled (data only)."
  sizes: "EU: no EN/ISO window size norm; generic openings in 100 mm steps (not a norm) · UK: makers' sizes *(to collect)* · US casement: widths about 16\"–48\", heights 24\"–84\"; sizes typically step 2\" in width and 6\" in height."
  lod: "3D: low pane in opening · medium frame, sash, glass, sills · high + glazing beads, handles, hinges. Plan: low frame lines + glass line · medium frame/sash cut (hatched) + glass + sills · high cut. Elevation: medium frame, sash outlines, opening triangles (annotation, apex at hinge side; tilt shown as triangle pointing down)."
  open_questions:
    - "Exact frame/sash profiles: one generic profile (timber, PVC, aluminium as presets) vs. profile input slot."
