id: "window-casement"
name: "Casement / tilt-turn window"
version: "0.1.0"
status: "draft"
priority: "P1"
catalogue_id: "O-08"
description: "Window in a wall opening with 1–3 panels, each fixed, side-hung or tilt-turn, opening in or out, an optional transom with a fixed top light, frame, mullions, sashes, glazing, glazing bars, interior and exterior sills and handles. In custom outline mode the frame follows the outline and the window has one fixed pane. Defaults are illustrative design values, not maker or norm values; the escape windows and guards rule sets add checks."
tags:
  - "window"
  - "casement"
  - "tilt-turn"
  - "outline"
  - "openings"
template: "IfcWindow"
references:
  - ref: "ifc-4.3-add2-ifcwindow"
    role: "IFC parameters"
    used: "Class, PartitioningType, Pset_WindowLiningProperties and Pset_WindowPanelProperties names."
  - ref: "us-irc"
    role: "rules"
    used: "Escape window and guard checks through the shared rule sets."
sheet:
  scope: "The reference rectangular window: 1–3 vertical panels, optional transom with top light, each panel fixed, side-hung (casement) or tilt-turn; frame, sash, glazing unit, glazing bars, sill, handles. Inward (EU) or outward (UK/US casement) opening."
  not_in_scope:
    - "shaped outlines (O-13)"
    - "shutters and blinds (later accessory objects)"
  ifc: "IfcWindow · WINDOW · PartitioningType SINGLE_PANEL / DOUBLE_PANEL_VERTICAL / TRIPLE_PANEL_VERTICAL / … (with transom: …_HORIZONTAL variants) · panel OperationType SIDEHUNGLEFTHAND/RIGHTHAND, TILTANDTURNLEFTHAND/RIGHTHAND, FIXEDCASEMENT"
  based_on: "FreeCAD window presets Fixed / Open 1-pane / Open 2-pane (LGPL, reference: frame + panel wires, opening modes \"Arc 90\", \"Triangle\" symbols) · IFC window psets · sizes per market."
  inputs: "Host wall."
  parameters: "`nominal_reference` opening | frame_outside | rough_opening · `width`, `height`, `sill_height` · `panels` 1–3 + `panel_1_operation`…`panel_3_operation` (fixed | side_left | side_right | tilt_turn_left | tilt_turn_right) · `transom` (bool) + `top_light_height` · `opening_direction` in | out · frame: `frame_width` (lining thickness), `frame_depth` (lining depth, default 0.08 m) · sash: `sash_width` (default 0.06 m), `sash_depth` · `glass_thickness` (glazing unit) · glazing bars: `bar_rows` × `bar_columns` (0 = none), `bar_width` · `reveal_offset` (frame position in wall depth) · sills: interior board (projection, thickness), exterior sill (projection, drip) · `handle_height` (on sash, default centre)."
  rules: "Side-hung sash width limit from hardware data (warning; value to confirm) · net clear opening for `escape_windows` (US) · sill below guard height → guard check · total U-value not modelled (data only)."
  sizes: "EU: no EN/ISO window size norm; generic openings in 100 mm steps (not a norm) · UK: makers' sizes *(to collect)* · US casement: widths about 16\"–48\", heights 24\"–84\"; sizes typically step 2\" in width and 6\" in height."
  lod: "3D: low pane in opening · medium frame, sash, glass, sills · high + glazing beads, handles, hinges. Plan: low frame lines + glass line · medium frame/sash cut (hatched) + glass + sills · high cut. Elevation: medium frame, sash outlines, opening triangles (annotation, apex at hinge side; tilt shown as triangle pointing down)."
  open_questions:
    - "Exact frame/sash profiles: one generic profile (timber, PVC, aluminium as presets) vs. profile input slot."
parameters:
  outline_mode:
    type: "choice"
    default: "rectangle"
    label: "Shape"
    group: "Size"
    options:
      - "rectangle"
      - "custom"
    option_labels:
      rectangle: "Rectangle (width × height drive)"
      custom: "Custom outline (outline drives, width and height read-only)"
  width:
    type: "length"
    default: 1.2
    label: "Width"
    group: "Size"
    visible: "outline_mode = \"rectangle\""
    limits:
      min: 0.01
      max: 50
  height:
    type: "length"
    default: 1.35
    label: "Height"
    group: "Size"
    visible: "outline_mode = \"rectangle\""
    limits:
      min: 0.01
      max: 50
  sill_height:
    type: "length"
    default: 0.9
    label: "Bottom above host base"
    group: "Placement"
    limits:
      min: -5
      max: 50
  nominal_reference:
    type: "choice"
    default: "opening"
    label: "Width and height refer to"
    group: "Size"
    options:
      - "opening"
      - "frame_outside"
      - "rough_opening"
    option_labels:
      opening: "Wall opening"
      frame_outside: "Frame outside"
      rough_opening: "Rough opening (US framing; the same as the wall opening here)"
  fitting_gap:
    type: "length"
    default: 0.01
    label: "Fitting gap round the frame"
    group: "Frame"
    limits:
      min: 0.0
      max: 0.05
  panels:
    type: "integer"
    default: 2
    label: "Panels"
    group: "Panels"
    visible: "outline_mode = \"rectangle\""
    limits:
      min: 1
      max: 3
  panel_1_operation:
    type: "choice"
    default: "side_left"
    label: "Panel 1"
    group: "Panels"
    options:
      - "fixed"
      - "side_left"
      - "side_right"
      - "tilt_turn_left"
      - "tilt_turn_right"
      - "tilt"
      - "top_hung"
      - "sliding_left"
      - "sliding_right"
    visible: "outline_mode = \"rectangle\" and panels >= 1"
    option_labels:
      fixed: "Fixed"
      side_left: "Side-hung, hinges left"
      side_right: "Side-hung, hinges right"
      tilt_turn_left: "Tilt-turn, hinges left"
      tilt_turn_right: "Tilt-turn, hinges right"
      tilt: "Bottom-hung, tilts in (basculante)"
      top_hung: "Top-hung, projects out"
      sliding_left: "Sliding, opens to the left"
      sliding_right: "Sliding, opens to the right"
  panel_2_operation:
    type: "choice"
    default: "tilt_turn_right"
    label: "Panel 2"
    group: "Panels"
    options:
      - "fixed"
      - "side_left"
      - "side_right"
      - "tilt_turn_left"
      - "tilt_turn_right"
      - "tilt"
      - "top_hung"
      - "sliding_left"
      - "sliding_right"
    visible: "outline_mode = \"rectangle\" and panels >= 2"
    option_labels:
      fixed: "Fixed"
      side_left: "Side-hung, hinges left"
      side_right: "Side-hung, hinges right"
      tilt_turn_left: "Tilt-turn, hinges left"
      tilt_turn_right: "Tilt-turn, hinges right"
      tilt: "Bottom-hung, tilts in (basculante)"
      top_hung: "Top-hung, projects out"
      sliding_left: "Sliding, opens to the left"
      sliding_right: "Sliding, opens to the right"
  panel_3_operation:
    type: "choice"
    default: "fixed"
    label: "Panel 3"
    group: "Panels"
    options:
      - "fixed"
      - "side_left"
      - "side_right"
      - "tilt_turn_left"
      - "tilt_turn_right"
      - "tilt"
      - "top_hung"
      - "sliding_left"
      - "sliding_right"
    visible: "outline_mode = \"rectangle\" and panels >= 3"
    option_labels:
      fixed: "Fixed"
      side_left: "Side-hung, hinges left"
      side_right: "Side-hung, hinges right"
      tilt_turn_left: "Tilt-turn, hinges left"
      tilt_turn_right: "Tilt-turn, hinges right"
      tilt: "Bottom-hung, tilts in (basculante)"
      top_hung: "Top-hung, projects out"
      sliding_left: "Sliding, opens to the left"
      sliding_right: "Sliding, opens to the right"
  transom:
    type: "boolean"
    default: false
    label: "Transom with a fixed top light"
    group: "Panels"
    visible: "outline_mode = \"rectangle\""
  top_light_height:
    type: "length"
    default: 0.4
    label: "Top light height"
    group: "Panels"
    visible: "outline_mode = \"rectangle\" and transom"
    limits:
      min: 0.15
      max: 1.5
  opening_direction:
    type: "choice"
    default: "in"
    label: "Sashes open"
    group: "Panels"
    options:
      - "in"
      - "out"
    description: "Inward is usual in continental Europe, outward for UK and US casements."
  frame_width:
    type: "length"
    default: 0.07
    label: "Frame width (lining thickness)"
    group: "Frame"
    limits:
      min: 0.02
      max: 0.3
  frame_depth:
    type: "length"
    default: 0.08
    label: "Frame depth"
    group: "Frame"
    limits:
      min: 0.03
      max: 0.4
  sash_width:
    type: "length"
    default: 0.06
    label: "Sash width"
    group: "Sash"
    limits:
      min: 0.03
      max: 0.15
  sash_depth:
    type: "length"
    default: 0.07
    label: "Sash depth"
    group: "Sash"
    limits:
      min: 0.03
      max: 0.15
  glass_thickness:
    type: "length"
    default: 0.024
    label: "Glazing unit thickness"
    group: "Glazing"
    limits:
      min: 0.004
      max: 0.08
  bar_rows:
    type: "integer"
    default: 0
    label: "Glazing bar rows"
    group: "Glazing bars"
    limits:
      min: 0
      max: 8
  bar_columns:
    type: "integer"
    default: 0
    label: "Glazing bar columns (per panel)"
    group: "Glazing bars"
    limits:
      min: 0
      max: 8
  bar_width:
    type: "length"
    default: 0.025
    label: "Glazing bar width"
    group: "Glazing bars"
    visible: "bar_rows > 0 or bar_columns > 0"
    limits:
      min: 0.01
      max: 0.06
  reveal_offset:
    type: "length"
    default: 0.0
    label: "Frame offset from the wall centre"
    group: "Placement"
    limits:
      min: -0.3
      max: 0.3
    description: "Positive towards the outside (+y)."
  interior_sill:
    type: "boolean"
    default: true
    label: "Interior sill board"
    group: "Sills"
  exterior_sill:
    type: "boolean"
    default: true
    label: "Exterior sill"
    group: "Sills"
  sill_projection:
    type: "length"
    default: 0.04
    label: "Sill projection beyond the wall face"
    group: "Sills"
    limits:
      min: 0.0
      max: 0.15
  handle_height:
    type: "length"
    default: 0.0
    label: "Handle height above the sash bottom (0: centre)"
    group: "Hardware"
    limits:
      min: 0.0
      max: 2.0
  frame_material:
    type: "material"
    default: "painted_timber"
    label: "Frame"
    group: "Materials"
    options: "materials"
  lintel:
    type: "boolean"
    default: false
    label: "Lintel over the opening"
    group: "Lintel"
    description: "A nested IfcBeam (LINTEL) the width of the wall, bearing on each side of the opening."
  lintel_height:
    type: "length"
    default: 0.2
    label: "Lintel height"
    group: "Lintel"
    visible: "lintel"
    limits:
      min: 0.05
      max: 1.0
  lintel_bearing:
    type: "length"
    default: 0.15
    label: "Bearing on each side"
    group: "Lintel"
    visible: "lintel"
    limits:
      min: 0.05
      max: 0.5
  lintel_material:
    type: "material"
    default: "reinforced_concrete"
    label: "Lintel material"
    group: "Lintel"
    options: "materials"
    visible: "lintel"
  Pset_DoorWindowGlazingType:
    type: "property_set"
    default: {}
    label: "Pset_DoorWindowGlazingType"
    group: "IFC data"
