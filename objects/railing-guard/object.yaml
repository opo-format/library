id: "railing-guard"
name: "Railing / guard"
version: "0.1.0"
status: "draft"
priority: "P1"
catalogue_id: "C-07"
description: "Guard or balustrade along a 3D path (a balcony edge, a landing or a stair pitch line): posts at the corners and evenly between them, a round top rail, and an infill of balusters, horizontal rails, a glass panel or a mesh panel; or a handrail alone on wall brackets. Defaults are illustrative design values, not norm values; the shared guards and handrails rule sets check height and infill openings."
tags:
  - "railing"
  - "guard"
  - "balustrade"
  - "circulation"
template: "IfcRailing"
references:
  - ref: "ifc-4.3-add2-ifcrailing"
    role: "IFC parameters"
    used: "Class, predefined types, Pset_RailingCommon (Height, Diameter, IsExternal)."
  - ref: "us-ibc"
    role: "rules"
    used: "Guard height and openings through the shared rule sets."
  - ref: "us-irc"
    role: "rules"
    used: "Guard height and openings through the shared rule sets."
sheet:
  scope: "Guard along a path: on a stair (follows the pitch line), a landing, a balcony edge or a void. Infill types: balusters, horizontal rails, glass panel, mesh/sheet; posts; top rail; optional handrail on posts. Nested by stairs and ramps."
  ifc: "IfcRailing · GUARDRAIL / BALUSTRADE · `Pset_RailingCommon` (Height, Diameter, IsExternal)"
  based_on: "Bonsai railing generator (reference: FRAMELESS_PANEL and other types) · IFC · `guards`, `handrails`."
  inputs: "Slot `path` (polyline / curve in plan; on stairs the host stair supplies the 3D pitch path) · host: slab edge, stair flight, ramp."
  parameters: "`height` (default from rule set: 42\" IBC / 36\" IRC; EU no EN/ISO value, default 1.0 m (project value)) · `infill` balusters | rails | glass | mesh · `baluster_spacing` (max clear gap from rule set: 4\" US, 0.1 m UK where required; EU project value, default 0.1 m) · `post_spacing` (default 1.2 m / 4') · profiles: top rail, posts, balusters (preset sections) · `mount` top | side (fascia) · `glass_thickness`, `clamp_type`."
  rules: "Height ≥ rule set (on stairs measured from the pitch line) · clear gap ≤ rule set (computed from spacing and baluster width) · if top rail is the handrail: height within handrail range."
  lod: "3D: low panel · medium posts, top rail, balusters/panel · high + fixings, end returns. Plan: line + posts (medium). Elevation: infill pattern."
parameters:
  predefined_type:
    type: "choice"
    default: "GUARDRAIL"
    label: "Predefined type"
    group: "IFC"
    options:
      - "GUARDRAIL"
      - "BALUSTRADE"
      - "FENCE"
      - "HANDRAIL"
  height:
    type: "length"
    default: 1.0
    label: "Height"
    group: "Size"
    limits:
      min: 0.6
      max: 2.5
    description: "Top of the top rail above the path (on stairs: above the pitch line). Illustrative default; the guards rule sets give minimums."
  infill:
    type: "choice"
    default: "balusters"
    label: "Infill"
    group: "Infill"
    options:
      - "balusters"
      - "rails"
      - "glass"
      - "mesh"
    option_labels:
      balusters: "Vertical balusters"
      rails: "Horizontal rails"
      glass: "Glass panel"
      mesh: "Mesh or sheet panel"
  clear_gap:
    type: "length"
    default: 0.1
    label: "Clear gap of the infill"
    group: "Infill"
    visible: "infill = \"balusters\" or infill = \"rails\""
    limits:
      min: 0.03
      max: 0.3
    description: "Clear space between balusters or rails. Illustrative default; the guards rule sets give maximums."
  bottom_gap:
    type: "length"
    default: 0.05
    label: "Gap under the infill"
    group: "Infill"
    limits:
      min: 0.0
      max: 0.2
  post_spacing:
    type: "length"
    default: 1.2
    label: "Maximum post spacing"
    group: "Posts"
    limits:
      min: 0.3
      max: 3.0
    description: "Posts at the path corners and evenly between them."
  post_size:
    type: "length"
    default: 0.05
    label: "Post size (square)"
    group: "Posts"
    limits:
      min: 0.02
      max: 0.15
  top_rail_diameter:
    type: "length"
    default: 0.05
    label: "Top rail diameter"
    group: "Top rail"
    limits:
      min: 0.02
      max: 0.1
  infill_diameter:
    type: "length"
    default: 0.016
    label: "Baluster or rail diameter"
    group: "Infill"
    visible: "infill = \"balusters\" or infill = \"rails\""
    limits:
      min: 0.008
      max: 0.05
  panel_thickness:
    type: "length"
    default: 0.012
    label: "Panel thickness"
    group: "Infill"
    visible: "infill = \"glass\" or infill = \"mesh\""
    limits:
      min: 0.004
      max: 0.04
  baluster_mode:
    type: "choice"
    default: "from_gap"
    label: "Baluster spacing"
    group: "Infill"
    options:
      - "from_gap"
      - "spacing"
    option_labels:
      from_gap: "From the clear gap"
      spacing: "Set the centre-to-centre spacing"
    visible: "infill = \"balusters\""
  baluster_spacing:
    type: "length"
    default: 0.12
    label: "Baluster spacing (centres)"
    group: "Infill"
    visible: "infill = \"balusters\" and baluster_mode = \"spacing\""
    limits:
      min: 0.04
      max: 0.5
  glass_fixing:
    type: "choice"
    default: "posts"
    label: "Glass fixing"
    group: "Infill"
    options:
      - "posts"
      - "base_channel"
    option_labels:
      posts: "Clamped between posts"
      base_channel: "In a base channel, no posts"
    visible: "infill = \"glass\""
  channel_width:
    type: "length"
    default: 0.08
    label: "Base channel width"
    group: "Infill"
    visible: "infill = \"glass\" and glass_fixing = \"base_channel\""
    limits:
      min: 0.03
      max: 0.2
  channel_height:
    type: "length"
    default: 0.11
    label: "Base channel height"
    group: "Infill"
    visible: "infill = \"glass\" and glass_fixing = \"base_channel\""
    limits:
      min: 0.03
      max: 0.3
  mount:
    type: "choice"
    default: "top"
    label: "Mounting"
    group: "Posts"
    options:
      - "top"
      - "side"
      - "embedded"
      - "wall"
    option_labels:
      top: "On top of the floor or stair"
      side: "On the side face (fascia)"
      embedded: "Cast in or core-drilled"
      wall: "Handrail on wall brackets (no posts or infill)"
  outside:
    type: "choice"
    default: "right"
    label: "Open side of the path (or the wall side)"
    group: "Posts"
    options:
      - "right"
      - "left"
    visible: "mount = \"side\" or mount = \"wall\""
    description: "The side of the path (looking along it) where the drop is; side-mounted guards move to that side. For a wall handrail: the side the wall is on."
  wall_distance:
    type: "length"
    default: 0.07
    label: "Rail centre to the wall"
    group: "Posts"
    visible: "mount = \"wall\""
    limits:
      min: 0.03
      max: 0.2
    description: "Length of the brackets. Illustrative default; the handrails rule sets may set a clearance."
  side_offset:
    type: "length"
    default: 0.06
    label: "Offset from the edge"
    group: "Posts"
    visible: "mount = \"side\""
    limits:
      min: 0.0
      max: 0.3
    description: "Post centre to the path, outward."
  side_drop:
    type: "length"
    default: 0.2
    label: "Post length below the floor"
    group: "Posts"
    visible: "mount = \"side\""
    limits:
      min: 0.05
      max: 0.6
  embed_depth:
    type: "length"
    default: 0.1
    label: "Embedment depth"
    group: "Posts"
    visible: "mount = \"embedded\""
    limits:
      min: 0.03
      max: 0.3
  top_is_handrail:
    type: "boolean"
    default: false
    label: "Top rail is the handrail"
    group: "Top rail"
    description: "Then the handrails rule sets check its height."
  top_rail:
    type: "choice"
    default: "auto"
    label: "Top rail"
    group: "Top rail"
    options:
      - "auto"
      - "yes"
      - "no"
    option_labels:
      auto: "Yes, except on glass"
      yes: "Yes"
      no: "No"
    description: "A frameless glass guard has no rail by default: the glass panels reach the full height."
  panel_width:
    type: "length"
    default: 1.2
    label: "Maximum glass panel width"
    group: "Infill"
    visible: "infill = \"glass\" and glass_fixing = \"base_channel\""
    limits:
      min: 0.3
      max: 3.0
    description: "Glass in a base channel is split into panels no wider than this."
  panel_gap:
    type: "length"
    default: 0.01
    label: "Gap between glass panels"
    group: "Infill"
    visible: "infill = \"glass\" and glass_fixing = \"base_channel\""
    limits:
      min: 0.002
      max: 0.05
  is_external:
    type: "boolean"
    default: false
    label: "External"
    group: "Data"
  material:
    type: "material"
    default: "steel"
    label: "Posts and rails"
    group: "Materials"
    options: "materials"
slots:
  path:
    type: "polyline3"
    default: [[0.0, 0.0, 0.0], [3.0, 0.0, 0.0], [3.0, 2.0, 0.0]]
    description: "Path of the guard; on stairs the host stair supplies the pitch line."
  ground:
    type: "polyline3"
    description: "Optional: the surface the guard stands on, as a line under the path (a stair passes its steps). Posts and balusters reach down to it; without it they stand on the path."
rules:
  derived:
    n_seg: "count(path) - 1"
    pd:
      expr: "for k in 1..n_seg return [(path[k + 1][1] - path[k][1]) / max(sqrt((path[k + 1][1] - path[k][1]) ** 2 + (path[k + 1][2] - path[k][2]) ** 2), 1e-9), (path[k + 1][2] - path[k][2]) / max(sqrt((path[k + 1][1] - path[k][1]) ** 2 + (path[k + 1][2] - path[k][2]) ** 2), 1e-9)]"
      note: "Plan direction of each segment."
    pn:
      expr: "for d in pd return if outside = \"right\" then [d[2], -d[1]] else [-d[2], d[1]]"
      note: "Outward normal of each segment in plan."
    vn:
      expr: "for i in 1..n_seg + 1 return if i = 1 then pn[1] else if i = n_seg + 1 then pn[n_seg] else [(pn[i - 1][1] + pn[i][1]) / (1 + pn[i - 1][1] * pn[i][1] + pn[i - 1][2] * pn[i][2]), (pn[i - 1][2] + pn[i][2]) / (1 + pn[i - 1][1] * pn[i][1] + pn[i - 1][2] * pn[i][2])]"
      note: "Outward offset direction at each path point (mitred at corners)."
    gpath:
      expr: "if mount = \"side\" then for i in 1..count(path) return [path[i][1] + vn[i][1] * side_offset, path[i][2] + vn[i][2] * side_offset, path[i][3]] else path"
      note: "The guard line: the path, moved outward for side mounting."
    post_bottom:
      expr: "if mount = \"side\" then -side_drop else if mount = \"embedded\" then -embed_depth else 0"
      note: "Post foot below the gpath."
    has_posts: "mount != \"wall\" and not(infill = \"glass\" and glass_fixing = \"base_channel\")"
    has_infill:
      expr: "mount != \"wall\""
      note: "A wall handrail has no infill."
    bal_pitch:
      expr: "if baluster_mode = \"spacing\" then baluster_spacing else clear_gap + infill_diameter"
      note: "Baluster centre-to-centre spacing."
    panel_bottom: "if infill = \"glass\" and glass_fixing = \"base_channel\" then 0.02 else bottom_gap"
    seg_len: "for i in 1..n_seg return sqrt((gpath[i + 1][1] - gpath[i][1]) ** 2 + (gpath[i + 1][2] - gpath[i][2]) ** 2 + (gpath[i + 1][3] - gpath[i][3]) ** 2)"
    length: "sum(seg_len)"
    post_points:
      expr: "concatenate(flatten(for i in 1..n_seg return for m in 0..max(1, ceiling(seg_len[i] / post_spacing)) - 1 return {x: gpath[i][1] + (gpath[i + 1][1] - gpath[i][1]) * m / max(1, ceiling(seg_len[i] / post_spacing)), y: gpath[i][2] + (gpath[i + 1][2] - gpath[i][2]) * m / max(1, ceiling(seg_len[i] / post_spacing)), z: gpath[i][3] + (gpath[i + 1][3] - gpath[i][3]) * m / max(1, ceiling(seg_len[i] / post_spacing))}), [{x: gpath[n_seg + 1][1], y: gpath[n_seg + 1][2], z: gpath[n_seg + 1][3]}])"
      note: "Posts at the corners and evenly between them."
    bracket_points:
      expr: "if mount != \"wall\" then [] else concatenate(flatten(for i in 1..n_seg return for m in 0..max(1, ceiling(seg_len[i] / post_spacing)) - 1 return {x: gpath[i][1] + (gpath[i + 1][1] - gpath[i][1]) * m / max(1, ceiling(seg_len[i] / post_spacing)), y: gpath[i][2] + (gpath[i + 1][2] - gpath[i][2]) * m / max(1, ceiling(seg_len[i] / post_spacing)), z: gpath[i][3] + (gpath[i + 1][3] - gpath[i][3]) * m / max(1, ceiling(seg_len[i] / post_spacing)), s: i}), [{x: gpath[n_seg + 1][1], y: gpath[n_seg + 1][2], z: gpath[n_seg + 1][3], s: n_seg}])"
      note: "Wall brackets at the corners and evenly between them, no further apart than the post spacing."
    rail_on:
      expr: "mount = \"wall\" or (if top_rail = \"auto\" then infill != \"glass\" else top_rail = \"yes\")"
      note: "Whether the guard has a top rail."
    infill_top: "if rail_on then height - top_rail_diameter else height"
    panel_pitch: "if has_posts then post_spacing else panel_width"
    panel_end:
      expr: "if has_posts then post_size / 2 + 0.005 else panel_gap / 2"
      note: "How far each glass panel stops short of its division point."
    panels:
      expr: "flatten(for i in 1..n_seg return for m in 0..max(1, ceiling(seg_len[i] / panel_pitch)) - 1 return {i: i, a: m / max(1, ceiling(seg_len[i] / panel_pitch)), b: (m + 1) / max(1, ceiling(seg_len[i] / panel_pitch))})"
      note: "Glass panels: each segment split evenly, no panel wider than the panel pitch."
    panel_boxes:
      expr: "for q in panels return {pa: for c in 1..3 return gpath[q.i][c] + (gpath[q.i + 1][c] - gpath[q.i][c]) * (q.a + panel_end / seg_len[q.i]), pb: for c in 1..3 return gpath[q.i][c] + (gpath[q.i + 1][c] - gpath[q.i][c]) * (q.b - panel_end / seg_len[q.i]), n: [-pd[q.i][2], pd[q.i][1]]}"
      note: "Bottom ends of each panel along the gpath, shortened by the gap, and its plan normal."
    baluster_points:
      expr: "flatten(for i in 1..n_seg return for m in 0..max(1, ceiling(seg_len[i] / bal_pitch)) - 1 return {x: gpath[i][1] + (gpath[i + 1][1] - gpath[i][1]) * m / max(1, ceiling(seg_len[i] / bal_pitch)), y: gpath[i][2] + (gpath[i + 1][2] - gpath[i][2]) * m / max(1, ceiling(seg_len[i] / bal_pitch)), z: gpath[i][3] + (gpath[i + 1][3] - gpath[i][3]) * m / max(1, ceiling(seg_len[i] / bal_pitch))})"
      note: "Balusters at most the baluster spacing apart, centre to centre."
    posts_g:
      expr: "for q in post_points return {x: q.x, y: q.y, z: q.z, g: if (if ground = null or count(ground) < 2 then -1000000 else max(concatenate([-1000000], for k in 1..count(ground) - 1 return if ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) < 0.000001 then -1000000 else if (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) < -0.000001 or (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) > 1.000001 or ((ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) * (ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) + (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y) * (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y)) > 0.0225 then -1000000 else ground[k][3] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][3] - ground[k][3])))) > -1000 then (if ground = null or count(ground) < 2 then -1000000 else max(concatenate([-1000000], for k in 1..count(ground) - 1 return if ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) < 0.000001 then -1000000 else if (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) < -0.000001 or (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) > 1.000001 or ((ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) * (ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) + (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y) * (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y)) > 0.0225 then -1000000 else ground[k][3] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][3] - ground[k][3])))) else q.z}"
      note: "Each post with the height of the surface under it (the ground input), or the gpath where there is none."
    balusters_g:
      expr: "for q in baluster_points return {x: q.x, y: q.y, z: q.z, g: if (if ground = null or count(ground) < 2 then -1000000 else max(concatenate([-1000000], for k in 1..count(ground) - 1 return if ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) < 0.000001 then -1000000 else if (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) < -0.000001 or (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) > 1.000001 or ((ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) * (ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) + (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y) * (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y)) > 0.0225 then -1000000 else ground[k][3] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][3] - ground[k][3])))) > -1000 then (if ground = null or count(ground) < 2 then -1000000 else max(concatenate([-1000000], for k in 1..count(ground) - 1 return if ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) < 0.000001 then -1000000 else if (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) < -0.000001 or (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) > 1.000001 or ((ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) * (ground[k][1] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][1] - ground[k][1]) - q.x) + (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y) * (ground[k][2] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][2] - ground[k][2]) - q.y)) > 0.0225 then -1000000 else ground[k][3] + (((q.x - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (q.y - ground[k][2]) * (ground[k + 1][2] - ground[k][2])) / ((ground[k + 1][1] - ground[k][1]) * (ground[k + 1][1] - ground[k][1]) + (ground[k + 1][2] - ground[k][2]) * (ground[k + 1][2] - ground[k][2]))) * (ground[k + 1][3] - ground[k][3])))) else q.z + bottom_gap}"
      note: "Each baluster with the height it stands on: the surface under it, or the gap above the gpath."
    rail_levels: "for r in 0..max(0, floor((infill_top - bottom_gap) / (clear_gap + infill_diameter)) - 1) return bottom_gap + infill_diameter / 2 + r * (clear_gap + infill_diameter)"
    gap:
      expr: "if infill = \"balusters\" then (if count(baluster_points) > 0 then min(for i in 1..n_seg return seg_len[i] / max(1, ceiling(seg_len[i] / bal_pitch))) - infill_diameter else clear_gap) else if infill = \"rails\" then max(infill_top - bottom_gap - count(rail_levels) * infill_diameter - (count(rail_levels) - 1) * clear_gap, clear_gap) else 0"
      note: "Largest clear opening of the infill (glass and mesh: none)."
    rail_path: "for p in gpath return [p[1], p[2], p[3] + height - top_rail_diameter / 2]"
    plan_path: "for p in gpath return [p[1], p[2]]"
  checks:
    path_points:
      expr: "count(path) >= 2"
      severity: "error"
      message: "The path needs at least two points."
    height_min:
      expr: "mount = \"wall\" or rules.guards = null or rules.guards.height_min = null or height >= rules.guards.height_min"
      severity: "warning"
      message: "The guard is lower than the active rule set requires."
    gap_max:
      expr: "mount = \"wall\" or rules.guards = null or rules.guards.opening_max = null or gap <= rules.guards.opening_max"
      severity: "warning"
      message: "The infill opening is larger than the active rule set allows."
    handrail_range:
      expr: "not(top_is_handrail) or rules.handrails = null or (height >= rules.handrails.height_min and height <= rules.handrails.height_max)"
      severity: "warning"
      message: "As a handrail, the top rail height is outside the active rule set."
    infill_fits:
      expr: "mount = \"wall\" or infill_top > bottom_gap"
      severity: "error"
      message: "The gap under the infill leaves no room for it."
  rulesets:
    guards:
      default: null
      note: "Off by default. Shared variants (library rulesets/guards); no EN/ISO guard height exists."
      fields:
        height_min: "length"
        opening_max: "length"
    handrails:
      default: null
      note: "Off by default. Shared variants (library rulesets/handrails)."
      fields:
        height_min: "length"
        height_max: "length"
recipe:
  post_bodies:
    op: "for_each"
    when: "has_posts"
    args:
      items: "posts_g"
      as: "q"
      do: "box([q.x - post_size / 2, q.y - post_size / 2, q.g + post_bottom], [q.x + post_size / 2, q.y + post_size / 2, q.z + (if rail_on then infill_top else height)])"
  rail_profile:
    op: "circle"
    plane: "profile"
    args:
      center: "[0, 0]"
      radius: "top_rail_diameter / 2"
  top_rail:
    op: "sweep"
    when: "rail_on"
    args:
      profile: "rail_profile"
      path: "rail_path"
  balusters:
    op: "for_each"
    when: "infill = \"balusters\" and has_infill"
    args:
      items: "balusters_g"
      as: "q"
      do: "cylinder([q.x, q.y, q.g], [q.x, q.y, q.z + infill_top], infill_diameter / 2)"
  infill_profile:
    op: "circle"
    plane: "profile"
    when: "infill = \"rails\" and has_infill"
    args:
      center: "[0, 0]"
      radius: "infill_diameter / 2"
  rails:
    op: "for_each"
    when: "infill = \"rails\" and has_infill"
    args:
      items: "rail_levels"
      as: "z"
      do: "sweep(infill_profile, for p in gpath return [p[1], p[2], p[3] + z])"
  panel:
    op: "for_each"
    when: "(infill = \"glass\" or infill = \"mesh\") and has_infill"
    args:
      items: "panel_boxes"
      as: "q"
      do: "loft([for e in [[-1, 0], [1, 0], [1, 1], [-1, 1]] return [q.pa[1] + e[1] * q.n[1] * panel_thickness / 2, q.pa[2] + e[1] * q.n[2] * panel_thickness / 2, q.pa[3] + panel_bottom + e[2] * (infill_top - panel_bottom)], for e in [[-1, 0], [1, 0], [1, 1], [-1, 1]] return [q.pb[1] + e[1] * q.n[1] * panel_thickness / 2, q.pb[2] + e[1] * q.n[2] * panel_thickness / 2, q.pb[3] + panel_bottom + e[2] * (infill_top - panel_bottom)]])"
    note: "Each glass or mesh panel upright, its top and bottom following the gpath."
  channel_profile:
    op: "rectangle"
    plane: "profile"
    when: "infill = \"glass\" and glass_fixing = \"base_channel\" and has_infill"
    args:
      min: "[-channel_width / 2, 0]"
      max: "[channel_width / 2, channel_height]"
  channel:
    op: "sweep"
    when: "infill = \"glass\" and glass_fixing = \"base_channel\" and has_infill"
    args:
      profile: "channel_profile"
      path: "gpath"
  brackets:
    op: "for_each"
    when: "mount = \"wall\""
    args:
      items: "bracket_points"
      as: "q"
      do: "union([cylinder([q.x, q.y, q.z + height - top_rail_diameter / 2 - 0.045], [q.x + pn[q.s][1] * wall_distance, q.y + pn[q.s][2] * wall_distance, q.z + height - top_rail_diameter / 2 - 0.045], 0.008), cylinder([q.x, q.y, q.z + height - top_rail_diameter / 2 - 0.045], [q.x, q.y, q.z + height - top_rail_diameter / 2], 0.008)])"
    note: "An arm to the wall under the rail and a short stem up to it."
  plan_line:
    op: "polyline"
    plane: "xy"
    args:
      points: "plan_path"
  plan_posts:
    op: "for_each"
    plane: "xy"
    when: "has_posts"
    args:
      items: "post_points"
      as: "q"
      do: "rectangle([q.x - post_size / 2, q.y - post_size / 2], [q.x + post_size / 2, q.y + post_size / 2])"
representations:
