id: "curtain-wall-stick"
name: "Stick curtain wall"
version: "0.1.0"
status: "draft"
priority: "P1"
catalogue_id: "O-16"
description: "Mullion-and-transom curtain wall on a drawn baseline: mullions on a module (best division per straight run), a spandrel and a vision zone in every storey, captured, butt-jointed or SSG joints, corners. Members and panels are swappable component objects; per-wall edits (merged cells, a door in a cell) are instance overrides. Defaults are illustrative design values."
tags:
  - "curtain wall"
  - "facade"
  - "grid"
  - "stick system"
template: "IfcCurtainWall"
references:
  - ref: "ifc-4.3-add2-ifccurtainwall"
    role: "IFC parameters"
    used: "Class, USERDEFINED predefined type with the STICK object type, aggregation of members and panels."
sheet:
  scope: "Mullion-and-transom system assembled on site: continuous mullions anchored to slabs, transoms between them, glazing **captured** with pressure plates and caps, or **butt-jointed** (silicone joints, no caps) on one or both directions, or **SSG** (glass bonded, flush outside). Spandrel zones, shadow boxes, vents and doors in cells. Corners outside/inside."
  not_in_scope:
    - "thermal/structural analysis"
    - "bracket design"
  ifc: "IfcCurtainWall · USERDEFINED (STICK) · Priority: high-rise core element; also exercises surface/grid inputs and nesting."
  parameters: "grid U/V (see shared rules) · `mullion_profile` (face width × depth, default 0.05 × 0.15 m / 2\" × 6\") · `transom_profile` · `joint_vertical`, `joint_horizontal` captured | butt_joint | ssg · `cap_profile` (captured: depth, shape) · `butt_joint_width` (default 0.015–0.02 m) · `glass_thickness` (IGU, default 0.032 m) · `glass_offset` (glass plane vs. mullion face) · `spandrel_zone` per floor (height from slab) · `slab_edge` (fire stop line, bracket type)."
  rules: "Shared rules + mullion span between anchors (floor-to-floor) vs. depth."
parameters:
  module:
    type: "length"
    default: 1.5
    label: "Module (mullion spacing)"
    group: "Grid"
    limits:
      min: 0.6
      max: 4.0
    description: "Target spacing; the bays are scaled to fit each straight run (best division)."
  storey_height:
    type: "length"
    default: 3.3
    label: "Storey height"
    group: "Grid"
    limits:
      min: 2.4
      max: 6.0
    description: "The spandrel zone repeats in every storey."
  spandrel_height:
    type: "length"
    default: 0.9
    label: "Spandrel zone height"
    group: "Grid"
    limits:
      min: 0.0
      max: 2.0
    description: "Opaque zone at each floor, from the slab level up; 0 for full-height vision."
  mullion_width:
    type: "length"
    default: 0.05
    label: "Mullion face width"
    group: "Profiles"
    limits:
      min: 0.02
      max: 0.2
  mullion_depth:
    type: "length"
    default: 0.15
    label: "Mullion depth"
    group: "Profiles"
    limits:
      min: 0.03
      max: 0.6
  transom_width:
    type: "length"
    default: 0.05
    label: "Transom face width"
    group: "Profiles"
    limits:
      min: 0.02
      max: 0.2
  transom_depth:
    type: "length"
    default: 0.12
    label: "Transom depth"
    group: "Profiles"
    limits:
      min: 0.03
      max: 0.6
  joint_vertical:
    type: "choice"
    default: "captured"
    group: "Joints"
    options:
      - "captured"
      - "butt_joint"
      - "ssg"
    option_labels:
      captured: "Captured (pressure plate and cap)"
      butt_joint: "Butt joint (silicone, no cap)"
      ssg: "Structural silicone glazing (flush)"
    label: "Vertical joints"
  joint_horizontal:
    type: "choice"
    default: "captured"
    group: "Joints"
    options:
      - "captured"
      - "butt_joint"
      - "ssg"
    option_labels:
      captured: "Captured (pressure plate and cap)"
      butt_joint: "Butt joint (silicone, no cap)"
      ssg: "Structural silicone glazing (flush)"
    label: "Horizontal joints"
  cap_depth:
    type: "length"
    default: 0.02
    label: "Cap depth"
    group: "Joints"
    limits:
      min: 0.005
      max: 0.1
  glass_thickness:
    type: "length"
    default: 0.032
    label: "Glass unit thickness"
    group: "Glazing"
    limits:
      min: 0.006
      max: 0.08
  glass_offset:
    type: "length"
    default: 0.0
    label: "Gap from the glass to the frame face"
    group: "Glazing"
    limits:
      min: 0.0
      max: 0.05
    description: "Gasket space between the back of the glass and the frame members."
  fire_stops:
    type: "boolean"
    default: true
    label: "Fire stops at the slab edges"
    group: "Slab edge"
    description: "A strip of mineral wool closing the gap between the frame and each slab edge above the base."
  slab_edge_gap:
    type: "length"
    default: 0.05
    label: "Gap from the frame back to the slab edge"
    group: "Slab edge"
    visible: "fire_stops"
    limits:
      min: 0.0
      max: 0.5
  fire_stop_depth:
    type: "length"
    default: 0.15
    label: "Fire stop depth (vertical)"
    group: "Slab edge"
    visible: "fire_stops"
    limits:
      min: 0.05
      max: 0.5
  join:
    type: "choice"
    default: "u_continuous"
    label: "Continuous members"
    group: "Grid"
    options:
      - "u_continuous"
      - "v_continuous"
    option_labels:
      u_continuous: "Mullions run through (stick system)"
      v_continuous: "Transoms run through"
  frame_classes:
    type: "component"
    interface: "frame"
    default: null
    label: "Frame members"
    group: "Components"
    allowed:
      ifc_class: "IfcMember"
    classes:
      mullion: "opo-format.org/library/objects/curtain-wall-mullion"
      transom: "opo-format.org/library/objects/curtain-wall-mullion"
      jamb: "opo-format.org/library/objects/curtain-wall-mullion"
      head: "opo-format.org/library/objects/curtain-wall-mullion"
      sill: "opo-format.org/library/objects/curtain-wall-mullion"
      corner: "opo-format.org/library/objects/curtain-wall-mullion"
      corner_inside: "opo-format.org/library/objects/curtain-wall-mullion"
      boundary: "opo-format.org/library/objects/curtain-wall-mullion"
      default: "opo-format.org/library/objects/curtain-wall-mullion"
    description: "One object per edge condition: mullion, transom, jamb (wall ends), head (top), sill (bottom) corner (outside, where the baseline turns left) and corner_inside (where it turns right)."
  panel_classes:
    type: "component"
    interface: "panel"
    default: null
    label: "Panels"
    group: "Components"
    classes:
      vision: "opo-format.org/library/objects/curtain-wall-panel"
      spandrel: "opo-format.org/library/objects/curtain-wall-panel"
      default: "opo-format.org/library/objects/curtain-wall-panel"
slots:
  surface:
    type: "surface"
    default:
      baseline: [[0.0, 0.0], [6.0, 0.0], [6.0, 3.0]]
      base: 0.0
      top: 6.6
    description: "Baseline in plan (the glass plane, front to the right) with base and top heights."
  overrides:
    type: "overrides"
    default: []
    description: "Edits of this placed wall: remove a transom or mullion to merge cells, change a class, put another object in a cell or on a segment."
rules:
  derived:
    base: "surface.base"
    top: "surface.top"
    height: "top - base"
    corner_turns:
      expr: "if count(surface.baseline) < 3 then [] else for k in 2..count(surface.baseline) - 1 return {x: surface.baseline[k][1], y: surface.baseline[k][2], left: (surface.baseline[k][1] - surface.baseline[k - 1][1]) * (surface.baseline[k + 1][2] - surface.baseline[k][2]) - (surface.baseline[k][2] - surface.baseline[k - 1][2]) * (surface.baseline[k + 1][1] - surface.baseline[k][1]) > 0}"
      note: "Each baseline corner and whether the baseline turns left there (an outside corner, the front being to the right)."
    floors:
      expr: "for k in 1..max(1, ceiling(height / storey_height - 0.001)) return (k - 1) * storey_height"
      note: "Floor levels above the base inside the wall."
    levels_within:
      expr: "for f in floors return if f > 0 then f else null"
      note: "Break points of the vertical layout."
    v_pattern:
      expr: "if spandrel_height > 0 then [{size: spandrel_height, cls: \"spandrel\"}, {size: storey_height - spandrel_height, flexible: true, cls: \"vision\"}] else [{size: storey_height, flexible: true, cls: \"vision\"}]"
      note: "Per storey: a spandrel zone, then vision."
  checks:
    spandrel_fits:
      expr: "spandrel_height < storey_height - 0.3"
      severity: "error"
      message: "The spandrel zone leaves no vision zone."
recipe:
  g:
    op: "grid"
    args:
      surface: "surface"
      u: "{pattern: [{size: module, flexible: true}], distribution: \"best_division\"}"
      v: "{pattern: v_pattern, distribution: \"best_division\", within: flatten(for f in levels_within return if f = null then [] else [f])}"
      join: "join"
      overrides: "overrides"
      classes:
        segment: "if segment.line_cls = \"corner\" then (if flatten(for t in corner_turns return if abs(t.x - segment.start[1]) + abs(t.y - segment.start[2]) < 0.001 then [t.left] else [])[1] = false then \"corner_inside\" else \"corner\") else if segment.line_cls = \"border\" then (if segment.direction = \"v\" then \"jamb\" else if segment.start[3] < surface.base + 0.001 then \"sill\" else \"head\") else if segment.direction = \"v\" then \"mullion\" else \"transom\""
      widths: "{mullion: reported(component_for(frame_classes, \"mullion\"), \"face_width\", {profile_width: mullion_width}), jamb: reported(component_for(frame_classes, \"jamb\"), \"face_width\", {profile_width: mullion_width}), head: reported(component_for(frame_classes, \"head\"), \"face_width\", {profile_width: transom_width}), sill: reported(component_for(frame_classes, \"sill\"), \"face_width\", {profile_width: transom_width}), corner: reported(component_for(frame_classes, \"corner\"), \"face_width\", {profile_width: mullion_width, profile_depth: mullion_depth, glass_offset: glass_offset, glass_thickness: glass_thickness, shape: \"corner_outside\"}), corner_inside: reported(component_for(frame_classes, \"corner_inside\"), \"face_width\", {profile_width: mullion_width, shape: \"corner_inside\"}), transom: reported(component_for(frame_classes, \"transom\"), \"face_width\", {profile_width: transom_width})}"
    note: "Mullions on the module, a spandrel and a vision zone in every storey."
  frames:
    op: "for_each"
    args:
      items: "g.segments"
      as: "s"
      do: "instance(if s.component != null then s.component else component_for(frame_classes, s.cls), if s.values != null then s.values else {profile_width: if s.direction = \"v\" then mullion_width else transom_width, profile_depth: if s.direction = \"v\" then mullion_depth else transom_depth, joint: if s.direction = \"v\" then joint_vertical else joint_horizontal, cap_depth: cap_depth, glass_thickness: glass_thickness, glass_offset: glass_offset, shape: if s.cls = \"corner\" then \"corner_outside\" else if s.cls = \"corner_inside\" then \"corner_inside\" else \"straight\"}, {path: s.path, normal: s.normal, trim_start: s.trim_start, trim_end: s.trim_end, left_cell: (if s.cls = \"corner\" or s.cls = \"corner_inside\" then flatten(for c in g.cells return if c.id = s.cells[1] then [c] else [])[1] else null), right_cell: (if s.cls = \"corner\" or s.cls = \"corner_inside\" then flatten(for c in g.cells return if c.id = s.cells[2] then [c] else [])[1] else null)})"
  panels:
    op: "for_each"
    args:
      items: "g.cells"
      as: "c"
      do: "instance(if c.component != null then c.component else component_for(panel_classes, c.cls), if c.values != null then c.values else {kind: if c.cls = \"spandrel\" then \"spandrel\" else \"vision\", glass_thickness: glass_thickness}, {outline: c.panel_outline, normal: c.normal, insets: c.insets})"
  fire_stop_profile:
    op: "rectangle"
    plane: "profile"
    when: "fire_stops"
    args:
      min: "[glass_thickness / 2 + glass_offset + max(mullion_depth, transom_depth), -fire_stop_depth]"
      max: "[glass_thickness / 2 + glass_offset + max(mullion_depth, transom_depth) + slab_edge_gap, 0]"
  fire_stops_3d:
    op: "for_each"
    when: "fire_stops and slab_edge_gap > 0"
    args:
      items: "flatten(for f in levels_within return if f = null then [] else [f])"
      as: "f"
      do: "sweep(fire_stop_profile, for p in surface.baseline return [p[1], p[2], base + f])"
    note: "Behind the frame, at each floor above the base; the profile u axis points to the back (left of the baseline)."
  plan_frames:
    op: "for_each"
    plane: "xy"
    args:
      items: "for s in g.segments return if s.direction = \"v\" and s.start[3] < base + 0.001 then s else null"
      as: "s"
      do: "if s = null then null else instance(component_for(frame_classes, s.cls), {profile_width: if s.direction = \"v\" then mullion_width else transom_width, profile_depth: if s.direction = \"v\" then mullion_depth else transom_depth, joint: if s.direction = \"v\" then joint_vertical else joint_horizontal, cap_depth: cap_depth, glass_thickness: glass_thickness, glass_offset: glass_offset, shape: if s.cls = \"corner\" then \"corner_outside\" else if s.cls = \"corner_inside\" then \"corner_inside\" else \"straight\"}, {path: s.path, normal: s.normal, trim_start: 0, trim_end: 0, left_cell: (if s.cls = \"corner\" or s.cls = \"corner_inside\" then flatten(for c in g.cells return if c.id = s.cells[1] then [c] else [])[1] else null), right_cell: (if s.cls = \"corner\" or s.cls = \"corner_inside\" then flatten(for c in g.cells return if c.id = s.cells[2] then [c] else [])[1] else null)}, \"plan.medium\")"
  plan_glass:
    op: "for_each"
    plane: "xy"
    args:
      items: "for c in g.cells return if c.row = 0 then c else null"
      as: "c"
      do: "if c = null then null else line([c.panel_outline[1][1], c.panel_outline[1][2]], [c.panel_outline[2][1], c.panel_outline[2][2]])"
representations:
  model.low:
    context: "model"
    lod: "low"
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "frames"
        part: "Frame members"
      - geometry: "panels"
        part: "Panels"
      - geometry: "fire_stops_3d"
        material: "\"mineral_wool\""
        part: "Fire stops"
  model.medium:
    context: "model"
    lod: "medium"
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "frames"
        part: "Frame members"
      - geometry: "panels"
        part: "Panels"
      - geometry: "fire_stops_3d"
        material: "\"mineral_wool\""
        part: "Fire stops"
  model.high:
    context: "model"
    lod: "high"
    source: "authored"
    ifc:
      context: "Body"
      targetView: "MODEL_VIEW"
    items:
      - geometry: "frames"
        part: "Frame members"
      - geometry: "panels"
        part: "Panels"
      - geometry: "fire_stops_3d"
        material: "\"mineral_wool\""
        part: "Fire stops"
  plan.low:
    context: "plan"
    lod: "low"
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_frames"
        class: "cut"
      - geometry: "plan_glass"
        class: "cut"
  plan.medium:
    context: "plan"
    lod: "medium"
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_frames"
        class: "cut"
      - geometry: "plan_glass"
        class: "cut"
  plan.high:
    context: "plan"
    lod: "high"
    source: "authored"
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    items:
      - geometry: "plan_frames"
        class: "cut"
      - geometry: "plan_glass"
        class: "cut"
host:
  is_host: false
  level: "Base and top heights of the surface input."
  nested:
    objects:
      - "opo-format.org/library/objects/curtain-wall-mullion"
      - "opo-format.org/library/objects/curtain-wall-panel"
    note: "Default components; others can be chosen or set per member."
materials:
  - "aluminium"
  - "glass"
  - "mineral_wool"
ifc:
  class: "IfcCurtainWall"
  predefinedType: "\"USERDEFINED\""
  objectType: "\"STICK\""
  parameter_pset: "OPO_Parameters"
  decomposition: "IfcCurtainWall aggregating one IfcMember per grid segment and one IfcPlate per cell (IfcRelAggregates)."
