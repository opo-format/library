      max_scale: 50
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    note: "Frame, casings and stop are cut from the 3D at the view's cut height; the leaf is drawn open with its swing."
    source: "derived"
    derive:
      from: "model.high"
      method: "cut_or_project"
      exclude_parts:
        - "Leaf"
        - "Hardware"
    overlay:
