        part: "Hardware"
  plan.low:
    context: "plan"
    lod: "low"
    scale:
      min_scale: 200
    ifc:
      context: "Plan"
      targetView: "PLAN_VIEW"
    source: "derived"
    derive:
      from: "model.low"
      method: "cut_or_project"
      exclude_parts:
        - "Leaf"
        - "Hardware"
    overlay:
      - geometry: "leaf_line_plan"
        class: "cut"
      - geometry: "swing_arc_plan"
        class: "annotation"
