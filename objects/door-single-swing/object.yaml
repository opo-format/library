    ifc:
      context: "Profile"
      targetView: "ELEVATION_VIEW"
    derive:
      from: "model.high"
      method: "project"
    overlay:
      - geometry: "swing_indicator"
        class: "annotation"
        role: "swing"
  section:
    context: "section"
    lod: "all"
    source: "derived"
    ifc:
      context: "Profile"
      targetView: "SECTION_VIEW"
    derive:
      from: "model.{lod}"
      method: "cut"
host:
  hosts:
    - "IfcWall"
  inputs:
    thickness:
      type: "length"
      from: "host thickness at the insertion point"
      default: 0.115
  void:
    geometry: "void"
    ifc: "IfcOpeningElement"
  insertion:
    point: "[0, 0, 0]"
    description: "Centre of the opening width, at finished floor level, on the host's axis. x along the wall, y through it (front = swing side), z up."
  flip:
    x:
      label: "Hinge side"
      values:
        - "left"
        - "right"
    "y":
      label: "Swing side"
      values:
        - "front"
        - "back"
  snap_points:
    - name: "opening_left"
      point: "[-opening_width / 2, 0, 0]"
    - name: "opening_right"
      point: "[opening_width / 2, 0, 0]"
    - name: "opening_head"
      point: "[0, 0, opening_height]"
handles:
  - parameter: "nominal_width"
    view:
      - "elevation"
      - "model"
    at: "[opening_width / 2, 0, opening_height / 2]"
    axis: "x"
    symmetric: true
  - parameter: "nominal_height"
    view:
      - "elevation"
      - "model"
    at: "[0, 0, opening_height]"
    axis: "z"
  - parameter: "handle_height"
    view:
      - "elevation"
    at: "[handle_x, 0, handle_height]"
    axis: "z"
  - parameter: "opening_angle"
    view:
      - "plan"
    at: "leaf_tip"
    kind: "angle"
    center: "hinge"
materials:
  - "painted_timber"
  - "stainless_steel"
ifc:
  class: "IfcDoor"
  predefinedType: "DOOR"
  properties:
    bsi::ifc::prop::OverallWidth: "frame_width"
    bsi::ifc::prop::OverallHeight: "frame_height"
    bsi::ifc::prop::OperationType: "if flip.x = \"right\" then \"SINGLE_SWING_RIGHT\" else \"SINGLE_SWING_LEFT\""
    bsi::ifc::prop::LiningDepth: "lining_depth"
    bsi::ifc::prop::LiningThickness: "lining_thickness"
    bsi::ifc::prop::CasingThickness: "if has_casing then casing_width else null"
    bsi::ifc::prop::CasingDepth: "if has_casing then casing_depth else null"
    bsi::ifc::prop::ThresholdThickness: "if threshold then threshold_thickness else 0"
    bsi::ifc::prop::ThresholdDepth: "if threshold then lining_depth else null"
    bsi::ifc::prop::PanelDepth: "leaf_thickness"
    bsi::ifc::prop::PanelWidth: "1"
    bsi::ifc::prop::PanelOperation: "\"SWINGING\""
    bsi::ifc::prop::PanelPosition: "\"MIDDLE\""
  property_sets:
    Pset_DoorLiningProperties:
      - "LiningDepth"
      - "LiningThickness"
      - "CasingThickness"
      - "CasingDepth"
      - "ThresholdThickness"
      - "ThresholdDepth"
    Pset_DoorPanelProperties:
      - "PanelDepth"
      - "PanelWidth"
      - "PanelOperation"
      - "PanelPosition"
  parameter_pset: "OPO_Parameters"
  note: "IFC4.3 deprecates IfcDoorLiningProperties/IfcDoorPanelProperties in favour of these property sets. All parameters are also written to OPO_Parameters."
