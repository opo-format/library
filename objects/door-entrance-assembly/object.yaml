id: "door-entrance-assembly"
name: "Entrance door assembly (sidelights, fanlight)"
status: "planned"
priority: "P2"
catalogue_id: "O-06"
ifc:
  class: "IfcDoor"
sheet:
  scope: "Door with sidelight(s) and/or fanlight in one outer frame. Glazed or solid panels, optional threshold drip, letter plate."
  not_in_scope:
    - "storefront systems (O-16)"
  ifc: "IfcDoor · DOOR containing nested O-01/O-02 + fixed glazed panels (IfcWindow · WINDOW, FIXEDCASEMENT) or one IfcDoor with transom/mullions (`TransomOffset`, `TransomThickness`)"
  based_on: "bim-all-doors sidelight and fanlight parameters (`gs_sidelight_left/right`, sidelight widths, `gs_transom_height`, transom frame widths; CC0) · IFC TransomOffset/TransomThickness."
  inputs: "Host wall."
  parameters: "`sidelight_left` / `sidelight_right` (bool + width) · `fanlight` (bool + height) · `mullion_width`, `transom_width` · panel fill: glass | solid · door: nested O-01 or O-02 with its own parameters passed down."
  rules: "Glazing next to doors and low glazing needs safety glazing under local rules (check; values to add to `rulesets.md` before building)."
  sizes: "Built from the door catalogues + sidelight widths *(to collect per market)*."
  lod: "As O-01 for the door; fixed panels as O-11."
