name: Release

# Publish a .opo package of every object and template when a release is published.
# Nothing built is committed (decision 0016).

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  packages:
    name: "Packages"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: opo
        run: echo "rev=$(cat opo-version)" >> "$GITHUB_OUTPUT"
      - name: "Cache the opo command"
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/opo
          key: opo-${{ steps.opo.outputs.rev }}
      - name: "Cache the IFC sources"
        uses: actions/cache@v4
        with:
          path: .cache/ifc
          key: ifc-${{ hashFiles('ifc-version') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: "Install opo at the pinned commit"
        run: test -x ~/.cargo/bin/opo || just install
      - run: just release-check
      - run: just packages
      - name: "Attach the packages to the release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/packages/*.opo --clobber
