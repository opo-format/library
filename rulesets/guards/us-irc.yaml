kind: "ruleset"
id: "guards"
label: "US International Residential Code, R312"
uri: "https://opo-format.org/rulesets/guards/us-irc@0.1"
source: "IRC R312: guard height and openings."
values:
  height_min:
    value: "inch(36)"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R312.1.2: minimum guard height, 36 in (914 mm); 34 in on the open sides of stairs, measured from the nosing line. Checked against the code text as quoted in municipal IRC handouts."
  opening_max:
    value: "inch(4)"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R312.1.3: a 4 in (102 mm) sphere must not pass. Checked against the code text as quoted in municipal IRC handouts."
  stair_side_opening_max:
    value: "inch(4.375)"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R312.1.3 exception: on the open sides of stairs, a 4 3/8 in (111 mm) sphere must not pass. Checked against the code text as quoted in municipal IRC handouts."
