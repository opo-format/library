kind: "ruleset"
id: "accessibility"
label: "2010 ADA Standards"
uri: "https://opo-format.org/rulesets/accessibility/us-ada-2010@0.1"
source: "2010 ADA Standards: doors (404), ramps (405), toilet rooms (604, 606)."
values:
  min_clear_width:
    value: "inch(32)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 404.2.3: door clear width at least 32 in (815 mm), measured between the face of the door open 90° and the stop. Checked against the Access Board text of the standards and its guides."
  measure: "\"usable_clear_width\""
  handle_min:
    value: "inch(34)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 404.2.7: operable parts of door hardware at least 34 in (865 mm) above the floor. Checked against the Access Board text of the standards and its guides."
  handle_max:
    value: "inch(48)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 404.2.7: at most 48 in (1220 mm). Checked against the Access Board text of the standards and its guides."
  threshold_max:
    value: "inch(0.5)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 404.2.5: thresholds at most 1/2 in (13 mm) high (beveled above 1/4 in). Checked against the Access Board text of the standards and its guides."
  ramp_gradient_max:
    value: "1 / 12"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 405.2: running slope not steeper than 1:12. Checked against the Access Board text of the standards and its guides."
  ramp_rise_max:
    value: "inch(30)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 405.6: rise of a ramp run at most 30 in (760 mm). Checked against the Access Board text of the standards and its guides."
  ramp_width_min:
    value: "inch(36)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 405.5: clear width of a ramp run, between handrails where provided, at least 36 in (915 mm). Checked against the Access Board text of the standards and its guides."
  ramp_landing_min:
    value: "inch(60)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 405.7.3: landing clear length at least 60 in (1525 mm). Checked against the Access Board text of the standards and its guides."
  wc_seat_min:
    value: "inch(17)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 604.4: water closet seat height at least 17 in (430 mm) to the top of the seat. Checked against the Access Board text of the standards and its guides."
  wc_seat_max:
    value: "inch(19)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 604.4: at most 19 in (485 mm). Checked against the Access Board text of the standards and its guides."
  basin_rim_max:
    value: "inch(34)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 606.3: lavatory rim or counter, whichever is higher, at most 34 in (865 mm). Checked against the Access Board text of the standards and its guides."
  basin_knee_min:
    value: "inch(27)"
    source: "us-ada-2010-standards"
    status: "norm"
    note: "2010 ADA Standards 606.2 with 306.3: knee clearance under the lavatory at least 27 in (685 mm) high. Checked against the Access Board text of the standards and its guides."
