kind: "ruleset"
id: "escape_windows"
label: "US International Residential Code, R310"
uri: "https://opo-format.org/rulesets/escape_windows/us-irc@0.1"
source: "IRC R310: emergency escape and rescue openings."
values:
  net_area_min:
    value: "0.53"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R310.2.1: net clear opening at least 5.7 sq ft (0.530 m²). Checked against the code text as quoted in municipal IRC handouts."
  net_area_grade_min:
    value: "0.465"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R310.2.1 exception: grade floor or below-grade openings, at least 5 sq ft (0.465 m²). Checked against the code text as quoted in municipal IRC handouts."
  net_height_min:
    value: "inch(24)"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R310.2.1: net clear height at least 24 in (610 mm). Checked against the code text as quoted in municipal IRC handouts."
  net_width_min:
    value: "inch(20)"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R310.2.1: net clear width at least 20 in (508 mm). Checked against the code text as quoted in municipal IRC handouts."
  sill_max:
    value: "inch(44)"
    source: "us-irc"
    status: "norm"
    note: "IRC 2021 R310.2.2: sill at most 44 in (1118 mm) above the floor. Checked against the code text as quoted in municipal IRC handouts."
