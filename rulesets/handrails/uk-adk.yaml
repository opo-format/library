kind: "ruleset"
id: "handrails"
label: "UK Approved Document K"
uri: "https://opo-format.org/rulesets/handrails/uk-adk@0.1"
source: "Approved Document K (England): handrail height and sides."
values:
  height_min:
    value: "mm(900)"
    source: "uk-approved-document-k"
    status: "norm"
    note: "Approved Document K (2013 edition incorporating 2013 amendments), section 1: handrail height at least 900 mm above the pitch line or floor. Checked against published summaries of the AD K guidance (Designing Buildings Wiki, RICS); a 2026 review proposes changes for general access and utility stairs that are not yet in force."
  height_max:
    value: "mm(1000)"
    source: "uk-approved-document-k"
    status: "norm"
    note: "Approved Document K (2013 edition incorporating 2013 amendments), section 1: at most 1000 mm. Checked against published summaries of the AD K guidance (Designing Buildings Wiki, RICS); a 2026 review proposes changes for general access and utility stairs that are not yet in force."
  both_sides_width:
    value: "mm(1000)"
    source: "uk-approved-document-k"
    status: "norm"
    note: "Approved Document K (2013 edition incorporating 2013 amendments), section 1: handrails on both sides of stairs 1000 mm wide or more. Checked against published summaries of the AD K guidance (Designing Buildings Wiki, RICS); a 2026 review proposes changes for general access and utility stairs that are not yet in force."
