kind: "ruleset"
id: "stairs"
label: "US International Building Code, 1011"
uri: "https://opo-format.org/rulesets/stairs/us-ibc@0.1"
source: "IBC 1011 (other buildings): riser, tread depth, width, headroom."
values:
  riser_min:
    value: "inch(4)"
    source: "us-ibc"
    status: "norm"
    note: "IBC 2021 1011.5.2: riser height at least 4 in (102 mm). Checked against the code text as adopted and quoted by state and city codes and ICC material."
  riser_max:
    value: "inch(7)"
    source: "us-ibc"
    status: "norm"
    note: "IBC 2021 1011.5.2: riser height at most 7 in (178 mm). Checked against the code text as adopted and quoted by state and city codes and ICC material."
  going_min:
    value: "inch(11)"
    source: "us-ibc"
    status: "norm"
    note: "IBC 2021 1011.5.2: tread depth at least 11 in (279 mm), measured between the nosings. Checked against the code text as adopted and quoted by state and city codes and ICC material."
  going_max: "null"
  rule_min: "null"
  rule_max: "null"
  width_min:
    value: "inch(44)"
    source: "us-ibc"
    status: "norm"
    note: "IBC 2021 1011.2: at least 44 in (1118 mm); stairways serving fewer than 50 occupants may be 36 in (914 mm). Checked against the code text as adopted and quoted by state and city codes and ICC material."
  headroom_min:
    value: "inch(80)"
    source: "us-ibc"
    status: "norm"
    note: "IBC 2021 1011.3: headroom at least 80 in (2032 mm) above the nosing line. Checked against the code text as adopted and quoted by state and city codes and ICC material."
